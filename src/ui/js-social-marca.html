<style>

/* página do cliente */
.smx-hero { padding: 22px 24px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: start; position: relative; overflow: hidden; }
.smx-hero::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--smc-cor, var(--destaque)); }

.smx-bloco p { margin: 0; white-space: pre-wrap; line-height: 1.6; font-size: 14px; }
.smx-bloco p.vaz { color: var(--apagado); font-style: italic; }
.smx-cores { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.smx-cor { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--linha); }
.smx-logo { max-height: 42px; max-width: 140px; object-fit: contain; }
.smx-pil { display: grid; gap: 10px; }
.smx-pil .linha { display: grid; grid-template-columns: 150px minmax(0, 1fr) 92px; gap: 12px; align-items: center; font-size: 13px; }

.smx-pil .trilho { position: relative; height: 10px; border-radius: 100px; background: var(--afundado); }

.smx-pil .num { text-align: right; color: var(--suave); font-size: 12px; }
.smx-pil .num b { color: var(--texto); }
.smx-leg { display: flex; gap: 14px; font-size: 11.5px; color: var(--suave); margin-top: 10px; }
.smx-leg i { display: inline-block; width: 12px; height: 8px; border-radius: 3px; background: var(--destaque); margin-right: 6px; }
.smx-leg i.meta { width: 2px; height: 12px; background: var(--texto); vertical-align: middle; }
.smx-semanas { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding-top: 8px; }
.smx-semanas div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; font-size: 11px; color: var(--suave); }
.smx-semanas span.b { width: 100%; max-width: 34px; border-radius: 6px 6px 2px 2px; background: var(--destaque); min-height: 3px; }
.smx-semanas span.b.baixo { background: color-mix(in srgb, var(--alerta) 70%, var(--superficie)); }
.smx-meta-linha { position: relative; }
.smx-evol { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.smx-evol .cv-kpi { padding: 14px 16px; }

/* jornada */
.smj-filtros { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.smj-lista { position: relative; display: grid; gap: 0; padding-left: 26px; }
.smj-lista::before { content: ''; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 2px; background: var(--linha); }
.smj-item { position: relative; padding: 0 0 18px; }
.smj-item::before { content: ''; position: absolute; left: -22px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--superficie); border: 2px solid var(--smj-cor, var(--destaque)); }
.smj-item .cab { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--suave); }
.smj-item h4 { margin: 4px 0 2px; font-weight: 600; font-size: 14.5px; }
.smj-item p { margin: 2px 0 0; font-size: 13.5px; color: var(--texto); white-space: pre-wrap; }
.smj-diff { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: stretch; margin-top: 8px; font-size: 12.5px; }
.smj-diff div { padding: 8px 10px; border-radius: 10px; background: var(--afundado); white-space: pre-wrap; }
.smj-diff div.novo { background: var(--destaque-claro); }
.smj-diff span { align-self: center; color: var(--apagado); }
.smj-acoes { position: absolute; right: 0; top: 0; display: flex; gap: 2px; }
.smj-t-feedback { --smj-cor: #3E7CB1; } .smj-t-ajuste { --smj-cor: var(--cobre); } .smj-t-overdelivering { --smj-cor: #2F9E6A; }
.smj-t-reuniao { --smj-cor: var(--apagado); } .smj-t-marco { --smj-cor: var(--destaque); } .smj-t-alerta { --smj-cor: var(--alerta); }
.smj-pil { background: color-mix(in srgb, var(--smj-cor) 14%, var(--superficie)); color: var(--smj-cor); }

/* reports */
.smr-lista { display: grid; gap: 14px; }
.smr { padding: 16px 18px; display: grid; gap: 12px; }
.smr-cab { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.smr-cab h3 { font-weight: 400; font-size: 18px; margin-right: auto; }
.smr-nums { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.smr-nums div { padding: 10px 12px; border-radius: 12px; background: var(--afundado); }
.smr-nums span { display: block; font: var(--rotulo); letter-spacing: .1em; text-transform: uppercase; color: var(--suave); }
.smr-nums b { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.smr-nums em { font-style: normal; font-size: 11.5px; margin-left: 4px; }
.smr-nums em.s { color: var(--ok); } .smr-nums em.d { color: var(--alerta); }
.smr-drop { border: 2px dashed var(--linha-forte); border-radius: var(--raio); padding: 22px; text-align: center; color: var(--suave); cursor: pointer; transition: border-color .15s, background .15s; }
.smr-drop:hover, .smr-drop.sobre { border-color: var(--destaque); background: var(--destaque-claro); }
.smr-drop b { display: block; color: var(--texto); font-weight: 500; margin-bottom: 4px; }
.smr-lido { font-size: 12.5px; color: var(--ok); margin-top: 8px; }
.smm-pilares { display: grid; gap: 8px; }
.smm-pilares .p { display: grid; grid-template-columns: minmax(0, 1fr) 90px 36px; gap: 8px; }

@media (max-width: 1000px) {
  .smg-tabs, .smx-grade, .smx-evol { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 820px) {
  .smx-hero { grid-template-columns: minmax(0, 1fr); padding: 18px; }
  .smx-pil .linha { grid-template-columns: 100px minmax(0, 1fr) 70px; }
  .smm-fmt { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .smj-diff { grid-template-columns: minmax(0, 1fr); }
  .smj-diff span { display: none; }
}
</style>
<script>
/**
 * Social media por cliente: visão geral da carteira, página de cada cliente com o perfil de marca e a estratégia,
 * o dashboard de conteúdo (frequência, pilares, formatos, Instagram), os pedidos de próximos posts, a jornada
 * e os reports mensais (com leitura do PDF do Instagram e apresentação para a reunião).
 */
const SM_JOR = { feedback: 'Feedback', ajuste: 'Ajuste', overdelivering: 'Overdelivering', reuniao: 'Reunião', marco: 'Marco', alerta: 'Alerta' };
const SM_ABAS = [['estrategia', 'Estratégia'], ['conteudo', 'Conteúdo'], ['pedidos', 'Pedidos'], ['jornada', 'Jornada'], ['reports', 'Reports']];
const SM_PRIO = { alta: 'Alta', normal: 'Normal', baixa: 'Baixa' };
const SM_REP = [['seguidores', 'Seguidores'], ['novosSeguidores', 'Novos seguidores'], ['alcance', 'Contas alcançadas'], ['impressoes', 'Impressões'],
  ['interacoes', 'Interações'], ['engajamento', 'Engajamento (%)'], ['visitasPerfil', 'Visitas ao perfil'], ['cliquesLink', 'Cliques no link'], ['postsPublicados', 'Posts publicados']];

// ---------- dados ----------
function smMarcas() { return (S.dados && S.dados.marcas) || []; }
function smMarca(id) { return smMarcas().find(function (m) { return m.clienteId === id; }) || null; }
function smPedidos() { return (S.dados && S.dados.pedidos) || []; }
function smJornada(id) { return ((S.dados && S.dados.jornada) || []).filter(function (j) { return j.clienteId === id; }).sort(function (a, b) { return (b.data + b.criadoEm).localeCompare(a.data + a.criadoEm); }); }
function smReports(id) { return ((S.dados && S.dados.reports) || []).filter(function (r) { return r.clienteId === id; }).sort(function (a, b) { return a.mes.localeCompare(b.mes); }); }
// Reserva: as mesmas fases de FASES_ESTRATEGIA (SocialMarca.gs), caso o servidor ainda não as mande.
const SM_FASES = ['Criação de base', 'Fortalecimento de marca', 'Autoridade e educação', 'Captação de leads', 'Conversão e vendas', 'Retenção e comunidade'];
function smFases() { const l = S.dados.listas && S.dados.listas.fasesEstrategia; return l && l.length ? l : SM_FASES; }
function smNumBr(v, casas) { return Number(v || 0).toLocaleString('pt-BR', { maximumFractionDigits: casas == null ? 0 : casas }); }
function smInsta(c) { const u = String((c && c.instagram) || '').replace(/^@/, '').trim(); return u ? { u: '@' + u, url: 'https://www.instagram.com/' + encodeURIComponent(u) + '/' } : null; }
function smMesNome(mes) { const d = new Date(mes + '-01T12:00:00'); return smCap(d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })); }

function smOpcoesPilar(cid, atual) {
  const m = smMarca(cid), l = m ? m.pilares.map(function (p) { return p.nome; }) : [];
  return opcoes(smLista(l, atual), atual, l.length ? 'Sem pilar' : 'Defina os pilares no perfil');
}

// Números do cliente: frequência real x meta, Instagram, filas, distribuição por pilar e formato.
function smMetricas(cid) {
  const hoje = S.dados.hoje, m = smMarca(cid), meta = m ? Number(m.frequencia) || 0 : 0;
  const ps = smPosts().filter(function (p) { return p.clienteId === cid; });
  const pubs = ps.filter(function (p) { return p.status === 'publicado' && p.data && p.data <= hoje; });
  const desde30 = smSomaDias(hoje, -30), desde90 = smSomaDias(hoje, -90);
  const ult30 = pubs.filter(function (p) { return p.data > desde30; });
  const freq = Math.round(ult30.length / (30 / 7) * 10) / 10;
  const igDias = m && m.igUltimoPost ? Math.max(0, Math.round((smData(hoje) - smData(m.igUltimoPost)) / 864e5)) : null;
  const limite = meta ? Math.max(3, Math.ceil(7 / meta * 2)) : 7;
  const dist = function (campo, base) {
    const l = pubs.filter(function (p) { return p.data > desde90; }), c = {};
    l.forEach(function (p) { const k = p[campo] || 'Sem ' + (campo === 'pilar' ? 'pilar' : 'formato'); c[k] = (c[k] || 0) + 1; });
    const nomes = smLista(base, null).concat(Object.keys(c).filter(function (k) { return base.indexOf(k) < 0; }));
    return { total: l.length, linhas: nomes.map(function (k) { return { nome: k, n: c[k] || 0, pct: l.length ? Math.round((c[k] || 0) * 100 / l.length) : 0 }; }) };
  };
  return {
    meta: meta, freq: freq, ult30: ult30.length,
    pubMes: pubs.filter(function (p) { return p.data.slice(0, 7) === hoje.slice(0, 7); }).length,
    igDias: igDias, igAtraso: igDias != null && igDias > limite, limite: limite,
    apr: ps.filter(function (p) { return p.status === 'aprovacao'; }).length,
    prod: ps.filter(function (p) { return p.status === 'producao'; }).length,
    atr: ps.filter(smAtrasado).length,
    pedidos: smPedidos().filter(function (p) { return p.clienteId === cid && p.status === 'pendente'; }).length,
    pilares: dist('pilar', m ? m.pilares.map(function (p) { return p.nome; }) : []),
    formatos: dist('formato', m ? Object.keys(m.formatosMeta || {}) : []),
    pubs: pubs,
  };
}

function smPilulaIg(x, m) {
  if (!m || !m.igUltimoPost) return '<span class="pilula">' + icone('social') + 'Instagram não verificado</span>';
  const txt = x.igDias === 0 ? 'hoje' : x.igDias === 1 ? 'ontem' : 'há ' + x.igDias + ' dias';
  return '<span class="pilula ' + (x.igAtraso ? 'alerta' : 'ok') + '" title="Última postagem no Instagram: ' + esc(dataBr(m.igUltimoPost)) + '">Último post ' + txt + '</span>';
}

// ---------- visão geral ----------
function smGeral(lista) {
  const f = S.filtrosSocial;
  const marcas = smMarcas().filter(function (m) { return cliente(m.clienteId) && (f.statusCli === 'todos' || (m.status || 'ativo') === f.statusCli) && (!f.cliente || m.clienteId === f.cliente); })
    .sort(function (a, b) { return nomeCliente(a.clienteId).localeCompare(nomeCliente(b.clienteId), 'pt-BR'); });
  const conta = function (s) { return smMarcas().filter(function (m) { return (m.status || 'ativo') === s; }).length; };
  const semPerfil = S.dados.clientes.filter(function (c) { return !c.arquivado && !smMarca(c.id); });
  const ig = '<div class="cartao smg-ig"><span class="t">' + icone('social') + '<span>Verificação diária do Instagram: <b>' + (S.dados.igDiario ? 'ligada' : 'desligada') + '</b>' +
    (S.dados.igUltimaRodada ? ' · última rodada ' + esc(quando(S.dados.igUltimaRodada)) : '') + '</span></span>' +
    (pode('colaborador') && smMarcas().length ? '<button class="btn btn-peq" data-ig-verificar="">' + icone('recarregar') + 'Verificar agora</button>' : '') +
    (pode('gestor') ? '<button class="btn btn-fantasma btn-peq" data-ig-diario="' + (S.dados.igDiario ? '0' : '1') + '">' + (S.dados.igDiario ? 'Desligar diária' : 'Ligar todo dia às 7h') + '</button>' : '') + '</div>';
  const cards = marcas.length ? '<div class="smg-grade">' + marcas.map(function (m) {
    const c = cliente(m.clienteId), x = smMetricas(m.clienteId), ins = smInsta(c), pct = x.meta ? Math.min(100, Math.round(x.freq * 100 / x.meta)) : 0;
    return '<button type="button" class="smc' + (m.status === 'pausa' ? ' pausa' : '') + '" data-abrir-cli="' + esc(m.clienteId) + '" style="--smc-cor:' + esc(m.corPrimaria || 'var(--destaque)') + '">' +
      '<span class="smc-topo">' + logoCliente(c.id) + '<span class="n"><b>' + esc(c.nome) + '</b><span class="mudo">' + esc(ins ? ins.u : 'sem @ cadastrado') + '</span></span>' +
        '<span class="pilula ' + (m.status === 'pausa' ? '' : 'ok') + '">' + (m.status === 'pausa' ? 'Em pausa' : 'Ativo') + '</span></span>' +
      '<span class="smc-fase">Fase: <b>' + esc(m.fase || '—') + '</b></span>' +
      '<span class="smc-freq"><span class="l"><span>Frequência (30 dias)</span><span><b>' + smNumBr(x.freq, 1) + '</b>/sem' + (x.meta ? ' · meta ' + smNumBr(x.meta, 1) : '') + '</span></span>' +
        '<span class="smc-trilho"><i class="' + (x.meta && pct < 75 ? 'baixo' : '') + '" style="width:' + (x.meta ? pct : 0) + '%"></i></span></span>' +
      '<span class="smc-pe">' + smPilulaIg(x, m) + (x.apr ? '<span class="pilula destaque">' + x.apr + ' em aprovação</span>' : '') +
        (x.prod ? '<span class="pilula">' + x.prod + ' em produção</span>' : '') + (x.pedidos ? '<span class="pilula">' + x.pedidos + ' pedido(s)</span>' : '') +
        (x.atr ? '<span class="pilula alerta">' + x.atr + ' atrasado(s)</span>' : '') + '</span></button>';
  }).join('') + '</div>' : '<div class="cartao" style="margin-bottom:22px"><div class="vazio"><b>' + (smMarcas().length ? 'Nenhum cliente neste filtro.' : 'Nenhum cliente com perfil de marca ainda.') + '</b>' +
    (smMarcas().length ? 'Troque o filtro de status.' : 'Adicione os clientes que a social atende para ver persona, estratégia e frequência de cada um.') +
    (!smMarcas().length && pode('admin') ? '<br><br><button class="btn btn-peq" data-exemplo-social>Carregar exemplo da social</button>' : '') + '</div></div>';
  const filas = function (status, titulo, dica) {
    const ps = lista.filter(function (p) { return p.status === status; }).sort(smOrdem);
    return '<div class="cartao"><div class="cartao-cab"><h2>' + titulo + ' <span class="mudo">' + ps.length + '</span></h2><span class="mudo pequeno">' + dica + '</span></div>' +
      (ps.length ? '<div class="tabela-wrap"><table class="tabela"><thead><tr><th>Conteúdo</th><th>Pilar · formato</th><th>Publicação</th><th class="d">Há</th></tr></thead><tbody>' +
        ps.map(function (p) {
          return '<tr data-post="' + esc(p.id) + '"><td><span class="tit">' + esc(p.titulo) + '</span><span class="mudo pequeno">' + esc(nomeCliente(p.clienteId)) + '</span></td>' +
            '<td><span class="pequeno">' + esc(p.pilar || '—') + '</span><br><span class="mudo pequeno">' + esc(p.formato) + '</span></td>' +
            '<td>' + smPilulaData(p) + '</td><td class="d num mudo pequeno">' + (p.atualizadoEm ? diasDesde(p.atualizadoEm) + 'd' : '—') + '</td></tr>';
        }).join('') + '</tbody></table></div>' : '<div class="vazio">Nada aqui agora.</div>') + '</div>';
  };
  return ig + '<div class="smg-barra"><div class="segmentado" role="group" aria-label="Status do cliente">' +
      [['ativo', 'Ativos', conta('ativo')], ['pausa', 'Em pausa', conta('pausa')], ['todos', 'Todos', smMarcas().length]].map(function (s) {
        return '<button type="button" data-statuscli="' + s[0] + '" aria-pressed="' + (f.statusCli === s[0]) + '">' + s[1] + ' · ' + s[2] + '</button>';
      }).join('') + '</div>' +
      (pode('colaborador') && semPerfil.length ? '<button class="btn btn-peq" data-nova-marca>' + icone('mais') + 'Cliente na social</button>' : '') +
      '<span class="mudo">Clique em um cliente para ver persona, estratégia, conteúdo, jornada e reports.</span></div>' + cards +
    '<div class="smg-tabs">' + filas('aprovacao', 'Aguardando aprovação', 'com o cliente') + filas('producao', 'Em produção', 'sendo criados pela equipe') + '</div>';
}

// ---------- pedidos ----------
function smPedidosVista(cid) {
  const f = S.filtrosSocial, alvo = cid || f.cliente, prio = { alta: 0, normal: 1, baixa: 2 };
  const todos = smPedidos().filter(function (p) { return !alvo || p.clienteId === alvo; });
  const pend = todos.filter(function (p) { return p.status === 'pendente'; })
    .sort(function (a, b) { return (prio[a.prioridade] - prio[b.prioridade]) || String(a.prazo || '9').localeCompare(String(b.prazo || '9')); });
  const aloc = todos.filter(function (p) { return p.status === 'alocado'; }).sort(function (a, b) { return b.atualizadoEm.localeCompare(a.atualizadoEm); }).slice(0, 12);
  const desc = todos.filter(function (p) { return p.status === 'descartado'; });
  const edita = pode('colaborador');
  const linha = function (p) {
    const post = p.postId ? smPost(p.postId) : null;
    return '<tr><td><b>' + esc(p.titulo) + '</b>' + (p.descricao ? '<br><span class="mudo pequeno">' + esc(p.descricao) + '</span>' : '') + (alvo ? '' : '<br><span class="mudo pequeno">' + esc(nomeCliente(p.clienteId)) + '</span>') + '</td>' +
      '<td><span class="pilula smp-origem ' + esc(p.origem) + '">' + (p.origem === 'cliente' ? 'Pedido do cliente' : 'Ideia da equipe') + '</span></td>' +
      '<td class="pequeno">' + esc([p.pilar, p.formato].filter(Boolean).join(' · ') || '—') + '</td>' +
      '<td>' + (p.status === 'pendente' ? '<span class="pilula ' + (p.prioridade === 'alta' ? 'alerta' : '') + '">' + SM_PRIO[p.prioridade] + '</span>' + (p.prazo ? ' <span class="mudo pequeno">até ' + dataCurta(p.prazo) + '</span>' : '')
        : post ? smPilulaData(post) : '<span class="mudo pequeno">—</span>') + '</td>' +
      '<td><div class="smp-acoes">' + (!edita ? '' : p.status === 'pendente'
        ? '<button class="btn btn-primario btn-peq" data-alocar="' + esc(p.id) + '">' + icone('calendario') + 'Alocar</button><button class="btn btn-fantasma btn-icone btn-peq" data-ed-pedido="' + esc(p.id) + '" aria-label="Editar">' + icone('editar') + '</button><button class="btn btn-fantasma btn-icone btn-peq" data-desc-pedido="' + esc(p.id) + '" aria-label="Descartar" title="Descartar">' + icone('fechar') + '</button>'
        : p.status === 'alocado' && post ? '<button class="btn btn-fantasma btn-peq" data-post="' + esc(post.id) + '">Abrir conteúdo</button>'
        : '<button class="btn btn-fantasma btn-peq" data-volta-pedido="' + esc(p.id) + '">Voltar para pendentes</button>') + '</div></td></tr>';
  };
  const tabela = function (l) { return '<div class="tabela-wrap"><table class="tabela"><thead><tr><th>Pedido</th><th>Origem</th><th>Pilar · formato</th><th>Prioridade / data</th><th></th></tr></thead><tbody>' + l.map(linha).join('') + '</tbody></table></div>'; };
  return '<div class="cartao"><div class="cartao-cab"><h2>Pedidos aguardando calendário <span class="mudo">' + pend.length + '</span></h2>' +
      (edita ? '<button class="btn btn-primario btn-peq" data-novo-pedido="' + esc(alvo || '') + '">' + icone('mais') + 'Novo pedido</button>' : '') + '</div>' +
      '<p class="mudo pequeno" style="padding:6px 20px 0;margin:0">Pedidos do cliente e ideias da equipe ficam aqui até ganharem um dia. Use “Alocar” ou arraste o pedido para um dia no calendário.</p>' +
      (pend.length ? tabela(pend) : '<div class="vazio"><b>Nenhum pedido pendente.</b>Anote aqui o próximo pedido do cliente ou uma ideia.</div>') + '</div>' +
    (aloc.length ? '<div class="cartao" style="margin-top:16px"><div class="cartao-cab"><h2>Alocados recentemente</h2></div>' + tabela(aloc) + '</div>' : '') +
    (desc.length ? '<details class="cartao" style="margin-top:16px;padding:0 0 8px"><summary class="cartao-cab" style="cursor:pointer;padding-bottom:12px"><h2>Descartados <span class="mudo">' + desc.length + '</span></h2></summary>' + tabela(desc) + '</details>' : '');
}

function smFaixaPedidos() {
  const f = S.filtrosSocial, l = smPedidos().filter(function (p) { return p.status === 'pendente' && (!f.cliente || p.clienteId === f.cliente); });
  if (!l.length) return '';
  const arr = pode('colaborador');
  return '<div class="cartao smp-faixa"><span class="rotulo">' + l.length + ' pedido(s) para alocar</span>' + l.slice(0, 14).map(function (p) {
    return '<button type="button" class="smp-chip' + (p.prioridade === 'alta' ? ' alta' : '') + '" draggable="' + arr + '" data-pedido-arr="' + esc(p.id) + '" title="Arraste para um dia ou clique para escolher a data">' +
      (f.cliente ? '' : '<em>' + esc(nomeCliente(p.clienteId)) + ' ·</em>') + esc(p.titulo) + '</button>';
  }).join('') + (l.length > 14 ? '<span class="mudo pequeno">+ ' + (l.length - 14) + '</span>' : '') + '<span class="mudo pequeno" style="margin-left:auto">Arraste para um dia</span></div>';
}

async function smAlocar(id, dia, resp) {
  const r = await gravar('alocarPedido', [id, dia, resp || ''], 'Pedido no calendário em ' + dataCurta(dia) + '.');
  if (r) { trocar('pedidos', r.pedido); trocar('posts', r.post); }
  smRedesenhar();
}

function abrirAlocar(id) {
  const p = smPedidos().find(function (x) { return x.id === id; });
  if (!p) return;
  const m = modal({
    titulo: 'Alocar no calendário', estreito: true,
    corpo: '<p class="mudo" style="margin:0 0 14px">' + esc(nomeCliente(p.clienteId)) + ' · <b>' + esc(p.titulo) + '</b></p><form class="grade" id="f-aloc">' +
      '<label class="campo"><span>Dia</span><input type="date" name="data" required value="' + esc(p.prazo || smSomaDias(S.dados.hoje, 2)) + '"></label>' +
      '<label class="campo"><span>Responsável</span><select name="resp">' + opcoes(smEquipe().map(function (x) { return { v: x.email, t: x.nome }; }), S.dados.eu.email, 'Eu') + '</select></label></form>' +
      '<p class="mudo pequeno" style="margin:12px 0 0">Vira um conteúdo na pauta com essa data. Depois é só seguir o fluxo normal.</p>',
    pe: '<button class="btn btn-fantasma" data-fechar>Cancelar</button><button class="btn btn-primario" data-ok>Alocar</button>',
  });
  m.el.querySelector('[data-ok]').onclick = function () {
    const d = lerForm(m.el.querySelector('#f-aloc'));
    if (!d.data) return toast('Escolha o dia.', { erro: true });
    m.fechar(); smAlocar(id, d.data, d.resp);
  };
}

function abrirFormPedido(base) {
  base = base || {};
  const novo = !base.id, clientes = S.dados.clientes.filter(function (c) { return !c.arquivado || c.id === base.clienteId; }).sort(function (a, b) { return a.nome.localeCompare(b.nome, 'pt-BR'); });
  const p = Object.assign({ origem: 'cliente', prioridade: 'normal' }, base);
  const m = modal({
    titulo: novo ? 'Novo pedido de post' : 'Pedido',
    corpo: '<form id="f-ped" class="grade" autocomplete="off">' +
      '<label class="campo inteira"><span>Cliente</span><select name="clienteId" required>' + opcoes(clientes.map(function (c) { return { v: c.id, t: c.nome }; }), p.clienteId, 'Escolha') + '</select></label>' +
      '<label class="campo inteira"><span>O que é o post</span><input name="titulo" required maxlength="160" value="' + esc(p.titulo) + '" placeholder="Ex.: divulgar o novo horário de domingo"></label>' +
      '<label class="campo"><span>Origem</span><select name="origem">' + opcoes([{ v: 'cliente', t: 'Pedido do cliente' }, { v: 'ideia', t: 'Ideia da equipe' }], p.origem) + '</select></label>' +
      '<label class="campo"><span>Prioridade</span><select name="prioridade">' + opcoes([{ v: 'alta', t: 'Alta' }, { v: 'normal', t: 'Normal' }, { v: 'baixa', t: 'Baixa' }], p.prioridade) + '</select></label>' +
      '<label class="campo"><span>Formato</span><select name="formato">' + opcoes((S.dados.listas.formatos || []), p.formato, 'Definir depois') + '</select></label>' +
      '<label class="campo"><span>Pilar</span><select name="pilar" id="ped-pilar">' + smOpcoesPilar(p.clienteId, p.pilar) + '</select></label>' +
      '<label class="campo"><span>Precisa sair até</span><input type="date" name="prazo" value="' + esc(p.prazo) + '"></label>' +
      '<label class="campo inteira"><span>Detalhes</span><textarea name="descricao" maxlength="2000" placeholder="Referências, texto que o cliente mandou, data importante…">' + esc(p.descricao) + '</textarea></label></form>',
    pe: (!novo && pode('colaborador') ? '<div class="esq"><button class="btn btn-fantasma btn-perigo btn-peq" data-apagar>' + icone('lixo') + 'Apagar</button></div>' : '') +
      '<button class="btn btn-fantasma" data-fechar>Cancelar</button><button class="btn btn-primario" data-ok>' + (novo ? 'Criar pedido' : 'Salvar') + '</button>',
  });
  const form = m.el.querySelector('#f-ped');
  form.clienteId.addEventListener('change', function () { m.el.querySelector('#ped-pilar').innerHTML = smOpcoesPilar(form.clienteId.value, ''); });
  const ap = m.el.querySelector('[data-apagar]');
  if (ap) ap.onclick = async function () {
    if (!(await confirmar('Apagar pedido?', p.titulo, 'Apagar', true))) return;
    if (await gravar('removerPedido', [p.id], 'Pedido apagado.') != null) { S.dados.pedidos = smPedidos().filter(function (x) { return x.id !== p.id; }); m.fechar(); smRedesenhar(); }
  };
  const ok = m.el.querySelector('[data-ok]');
  ok.onclick = function () {
    const d = lerForm(form);
    if (!d.clienteId) return form.clienteId.focus();
    if (!d.titulo.trim()) return form.titulo.focus();
    if (p.id) d.id = p.id;
    ocupado(ok, async function () {
      const r = await gravar('salvarPedido', [d], 'Pedido salvo.');
      if (r) { trocar('pedidos', r); m.fechar(); smRedesenhar(); }
    });
  };
}

// ---------- cliques extras do corpo da social ----------
function smCliqueExtra(e) {
  const t = e.target, f = S.filtrosSocial;
  const sel = function (s) { return t.closest(s); };
  let x;
  if ((x = sel('[data-abrir-cli]'))) { smAbrirCliente(x.dataset.abrirCli); return true; }
  if ((x = sel('[data-statuscli]'))) { f.statusCli = x.dataset.statuscli; smAtualizar(); return true; }
  if ((x = sel('[data-novo-pedido]'))) { abrirFormPedido({ clienteId: x.dataset.novoPedido || f.pagina || f.cliente }); return true; }
  if ((x = sel('[data-alocar]'))) { abrirAlocar(x.dataset.alocar); return true; }
  if ((x = sel('[data-pedido-arr]'))) { abrirAlocar(x.dataset.pedidoArr); return true; }
  if ((x = sel('[data-ed-pedido]'))) { abrirFormPedido(smPedidos().find(function (p) { return p.id === x.dataset.edPedido; })); return true; }
  if ((x = sel('[data-desc-pedido]')) || (x = sel('[data-volta-pedido]'))) {
    const volta = !!x.dataset.voltaPedido, id = x.dataset.descPedido || x.dataset.voltaPedido;
    gravar('descartarPedido', [id, volta], volta ? 'Pedido de volta aos pendentes.' : 'Pedido descartado.').then(function (r) { if (r) { trocar('pedidos', r); smRedesenhar(); } });
    return true;
  }
  if (sel('[data-nova-marca]')) { abrirNovaMarca(); return true; }
  if ((x = sel('[data-ed-marca]'))) { abrirFormMarca(x.dataset.edMarca); return true; }
  if ((x = sel('[data-ig-verificar]'))) { smVerificarIg(x.dataset.igVerificar, x); return true; }
  if ((x = sel('[data-ig-diario]'))) {
    gravar('ligarVerificacaoInstagram', [x.dataset.igDiario === '1'], x.dataset.igDiario === '1' ? 'Verificação diária ligada (todo dia às 7h).' : 'Verificação diária desligada.')
      .then(function (r) { if (r != null) { S.dados.igDiario = !!r; smRedesenhar(); } });
    return true;
  }
  if (sel('[data-exemplo-social]')) {
    gravar('popularSocialExemplo', [], 'Exemplo da social carregado.').then(function (r) { if (r) recarregar(); });
    return true;
  }
  if ((x = sel('[data-nova-jor]'))) { abrirFormJornada({ clienteId: f.pagina, tipo: x.dataset.novaJor || 'feedback' }); return true; }
  if ((x = sel('[data-ed-jor]'))) { abrirFormJornada(((S.dados.jornada) || []).find(function (j) { return j.id === x.dataset.edJor; })); return true; }
  if ((x = sel('[data-filtro-jor]'))) { f.filtroJor = x.dataset.filtroJor; smAtualizar(); return true; }
  if ((x = sel('[data-novo-report]'))) { abrirFormReport({ clienteId: f.pagina }); return true; }
  if ((x = sel('[data-ed-report]'))) { abrirFormReport(((S.dados.reports) || []).find(function (r) { return r.id === x.dataset.edReport; })); return true; }
  if ((x = sel('[data-apres]'))) { smApresentacao(x.dataset.apres); return true; }
  return false;
}

async function smVerificarIg(cid, btn) {
  const fazer = async function () {
    const l = await gravar('verificarInstagram', [cid || '']);
    if (!l) return;
    l.forEach(function (m) { trocar('marcas', m, 'clienteId'); });
    const erros = l.filter(function (m) { return m.igErro; });
    toast(erros.length ? (l.length - erros.length) + ' de ' + l.length + ' verificados. ' + nomeCliente(erros[0].clienteId) + ': ' + erros[0].igErro : 'Instagram verificado.', { erro: erros.length === l.length });
    smRedesenhar();
  };
  if (btn) ocupado(btn, fazer); else fazer();
}

// ---------- página do cliente ----------
function smAbrirCliente(id) { const f = S.filtrosSocial; f.pagina = id; window.scrollTo(0, 0); desenhar(); }

function smPaginaCliente(id) {
  const f = S.filtrosSocial, c = cliente(id), m = smMarca(id);
  return {
    titulo: esc(c.nome) + (m && m.status === 'pausa' ? ' <em>em pausa</em>' : ''),
    acoes: '<button class="btn btn-fantasma btn-peq" data-voltar-sm>' + icone('seta').replace('<svg', '<svg style="transform:scaleX(-1)"') + 'Social media</button>' +
      '<div class="segmentado" role="group" aria-label="Seção" id="smx-abas">' + SM_ABAS.map(function (a) {
        return '<button type="button" data-aba="' + a[0] + '" aria-pressed="' + (f.aba === a[0]) + '">' + a[1] + '</button>';
      }).join('') + '</div>' +
      (pode('colaborador') ? (m ? '<button class="btn btn-primario" data-ed-marca="' + esc(id) + '">' + icone('editar') + '<span>Editar perfil</span></button>'
        : '<button class="btn btn-primario" data-ed-marca="' + esc(id) + '">' + icone('mais') + '<span>Criar perfil de marca</span></button>') : ''),
    corpo: '<div id="sm-corpo">' + smPaginaCorpo(id) + '</div>',

      topo.querySelector('[data-voltar-sm]').onclick = function () { f.pagina = ''; desenhar(); };
      topo.querySelector('#smx-abas').addEventListener('click', function (e) { const b = e.target.closest('[data-aba]'); if (b) { f.aba = b.dataset.aba; desenhar(); } });
      const ed = topo.querySelector('[data-ed-marca]');
      if (ed) ed.onclick = function () { abrirFormMarca(id); };
      smLigar(el.querySelector('#sm-corpo'));
    },
  };
}

function smPaginaCorpo(id) {
  const f = S.filtrosSocial, m = smMarca(id), c = cliente(id);
  const aba = f.aba === 'conteudo' ? smAbaConteudo(id, m, c) : f.aba === 'pedidos' ? smPedidosVista(id) : f.aba === 'jornada' ? smAbaJornada(id) : f.aba === 'reports' ? smAbaReports(id, m) : smAbaEstrategia(id, m, c);
  return '<div class="conteudo">' + aba + '</div>';
}

function smBloco(titulo, texto, extra) {
  return '<div class="cartao smx-bloco"><h3>' + esc(titulo) + '</h3>' + (extra || (texto ? '<p>' + esc(texto) + '</p>' : '<p class="vaz">Ainda não definido.</p>')) + '</div>';
}

function smHero(id, m, c) {
  const ins = smInsta(c), fases = smFases(), i = fases.indexOf(m.fase), x = smMetricas(id);
  return '<div class="cartao smx-hero" style="--smc-cor:' + esc(m.corPrimaria || 'var(--destaque)') + '"><div>' +
      '<span class="rotulo">Objetivo da estratégia</span><h2>' + esc(m.objetivo || 'Defina o objetivo no perfil') + '</h2>' +
      '<p>' + esc([c.segmento, m.inicio ? 'cliente desde ' + dataBr(m.inicio) : '', m.aprovador ? 'aprova: ' + m.aprovador : ''].filter(Boolean).join(' · ')) + '</p>' +
      '<div class="smx-meta"><span class="pilula ' + (m.status === 'pausa' ? '' : 'ok') + '">' + (m.status === 'pausa' ? 'Em pausa' : 'Ativo') + '</span>' +
        (ins ? '<a class="pilula destaque" href="' + esc(ins.url) + '" target="_blank" rel="noopener">' + esc(ins.u) + '</a>' : '') +
        (m.redes ? '<span class="pilula">' + esc(m.redes) + '</span>' : '') + smPilulaIg(x, m) +
        (m.linkDrive ? '<a class="pilula" href="' + esc(m.linkDrive) + '" target="_blank" rel="noopener">' + icone('link') + 'Pasta da marca</a>' : '') + '</div></div>' +

    '<div class="smx-fases" aria-label="Fases da estratégia">' + fases.map(function (fa, k) {

      (pode('colaborador') ? '<button class="btn btn-primario" data-ed-marca="' + esc(id) + '">' + icone('mais') + 'Criar perfil de marca</button>' : '') + '</div>';
  }
  const ajustes = smJornada(id).filter(function (j) { return j.tipo === 'ajuste'; }).slice(0, 3);

  return smHero(id, m, c) +
    '<div class="smx-grade">' +

      smBloco('Linguagem', '', '<p><b>Usamos:</b> ' + esc(m.palavrasUsar || '—') + '</p><p style="margin-top:6px"><b>Evitamos:</b> ' + esc(m.palavrasEvitar || '—') + '</p>') +
      smBloco('Pilares e metas', '', m.pilares.length ? '<div class="smx-pil">' + m.pilares.map(function (p) {
        return '<div class="linha"><span>' + esc(p.nome) + '</span><span class="trilho"><i style="width:' + (p.meta || 0) + '%"></i></span><span class="num"><b>' + (p.meta || 0) + '%</b> meta</span></div>';
      }).join('') + '</div><p class="mudo pequeno" style="margin-top:12px">Frequência alvo: <b>' + smNumBr(m.frequencia, 1) + ' posts por semana</b>' +
        (Object.keys(fm).length ? ' · ' + Object.keys(fm).map(function (k) { return k + ' ' + fm[k] + '%'; }).join(' · ') : '') + '</p>' : '<p class="vaz">Sem pilares definidos.</p>') +
      smBloco('Referências e concorrentes', '', '<p>' + esc(m.referencias || '—') + '</p><p class="mudo pequeno" style="margin-top:8px">Concorrentes: ' + esc(m.concorrentes || '—') + '</p><p class="mudo pequeno" style="margin-top:4px">Hashtags: ' + esc(m.hashtags || '—') + '</p>') +
      smBloco('Identidade visual', '', '<div class="smx-cores">' + [m.corPrimaria, m.corSecundaria].filter(Boolean).map(function (cor) { return '<span class="smx-cor" style="background:' + esc(cor) + '" title="' + esc(cor) + '"></span>'; }).join('') +

    (ajustes.length ? '<div class="cartao smx-bloco" style="margin-top:16px"><h3>Mudou recentemente</h3>' + ajustes.map(function (j) {
      return '<p style="margin-bottom:6px"><b>' + esc(j.titulo) + '</b> <span class="mudo pequeno">· ' + dataCurta(j.data) + (j.texto ? ' · ' + esc(j.texto) : '') + '</span></p>';
    }).join('') + '<button class="btn btn-fantasma btn-peq" onclick="S.filtrosSocial.aba=\'jornada\';desenhar()">Ver a jornada</button></div>' : '');
}

function smDistribuicao(d, metas) {
  if (!d.total) return '<p class="vaz mudo">Sem conteúdos publicados nos últimos 90 dias.</p>';
  return '<div class="smx-pil">' + d.linhas.map(function (l) {
    const meta = metas[l.nome];
    return '<div class="linha"><span title="' + esc(l.nome) + '">' + esc(l.nome) + '</span><span class="trilho"><i style="width:' + l.pct + '%"></i>' + (meta != null ? '<b style="left:calc(' + meta + '% - 1px)" title="Meta ' + meta + '%"></b>' : '') + '</span>' +
      '<span class="num"><b>' + l.pct + '%</b> · ' + l.n + (meta != null ? ' · meta ' + meta + '%' : '') + '</span></div>';
  }).join('') + '</div><div class="smx-leg"><span><i></i>Real (90 dias, ' + d.total + ' posts)</span><span><i class="meta"></i>Meta</span></div>';
}

function smSemanas(x) {
  const hoje = S.dados.hoje, semanas = [];
  for (let k = 7; k >= 0; k--) {
    const fim = smSomaDias(hoje, -k * 7), ini = smSomaDias(fim, -6);
    semanas.push({ ini: ini, n: x.pubs.filter(function (p) { return p.data >= ini && p.data <= fim; }).length });
  }
  const max = Math.max.apply(null, semanas.map(function (s) { return s.n; }).concat([x.meta || 1, 1]));
  return '<div class="smx-semanas">' + semanas.map(function (s) {
    return '<div title="Semana de ' + dataCurta(s.ini) + ': ' + s.n + ' post(s)"><b>' + s.n + '</b><span class="b' + (x.meta && s.n < x.meta ? ' baixo' : '') + '" style="height:' + Math.round(s.n * 82 / max) + '%"></span>' + dataCurta(s.ini).replace(/\s.*/, '') + '</div>';
  }).join('') + '</div>' + (x.meta ? '<p class="mudo pequeno" style="margin:8px 0 0">Meta: ' + smNumBr(x.meta, 1) + ' por semana. Barras em vermelho ficaram abaixo da meta.</p>' : '');
}

function smAbaConteudo(id, m, c) {

      kpi('Último post no Instagram', igTxt, m && m.igUltimoPost ? dataBr(m.igUltimoPost) + (x.igAtraso ? ' · acima do intervalo de ' + x.limite + ' dias' : '') : 'ainda não verificado') +
      kpi('Na fila', String(x.prod + x.apr), x.prod + ' em produção · ' + x.apr + ' em aprovação') + '</div>' +
    '<div class="cartao smg-ig" style="margin-top:16px"><span class="t">' + icone('social') + '<span>' +
      (m && m.igVerificadoEm ? 'Instagram verificado ' + esc(quando(m.igVerificadoEm)) + (m.igSeguidores ? ' · ' + smNumBr(m.igSeguidores) + ' seguidores' : '') : 'Instagram ainda não verificado') +
      (m && m.igErro ? ' · <span style="color:var(--alerta)">' + esc(m.igErro) + '</span>' : '') + '</span></span>' +
      (pode('colaborador') && m ? '<button class="btn btn-peq" data-ig-verificar="' + esc(id) + '">' + icone('recarregar') + 'Verificar agora</button>' : '') + '</div>' +
    '<div class="smx-grade">' +

      '<div class="cartao smx-bloco"><h3>Próximos conteúdos</h3>' + (prox.length ? '<div class="sm-ag-lista">' + prox.map(smItem).join('') + '</div>' : '<p class="vaz">Nada programado. Aloque um pedido ou crie um conteúdo.</p>') + '</div>' +
      '<div class="cartao smx-bloco"><h3>Distribuição por pilar</h3>' + smDistribuicao(x.pilares, metasP) + '</div>' +
      '<div class="cartao smx-bloco"><h3>Distribuição por formato</h3>' + smDistribuicao(x.formatos, metasF) + '</div>' +
    '</div>' +
    (reps.length ? '<div class="cartao smx-bloco" style="margin-top:16px"><h3>Evolução pelos reports mensais</h3><div class="smx-evol">' +
      cvKpi('Seguidores', smNumBr(ult.seguidores), smMesNome(ult.mes), varr('seguidores'), cvSpark(serie('seguidores'))) +
      cvKpi('Contas alcançadas', smNumBr(ult.alcance), smMesNome(ult.mes), varr('alcance'), cvSpark(serie('alcance'))) +
      cvKpi('Engajamento', smNumBr(ult.engajamento, 1) + '%', smMesNome(ult.mes), varr('engajamento'), cvSpark(serie('engajamento'))) +
      '</div></div>' : '<div class="cartao smx-bloco" style="margin-top:16px"><h3>Evolução</h3><p class="vaz">Importe os PDFs de report do Instagram na aba Reports para ver a evolução aqui.</p></div>');
}

        (ref ? '<p class="mudo pequeno" style="margin-top:6px">Motivado pelo feedback de ' + dataCurta(ref.data) + ': “' + esc(ref.titulo) + '”</p>' : '') +

// Lê o texto do PDF no navegador com o pdf.js (carregado só quando precisa).
function smPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise(function (ok, erro) {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = function () { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok(window.pdfjsLib); };
    s.onerror = function () { erro(new Error('leitor de PDF indisponível')); };
    document.head.appendChild(s);
  });
}

async function smTextoPdf(file) {
  const lib = await smPdfJs(), doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  let texto = '';
  for (let i = 1; i <= Math.min(doc.numPages, 40); i++) {
    const pg = await doc.getPage(i), c = await pg.getTextContent();
    texto += ' ' + c.items.map(function (x) { return x.str; }).join(' ');
  }
  return texto.replace(/\s+/g, ' ');
}

// "12,3 mil", "1.234", "12.3K", "4,5%" -> número.
function smNum(s) {
  s = String(s).trim().toLowerCase().replace(/%$/, '').trim();
  let mult = 1;
  if (/\s*(mil|k)$/.test(s)) { mult = 1e3; s = s.replace(/\s*(mil|k)$/, ''); }
  else if (/\s*(milhões|milhão|mi|m)$/.test(s)) { mult = 1e6; s = s.replace(/\s*(milhões|milhão|mi|m)$/, ''); }
  if (s.indexOf(',') >= 0 && s.indexOf('.') >= 0) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (s.indexOf(',') >= 0) s = (/,\d{3}$/.test(s) && mult === 1) ? s.replace(/,/g, '') : s.replace(',', '.');
  else if (/\.\d{3}$/.test(s) && mult === 1) s = s.replace(/\./g, '');
  const n = parseFloat(s) * mult;
  return isFinite(n) ? Math.round(n * 100) / 100 : null;
}

function smExtrairReport(texto) {
  const t = texto.toLowerCase(), NUM = '(\\d[\\d.,]*(?:\\s?(?:mil|mi|k|m)\\b)?)\\s*(%?)';
  const procura = function (rotulos, semPct, tira) {
    let base = t;
    (tira || []).forEach(function (x) { base = base.split(x).join(' '); });
    for (let i = 0; i < rotulos.length; i++) {
      const r = rotulos[i].replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const depois = new RegExp(r + '[^\\d%]{0,40}?' + NUM, 'i').exec(base);
      if (depois && (!semPct || !depois[2])) { const n = smNum(depois[1]); if (n != null) return n; }
      const antes = new RegExp(NUM + '\\s{0,3}' + r, 'i').exec(base);
      if (antes && (!semPct || !antes[2])) { const n = smNum(antes[1]); if (n != null) return n; }
    }
    return null;
  };
  const v = {};
  const poe = function (k, n) { if (n != null && n >= 0) v[k] = n; };
  poe('novosSeguidores', procura(['novos seguidores', 'new followers', 'seguidores ganhos'], true));
  poe('seguidores', procura(['total de seguidores', 'seguidores', 'followers'], true, ['novos seguidores', 'new followers', 'seguidores ganhos', 'não seguidores', 'non-followers']));
  poe('alcance', procura(['contas alcançadas', 'accounts reached', 'alcance', 'reach'], true));
  poe('impressoes', procura(['impressões', 'impressions', 'visualizações', 'views'], true));
  poe('interacoes', procura(['interações com o conteúdo', 'content interactions', 'contas com engajamento', 'accounts engaged', 'interações', 'interactions'], true));
  poe('visitasPerfil', procura(['visitas ao perfil', 'profile visits', 'atividade do perfil', 'profile activity'], true));
  poe('cliquesLink', procura(['toques no link externo', 'toques em links externos', 'cliques no link', 'external link taps', 'link taps'], true));
  poe('postsPublicados', procura(['publicações', 'posts publicados', 'conteúdos publicados', 'posts'], true));
  const eng = /(?:taxa de engajamento|engagement rate)[^\d]{0,30}(\d[\d.,]*)\s*%/i.exec(t);
  if (eng) poe('engajamento', smNum(eng[1]));
  else if (v.interacoes && v.alcance) v.engajamento = Math.round(v.interacoes * 1000 / v.alcance) / 10;
  const meses = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  const en = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
  let mes = '';
  const rm = new RegExp('(' + meses.concat(en).join('|') + ')\\s*(?:de\\s*)?(20\\d{2})', 'i').exec(t);
  if (rm) { const k = meses.indexOf(rm[1].toLowerCase()) >= 0 ? meses.indexOf(rm[1].toLowerCase()) : en.indexOf(rm[1].toLowerCase()); mes = rm[2] + '-' + String(k + 1).padStart(2, '0'); }
  return { valores: v, mes: mes };
}

      (over.length ? '<h3 style="margin-top:30px">Entregas além do combinado</h3><ul>' + over.map(function (j) { return '<li>' + e(j.titulo) + '</li>'; }).join('') + '</ul>' : '') + '</div></div></section>' +
    // destaques e resultados
    '<section class="sl">' + topo + '<h2>Destaques e <b>resultados</b></h2><div class="duas"><div><h3>Destaques</h3>' + par(r.destaques) + '</div><div><h3>Resultados x objetivo</h3><p><b>' + e(m.objetivo || '') + '</b></p>' + par(r.resultados) + '</div></div></section>' +
    // ajustes
    '<section class="sl">' + topo + '<h2>Ajustes na <b>estratégia</b></h2><div class="duas"><div><h3>O que muda</h3>' + par(r.ajustes) +
      (ajustesMes.length ? '<ul>' + ajustesMes.map(function (j) { return '<li>' + e(j.titulo) + '</li>'; }).join('') + '</ul>' : '') + '</div><div><h3>Próximos passos</h3>' + par(r.proximosPassos) + '</div></div>' +
      '<div class="fase">' + smFases().map(function (fa, k) { const at = smFases().indexOf(m.fase); return '<div class="' + (k === at ? 'at' : k < at ? 'ok' : '') + '"><i></i>' + e(fa) + '</div>'; }).join('') + '</div></section>' +
    // encerramento
    '<section class="sl fim"><div class="lados">' + (logoAg ? '<img class="ls" src="' + e(logoAg) + '" alt="' + e(nomeAg) + '">' : '<b>' + e(nomeAg.toUpperCase()) + '</b>') + '<span style="opacity:.4;font-size:30px">×</span>' + marcaC + '</div><h1 style="font-size:60px">Obrigado.</h1><p style="color:rgba(247,243,236,.7)">Seguimos juntos no próximo mês.</p></section>' +
    '<script>function caber(){var z=Math.min(1,(innerWidth-24)/1280);document.querySelectorAll(".sl").forEach(function(s){s.style.zoom=z;});}caber();addEventListener("resize",caber);<\/script></body></html>';
  const w = window.open('', '_blank');
  if (!w) return toast('O navegador bloqueou a nova janela. Libere pop-ups para o ' + produto() + '.', { erro: true });
  w.document.open(); w.document.write(html); w.document.close();
}
</script>
