<style>
/* =====================================================================================
   Seok Flow · camada de design (vem por último e manda no visual).
   Linguagem do site seokwellness.com com a estrutura do Be Flow:
   - moldura (barra do topo e menu) em floresta profunda em todos os temas, item ativo em cobre claro
   - títulos em Archivo leve e grande, destaques em cor (não itálico), rótulos em caixa alta espaçada
   - conteúdo em creme com cartões brancos, números grandes e leves, traço cobre como marcador
   - temas escuros: cartões em vidro sobre floresta
   As cores da marca (Admin > Marca) continuam valendo pelas variáveis --m-*.
   ===================================================================================== */
:root {
  --acento: var(--m-destaque, #A9511F);
  --acento-claro: #F0B472;
  --destaque: #3F5B2E;
  --destaque-escuro: #2F4722;
  --sobre-destaque: #F7F3EC;
  --raio: 14px;
  --linha: rgba(20, 26, 15, .08);
  --linha-forte: rgba(20, 26, 15, .14);
  --afundado: color-mix(in srgb, #141A0F 4%, var(--fundo));
  --suave: rgba(20, 26, 15, .62);
  --apagado: rgba(20, 26, 15, .44);
  --sombra: 0 1px 2px rgba(20, 26, 15, .04), 0 18px 40px -26px rgba(20, 26, 15, .28);
  --sombra-alta: 0 30px 80px -24px rgba(13, 17, 8, .45);
  --rotulo: 500 10.5px/1.4 var(--fonte), system-ui, sans-serif;
  --k1: #3F5B2E; --k2: #A9511F; --k3: #7FA866; --k4: #C9A27A;
  --g1: #8CB572; --g2: rgba(63, 91, 46, .9);
}
:root[data-tema="escuro"], :root[data-tema="floresta"] { --g1: #DCEBCB; --g2: rgba(197, 219, 174, .25); }
:root[data-tema="escuro"] {
  --fundo: #0F130B; --superficie: #161C11; --texto: #F2EEE6; --primaria: #0D1108;
  --destaque: #C5DBAE; --destaque-escuro: #DCEBCB; --sobre-destaque: #141A0F; --acento: #F0B472;
  --linha: rgba(247, 243, 236, .08); --linha-forte: rgba(247, 243, 236, .15); --afundado: color-mix(in srgb, #F2EEE6 5%, var(--fundo));
  --suave: rgba(242, 238, 230, .66); --apagado: rgba(242, 238, 230, .44);
  --sombra: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 20px 44px -28px rgba(0, 0, 0, .8);
  --k1: #C5DBAE; --k2: #F0B472; --k3: #8CC271; --k4: #E6C7A0;
}
:root[data-tema="floresta"] {
  --fundo: #18200F; --superficie: #1E2716; --texto: #F2F5EC; --primaria: #0D1108;
  --destaque: #C9E9B2; --destaque-escuro: #E0F3D2; --sobre-destaque: #141A0F; --acento: #F0B472;
  --linha: rgba(201, 233, 178, .10); --linha-forte: rgba(201, 233, 178, .18); --afundado: color-mix(in srgb, #F2F5EC 5%, var(--fundo));
  --suave: rgba(242, 245, 236, .68); --apagado: rgba(242, 245, 236, .46);
  --sombra: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 20px 44px -28px rgba(0, 0, 0, .7);
  --k1: #C9E9B2; --k2: #F0B472; --k3: #A6D388; --k4: #E6C7A0;
}

/* fundo da página: creme com um brilho quente no canto, como a luz das fotos do site */
body { background: radial-gradient(1100px 520px at 100% -8%, rgba(240, 180, 114, .12), transparent 62%), var(--fundo); background-attachment: fixed; }
:root[data-tema="escuro"] body { background: radial-gradient(1100px 560px at 100% -10%, rgba(240, 180, 114, .07), transparent 60%), radial-gradient(900px 600px at 0% 110%, rgba(94, 143, 74, .10), transparent 60%), var(--fundo); background-attachment: fixed; }
:root[data-tema="floresta"] body { background: radial-gradient(1100px 600px at 100% -10%, rgba(140, 194, 113, .16), transparent 60%), radial-gradient(900px 600px at 0% 110%, rgba(240, 180, 114, .08), transparent 60%), var(--fundo); background-attachment: fixed; }

/* ---------- moldura: barra do topo e menu em floresta profunda (todos os temas) ---------- */
:root, :root[data-tema="escuro"] {
  --c-barra: rgba(13, 17, 8, .94); --c-lado: #0D1108; --c-bd: rgba(247, 243, 236, .07);
  --c-tx: rgba(247, 243, 236, .64); --c-tx2: rgba(247, 243, 236, .40); --c-forte: #F7F3EC;
  --c-hv: rgba(247, 243, 236, .05); --c-onbg: rgba(240, 180, 114, .09); --c-ontx: #F0B472; --c-acc: #F0B472; --c-logo: none;
}
:root[data-tema="floresta"] {
  --c-barra: rgba(16, 22, 11, .9); --c-lado: rgba(16, 22, 11, .82); --c-bd: rgba(201, 233, 178, .09);
  --c-tx: rgba(242, 245, 236, .66); --c-tx2: rgba(242, 245, 236, .42); --c-forte: #F7F3EC;
  --c-hv: rgba(201, 233, 178, .06); --c-onbg: rgba(240, 180, 114, .1); --c-ontx: #F0B472; --c-acc: #F0B472; --c-logo: none;
}
:root { --altura-barra: 62px; }
.barra-app { height: var(--altura-barra); padding: 0 20px 0 14px; }
.barra-nome b { font-weight: 500; letter-spacing: -.01em; }
.barra-nome small { color: var(--acento-claro); font-weight: 500; letter-spacing: .18em; font-size: 9.5px; }
.barra-sep { width: 1px; background: linear-gradient(180deg, transparent, rgba(240, 180, 114, .7), transparent); }
.linha-marca { height: 3px; background: linear-gradient(90deg, transparent 0%, rgba(169, 81, 31, .9) 18%, #F0B472 42%, #C5DBAE 70%, transparent 100%) 0 0 / 200% 1px no-repeat, var(--c-lado); opacity: 1; }
.barra-busca { border-radius: 100px !important; background: rgba(247, 243, 236, .04) !important; }
@media (min-width: 821px) { .barra-busca { min-width: 240px; } }
.barra-busca:hover { background: rgba(247, 243, 236, .07) !important; border-color: rgba(247, 243, 236, .14) !important; }
.barra-busca kbd { color: var(--c-tx2) !important; background: rgba(247, 243, 236, .06) !important; border-color: var(--c-bd) !important; font: 500 10px/1 var(--fonte); letter-spacing: .06em; padding: 4px 7px; }
.lateral { padding: 18px 12px 14px; border-right: 1px solid var(--c-bd); }
.menu { gap: 3px; }
.menu::before { content: 'Navegação'; display: block; font: 500 9.5px/1 var(--fonte); letter-spacing: .22em; text-transform: uppercase; color: var(--c-tx2); padding: 4px 12px 12px; }
.recolhido .menu::before { content: ''; padding: 0 0 8px; }
.menu button { height: 40px; border-radius: 100px; font-size: 13.5px; font-weight: 400; letter-spacing: .005em; transition: background .18s, color .18s, box-shadow .18s; }
.menu button svg { width: 18px; height: 18px; stroke-width: 1.4; opacity: .85; }
.menu button:hover svg { opacity: 1; }
.menu button[aria-current="page"] { font-weight: 500; box-shadow: inset 0 0 0 1px rgba(240, 180, 114, .2), 0 0 26px -10px rgba(240, 180, 114, .55); }
.menu button[aria-current="page"] svg { opacity: 1; }
.menu button[aria-current="page"]::before { left: -12px; top: 11px; bottom: 11px; width: 2px; border-radius: 2px; background: #F0B472; box-shadow: 0 0 12px rgba(240, 180, 114, .9); }
.menu .contador { background: #A9511F; color: #F7F3EC; font-weight: 600; }
.lateral-pe { border-top-color: var(--c-bd); }
.lateral-pe .rotulo { letter-spacing: .2em; font-size: 9.5px; }

/* ---------- título simples (telas sem banner) ---------- */
.topo { background: color-mix(in srgb, var(--fundo) 90%, transparent); }
.topo h1 { font-weight: 200; font-size: 34px; letter-spacing: -.035em; }
.topo .rotulo::before { width: 28px; background: var(--acento); }

/* destaques em cor, como no site (sem itálico) */
h1 em, h2 em { font-style: normal; font-weight: inherit; color: var(--acento); }
:root[data-tema="escuro"] h1 em, :root[data-tema="escuro"] h2 em, :root[data-tema="floresta"] h1 em, :root[data-tema="floresta"] h2 em { color: var(--acento-claro); }
.rotulo { letter-spacing: .18em; }

/* ---------- botões ---------- */
.btn { height: 40px; padding: 0 20px; border-radius: 100px; font: 500 11px/1 var(--fonte); letter-spacing: .16em; border-color: var(--linha-forte); background: transparent; color: var(--texto); }
.btn:hover { border-color: color-mix(in srgb, var(--texto) 40%, transparent); background: var(--afundado); }
.btn-primario { background: var(--destaque); border-color: var(--destaque); color: var(--sobre-destaque);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .14) inset, 0 10px 22px -12px color-mix(in srgb, var(--destaque) 85%, transparent); }
.btn-primario:hover { background: var(--destaque-escuro); border-color: var(--destaque-escuro); transform: translateY(-1px); }
.btn-escuro { background: var(--primaria); border-color: var(--primaria); color: #F7F3EC; }
.btn-fantasma { border-color: transparent; background: none; }
.btn-peq { height: 32px; padding: 0 14px; font-size: 10px; }
.btn-icone { width: 40px; padding: 0; }
.btn-icone.btn-peq { width: 32px; }

/* ---------- campos ---------- */
.entrada, .campo input, .campo select, .campo textarea { min-height: 42px; border-radius: 12px; border-color: var(--linha-forte); background: var(--superficie); color: var(--texto); }
.entrada:focus, .campo input:focus, .campo select:focus, .campo textarea:focus { border-color: var(--acento); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acento) 16%, transparent); }
.busca .entrada, .filtro { min-height: 40px; border-radius: 100px; }
.campo > span { letter-spacing: .16em; }

/* ---------- segmentado ---------- */
.segmentado { padding: 4px; background: var(--afundado); border-color: var(--linha); }
.segmentado button { padding: 7px 14px; font: 500 10px/1.2 var(--fonte); letter-spacing: .16em; color: var(--suave); transition: background .15s, color .15s; }
.segmentado button[aria-pressed="true"] { background: #141A0F; color: #F7F3EC; box-shadow: 0 6px 14px -8px rgba(13, 17, 8, .6); }
:root[data-tema="escuro"] .segmentado button[aria-pressed="true"], :root[data-tema="floresta"] .segmentado button[aria-pressed="true"] { background: #F7F3EC; color: #141A0F; }

/* ---------- cartões ---------- */
.cartao { border-radius: 18px; border-color: var(--linha); box-shadow: var(--sombra); background: var(--superficie); }
:root[data-tema="escuro"] .cartao, :root[data-tema="floresta"] .cartao {
  background: linear-gradient(180deg, rgba(247, 243, 236, .05), rgba(247, 243, 236, .02)); border-color: var(--linha);
  backdrop-filter: blur(14px) saturate(1.15); -webkit-backdrop-filter: blur(14px) saturate(1.15);
}
.cartao-cab { padding: 20px 22px 0; }
.cartao-cab h2 { display: flex; align-items: center; gap: 12px; font-weight: 400; font-size: 17px; letter-spacing: -.015em; }
.cartao-cab h2::before { content: ''; width: 18px; height: 1px; flex: none; background: var(--acento); }
.cartao-corpo { padding: 16px 22px 22px; }

/* ---------- KPIs: número grande e leve, traço colorido, ícone em traço ---------- */
.kpis { gap: 16px; margin-bottom: 24px; }
.kpis > .kpi { --k: var(--k1); }
.kpis > .kpi:nth-child(4n+2) { --k: var(--k2); }
.kpis > .kpi:nth-child(4n+3) { --k: var(--k3); }
.kpis > .kpi:nth-child(4n+4) { --k: var(--k4); }
.kpi { padding: 24px 22px 20px; isolation: isolate; transition: transform .25s ease, box-shadow .25s ease, border-color .25s; }
.kpi::before { content: ''; position: absolute; left: 0; top: 22px; width: 3px; height: 18px; border-radius: 0 3px 3px 0; background: var(--k); box-shadow: 0 0 12px color-mix(in srgb, var(--k) 60%, transparent); }
.kpi::after { content: ''; position: absolute; right: -60px; top: -60px; width: 160px; height: 160px; border-radius: 50%; z-index: -1; pointer-events: none;
  background: radial-gradient(circle, color-mix(in srgb, var(--k) 14%, transparent), transparent 70%); }
.kpi:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--k) 30%, var(--linha)); }
.kpi .rotulo { display: block; padding-right: 46px; font-size: 10px; letter-spacing: .18em; color: var(--suave); }
.kpi .valor { font-weight: 200; font-size: clamp(30px, 2.6vw, 40px); letter-spacing: -.04em; line-height: 1.05; margin: 14px 0 6px; color: var(--texto) !important; }
.kpi .det { font-size: 12.5px; color: var(--suave); }
.kpi .k-ic { position: absolute; top: 18px; right: 18px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--k);
  border: 1px solid color-mix(in srgb, var(--k) 30%, transparent); background: color-mix(in srgb, var(--k) 7%, transparent); }
.kpi .k-ic svg { width: 16px; height: 16px; stroke-width: 1.5; }
.kpi.escuro { background: var(--superficie); border-color: var(--linha); color: var(--texto); background-image: none; }
.kpi.escuro .rotulo, .kpi.escuro .det { color: var(--suave); }
:root[data-tema="escuro"] .kpi.escuro, :root[data-tema="floresta"] .kpi.escuro { background: linear-gradient(180deg, rgba(247, 243, 236, .05), rgba(247, 243, 236, .02)); }

/* ---------- listas, vazio, pílulas ---------- */
.lista > li { padding: 13px 0; }
.lista .principal-li b { font-weight: 500; }
.vazio b { font-weight: 300; font-size: 17px; letter-spacing: -.01em; color: var(--texto); }
.pilula { padding: 4px 11px; font-size: 11px; font-weight: 500; letter-spacing: .01em; background: var(--afundado); color: var(--suave); }
.pilula.ok, .pilula.destaque { background: color-mix(in srgb, var(--destaque) 12%, transparent); color: var(--destaque); }
.pilula.alerta { background: color-mix(in srgb, var(--acento) 12%, transparent); color: var(--acento); }
:root[data-tema="escuro"] .pilula.alerta, :root[data-tema="floresta"] .pilula.alerta { color: var(--acento-claro); background: rgba(240, 180, 114, .1); }
.barra-funil .trilho { height: 6px; }

/* ---------- funil (kanban) ---------- */
.funil-resumo b { font-weight: 200; font-size: 28px; letter-spacing: -.035em; }
.funil-resumo .rotulo { font-size: 10px; }
.coluna { background: rgba(20, 26, 15, .028); border-color: var(--linha); border-radius: 20px; flex-basis: 300px; }
:root[data-tema="escuro"] .coluna, :root[data-tema="floresta"] .coluna { background: rgba(247, 243, 236, .025); }
.coluna-cab { padding: 0 16px 14px; gap: 8px; border-bottom-color: var(--linha); }
.coluna-cab .faixa { height: 2px; margin: 0 -16px 8px; border-radius: 20px 20px 0 0; opacity: .9; }
.coluna-cab .t b { font: 500 11px/1.3 var(--fonte); letter-spacing: .16em; text-transform: uppercase; }
.coluna-cab .t .n { min-width: 22px; height: 20px; padding: 0 7px; border-radius: 100px; display: inline-grid; place-items: center; font-size: 11px; font-weight: 500; background: var(--afundado); color: var(--suave); }
.coluna-cab .soma { font-size: 13px; font-weight: 300; color: var(--suave); }
.coluna-cards { padding: 12px; gap: 10px; }
.op { position: relative; overflow: hidden; border-radius: 14px; padding: 14px 14px 12px 17px; gap: 9px; border-color: var(--linha); box-shadow: 0 1px 2px rgba(20, 26, 15, .05); background: var(--superficie); }
.op::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--e, var(--linha-forte)); }
/* com overflow escondido, o item de grade pode encolher abaixo do conteúdo numa coluna de altura limitada: nunca corta */
.coluna-cards { display: flex !important; flex-direction: column; }
.op .rodape + .rodape { border-top: 0; padding-top: 0; }
/* calendário do social: nome do cliente quebra linha (sem reticências) e publicado vira chip tingido */
.sm-chip { align-items: flex-start; flex-wrap: wrap; row-gap: 1px; padding: 4px 8px; border-radius: 8px; box-shadow: inset 3px 0 0 var(--sm-cor); }
.sm-chip span { white-space: normal !important; overflow: visible !important; text-overflow: clip !important; overflow-wrap: break-word; }
.sm-chip.sm-st-publicado { background: color-mix(in srgb, var(--sm-cor) 18%, var(--superficie)); color: var(--texto); }
.sm-chip.sm-st-publicado b { color: var(--suave); opacity: 1; }
.sm-dia.hoje .sm-n { background: var(--acento); color: #F7F3EC; }
.sm-cal-cab h2 { font-weight: 200; font-size: 28px; letter-spacing: -.035em; }

/* tráfego: tabela de campanhas com a largura toda até telas largas; cartões laterais lado a lado embaixo */
@media (max-width: 1360px) {
  .tf-baixo { grid-template-columns: minmax(0, 1fr) !important; }
  .tf-baixo > div:last-child { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
}
@media (max-width: 820px) { .tf-baixo > div:last-child { grid-template-columns: minmax(0, 1fr); } }
.tf-cli-topo span:first-child { white-space: normal !important; overflow: visible !important; text-overflow: clip !important; }
.tf-cli .trilho { height: 6px; }
.tf-cli .trilho i { background-image: linear-gradient(90deg, var(--g2), var(--g1)) !important; }

/* abas do C-Vision grudam logo abaixo do título (altura medida na hora, ver pintarBanner) */
.cv-nav { top: calc(var(--altura-barra) + 3px + var(--topo-h, 100px)) !important; padding: 10px 0; background: color-mix(in srgb, var(--fundo) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.cv-nav a { font-size: 10px; letter-spacing: .16em; }

/* formulários: campos alinhados no topo (sem select esticado pela altura da linha) */
.campo { align-content: start; }
.grade { align-items: start; }

/* admin > equipe: nome com largura mínima; controles descem de linha quando falta espaço */
.lista > li:has(.adm-areas) { flex-wrap: wrap; row-gap: 12px; }
.lista > li:has(.adm-areas) .principal-li { flex: 1 1 240px; min-width: 220px; }
.lista > li:has(.adm-areas) .adm-areas { flex-wrap: wrap; }

/* ---------- rodada 3: KPIs num painel único, tarefas com abas, mais respiro ---------- */
/* KPIs: um cartão só, divididos por linhas finas; valor mais forte, detalhe em tom neutro */
.kpis { gap: 0; background: var(--superficie); border: 1px solid var(--linha); border-radius: 20px; box-shadow: var(--sombra); overflow: hidden; }
:root[data-tema="escuro"] .kpis, :root[data-tema="floresta"] .kpis { background: linear-gradient(180deg, rgba(247, 243, 236, .05), rgba(247, 243, 236, .02)); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.kpis > .kpi { border: 0; border-radius: 0; box-shadow: none; background: transparent; padding: 26px 26px 24px; }
.kpis > .kpi + .kpi { border-left: 1px solid var(--linha); }
.kpis > .kpi:hover { transform: none; background: color-mix(in srgb, var(--k) 4%, transparent); }
.kpis > .kpi::after { opacity: .7; }
.kpis .kpi .valor { font-weight: 400; font-size: clamp(32px, 2.8vw, 42px); letter-spacing: -.04em; margin: 16px 0 6px; }
.kpis .kpi .det { color: var(--apagado); font-size: 12px; }
@media (max-width: 1100px) {
  .kpis > .kpi:nth-child(2n+1) { border-left: 0; }
  .kpis > .kpi:nth-child(n+3) { border-top: 1px solid var(--linha); }
}
@media (max-width: 820px) { .kpis > .kpi { padding: 20px 16px 18px; } .kpis .kpi .valor { font-size: 25px; } }
@media (max-width: 400px) { .kpis .kpi .valor { font-size: 22px; } }

/* cartões: mais respiro e títulos no mesmo tamanho em todo o app */
.cartao-cab { padding: 22px 26px 18px; }
.cartao-cab + .cartao-corpo, .cartao-corpo { padding: 20px 26px 26px; }
.cartao-cab h2 { font-size: 18px; font-weight: 400; letter-spacing: -.015em; }
.painel, .painel > div { gap: 22px; }
.lista > li { margin: 0 -14px; padding: 13px 14px; }

/* minhas tarefas: abas dentro do cartão e ações rápidas na linha */
.t-abas { order: 3; flex: 1 1 100%; display: grid !important; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 4px; border-radius: 14px; }
.t-abas button { justify-content: center; padding: 7px 4px; border-radius: 10px; font-size: 9.5px; letter-spacing: .12em; }
@media (max-width: 1280px) and (min-width: 1101px), (max-width: 420px) { .t-abas { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.t-abas button { display: inline-flex; align-items: center; gap: 6px; }
.t-abas .n { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 100px; display: inline-grid; place-items: center; font-size: 10px; letter-spacing: 0; background: color-mix(in srgb, currentColor 14%, transparent); }
.t-linha { align-items: flex-start; gap: 8px 10px; flex-wrap: wrap; }
.t-linha .tarefa { flex: 1 1 100%; }
.t-acoes { display: flex; gap: 6px; flex: 1 1 100%; align-items: center; padding-left: 30px; }
.t-acoes .btn { height: 30px; }
.t-acoes .btn-icone { width: 30px; color: var(--destaque); border-color: color-mix(in srgb, var(--destaque) 30%, transparent); }
.t-acoes .btn-icone:hover { background: var(--destaque); color: var(--sobre-destaque); }
.t-adiar { padding: 0 11px; font-size: 9.5px; color: var(--acento); border-color: color-mix(in srgb, var(--acento) 30%, transparent); }
.t-adiar svg { width: 13px; height: 13px; }
:root[data-tema="escuro"] .t-adiar, :root[data-tema="floresta"] .t-adiar { color: var(--acento-claro); }


/* ---------- tipografia wellness: Fraunces (títulos) + Manrope (texto e números) ---------- */
body { font-family: var(--fonte), system-ui, sans-serif; letter-spacing: -.003em; }
