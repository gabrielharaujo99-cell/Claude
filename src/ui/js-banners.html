<style>
/* =====================================================================================
   Banners das telas: estrutura do Be Flow, linguagem do site da Seok.
   Uma tela liga o banner devolvendo, no desenhar(), banner: { chip, manchete, texto, stats, painel, compacto }.
   - chip: rótulo com traço cobre (padrão: o rótulo da tela)
   - manchete: frase com o número principal (HTML; <em> ganha o degradê sálvia → cobre)
   - stats: [{ v, l }] cartões de vidro com o número em cobre claro
   - painel: vidro à direita com dados reais
       { tipo: 'anel', valor, unidade, rot, titulo, barras: [{ l, p (0..1), v, c }] }
       { tipo: 'colunas', titulo, total, itens: [{ l, v, rot, destaque }] }
       { tipo: 'lista', titulo, itens: [{ l, v, p (0..1), c }] }
   O fundo é floresta profunda em todos os temas (mais verde no tema floresta), com luz quente no canto,
   anéis finos (o motivo do site) e pontinhos de fluxo correndo. Nada corta: o banner cresce com o conteúdo.
   ===================================================================================== */
:root {
  --h-bg:
    radial-gradient(60% 120% at 88% -10%, rgba(240, 180, 114, .26), transparent 58%),
    radial-gradient(55% 110% at -5% 110%, rgba(94, 143, 74, .34), transparent 60%),
    linear-gradient(120deg, #0D1108 0%, #141A0F 46%, #1E2A16 100%);
  --h-cr: #F7F3EC; --h-cr2: rgba(247, 243, 236, .72); --h-cr3: rgba(247, 243, 236, .5);
  --h-ouro: #F0B472; --h-salvia: #C5DBAE;
  --h-grad: linear-gradient(92deg, #DCEBCB 0%, #C5DBAE 34%, #F0B472 78%, #E39A5C 100%);
  --h-vidro: rgba(247, 243, 236, .06); --h-vidro-bd: rgba(247, 243, 236, .12);
}
:root[data-tema="escuro"] {
  --h-bg:
    radial-gradient(60% 120% at 88% -10%, rgba(240, 180, 114, .18), transparent 58%),
    radial-gradient(55% 110% at -5% 110%, rgba(94, 143, 74, .24), transparent 60%),
    linear-gradient(120deg, #080B05 0%, #0F140B 50%, #18210F 100%);
}
:root[data-tema="floresta"] {
  --h-bg:
    radial-gradient(60% 120% at 88% -10%, rgba(240, 180, 114, .2), transparent 58%),
    radial-gradient(60% 120% at -5% 110%, rgba(140, 194, 113, .36), transparent 60%),
    linear-gradient(120deg, #0F1A0C 0%, #1A2C14 50%, #2A4220 100%);
}

.topo-texto, .topo-visual, .hero-fx, .hero-stats { display: none; }
.topo.hero {
  position: relative; top: auto; z-index: 1; overflow: hidden; isolation: isolate;
  margin: 24px 32px 0; padding: 40px 44px; border-radius: 26px; min-height: 300px;
  display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-areas: "t v" "a v"; align-content: center; align-items: center; column-gap: 44px; row-gap: 26px;
  background: var(--h-bg); color: var(--h-cr); border: 1px solid rgba(247, 243, 236, .07);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .05) inset, 0 34px 70px -38px rgba(13, 17, 8, .75);
  backdrop-filter: none; -webkit-backdrop-filter: none;
}
.topo.hero.compacto { min-height: 0; padding: 32px 40px; }
.topo.hero.acoes-largas { grid-template-areas: "t v" "a a"; }
.topo.hero.acoes-largas .topo-acoes { padding-top: 22px; border-top: 1px solid rgba(247, 243, 236, .09); }
.topo.hero .topo-titulo { grid-area: t; margin: 0; position: relative; z-index: 2; min-width: 0; }
.topo.hero .topo-acoes { grid-area: a; position: relative; z-index: 2; align-self: start; }
.topo.hero .topo-visual { grid-area: v; display: block; position: relative; z-index: 2; width: 360px; align-self: center; }
.topo.hero .topo-visual:empty { display: none; }
.topo.hero:not(:has(.topo-visual:not(:empty))) { grid-template-columns: minmax(0, 1fr); grid-template-areas: "t" "a"; }

/* anéis finos no canto direito (motivo do site) + linha da marca na base */
.topo.hero::before {
  content: ''; position: absolute; z-index: 0; pointer-events: none; width: 760px; height: 760px; right: -220px; top: 50%; transform: translateY(-50%); border-radius: 50%;
  background: repeating-radial-gradient(circle, transparent 0 58px, rgba(247, 243, 236, .055) 58px 59px);
  -webkit-mask: radial-gradient(circle, #000 0 45%, transparent 70%); mask: radial-gradient(circle, #000 0 45%, transparent 70%);
}
.topo.hero::after {
  content: ''; position: absolute; left: 44px; right: 44px; bottom: 0; height: 1px; z-index: 0; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(169, 81, 31, .9) 20%, #F0B472 45%, #C5DBAE 75%, transparent); background-size: 200% 100%; animation: linha-marca 14s linear infinite;
}
.topo.hero .hero-fx { display: block; position: absolute; inset: 0; z-index: 0; pointer-events: none; width: 100%; height: 100%;
  -webkit-mask: linear-gradient(90deg, transparent 0%, rgba(0, 0, 0, .25) 30%, #000 70%); mask: linear-gradient(90deg, transparent 0%, rgba(0, 0, 0, .25) 30%, #000 70%); }
.hero-aurora { display: none; }
:root[data-tema="floresta"] .topo.hero .hero-aurora, :root[data-tema="floresta"] .cv-hero .hero-aurora {
  display: block; position: absolute; inset: -30%; z-index: 0; pointer-events: none;
  background: radial-gradient(26% 36% at 24% 30%, rgba(140, 194, 113, .32), transparent 70%), radial-gradient(24% 34% at 70% 22%, rgba(240, 180, 114, .2), transparent 70%), radial-gradient(28% 36% at 60% 80%, rgba(94, 143, 74, .36), transparent 70%);
  animation: aurora 24s ease-in-out infinite alternate;
}
@keyframes aurora { 50% { transform: translate(5%, -4%) rotate(10deg) scale(1.06); } 100% { transform: translate(-4%, 4%) rotate(-8deg); } }

/* texto */
.topo.hero .rotulo { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 18px; font: 500 10.5px/1.3 var(--fonte); letter-spacing: .22em; color: var(--h-cr3); }
.topo.hero .rotulo::before { width: 30px; height: 1px; background: var(--h-ouro); }
.topo.hero h1 { font-weight: 200; font-size: clamp(34px, 3.3vw, 52px); letter-spacing: -.04em; line-height: 1.04; color: var(--h-cr); max-width: 18ch; }
.topo.hero.compacto h1 { font-size: clamp(30px, 2.8vw, 42px); }
.topo.hero h1 b { font-weight: 400; color: var(--h-cr); letter-spacing: -.035em; }
.topo.hero h1 em { font-style: normal; font-weight: 300; background: var(--h-grad); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.topo.hero .topo-texto { display: block; margin: 18px 0 0; max-width: 58ch; font-weight: 300; font-size: 15.5px; line-height: 1.65; color: var(--h-cr2); }
.topo.hero .topo-texto:empty { display: none; }
.topo.hero .topo-texto b { font-weight: 500; color: var(--h-cr); font-variant-numeric: tabular-nums; }
.topo.hero .topo-texto .al { color: var(--h-ouro); font-weight: 500; }

/* cartões de números dentro do banner (como os do site: +5, +20, R$5MM) */
.topo.hero .hero-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 26px; max-width: 640px; }
.topo.hero .hero-stats:empty { display: none; }
.hero-stats > div { padding: 16px 18px 14px; border-radius: 16px; background: linear-gradient(180deg, rgba(247, 243, 236, .09), rgba(247, 243, 236, .03)); border: 1px solid var(--h-vidro-bd); }
.hero-stats b { display: block; font-weight: 200; font-size: 30px; letter-spacing: -.04em; line-height: 1.05; color: var(--h-ouro); font-variant-numeric: tabular-nums; }
.hero-stats span { display: block; margin-top: 6px; font-size: 12px; line-height: 1.4; color: var(--h-cr3); }

/* controles dentro do banner */
.topo.hero .entrada, .topo.hero .filtro { background: var(--h-vidro); border-color: var(--h-vidro-bd); color: var(--h-cr); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.topo.hero .entrada::placeholder { color: var(--h-cr3); }
.topo.hero .busca svg { color: var(--h-cr3); z-index: 1; }
.topo.hero .busca .entrada { width: 280px; }
.topo.hero select.entrada option { color: #141A0F; background: #fff; }
.topo.hero .segmentado { background: var(--h-vidro); border-color: var(--h-vidro-bd); }
.topo.hero .segmentado button { color: var(--h-cr2); }
.topo.hero .segmentado button[aria-pressed="true"] { background: var(--h-cr); color: #141A0F; }
.topo.hero .btn { color: var(--h-cr); border-color: rgba(247, 243, 236, .26); background: transparent; }
.topo.hero .btn:hover { background: rgba(247, 243, 236, .07); border-color: rgba(247, 243, 236, .45); }
.topo.hero .btn-primario { background: var(--h-cr); border-color: var(--h-cr); color: #141A0F; box-shadow: 0 12px 28px -14px rgba(240, 180, 114, .6); }
.topo.hero .btn-primario:hover { background: #fff; border-color: #fff; }

/* ---------- painel de vidro com dados ---------- */
.hp { padding: 22px 22px 20px; border-radius: 20px; background: linear-gradient(180deg, rgba(247, 243, 236, .08), rgba(13, 17, 8, .28)); border: 1px solid var(--h-vidro-bd);
  backdrop-filter: blur(16px) saturate(1.2); -webkit-backdrop-filter: blur(16px) saturate(1.2); box-shadow: 0 1px 0 rgba(255, 255, 255, .06) inset; }
.hp-t { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px; font: 500 10px/1.3 var(--fonte); letter-spacing: .2em; text-transform: uppercase; color: var(--h-cr3); }
.hp-t b { font-weight: 300; font-size: 15px; letter-spacing: -.01em; text-transform: none; color: var(--h-cr); font-variant-numeric: tabular-nums; }
.hp-anel { display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 20px; align-items: center; }
.hp-anel .anel { position: relative; width: 108px; height: 108px; }
.hp-anel svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.hp-anel .tr { fill: none; stroke: rgba(247, 243, 236, .1); stroke-width: 6; }
.hp-anel .ar, .hp-anel .br { fill: none; stroke-linecap: round; }
.hp-anel .ar { stroke-width: 6; }
.hp-anel .br { stroke-width: 14; opacity: .14; }
.anim .hp-anel .ar, .anim .hp-anel .br { animation: hp-arco 1.4s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes hp-arco { from { stroke-dashoffset: var(--c0); } }
.hp-anel .num { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 4px; }
.hp-anel .num b { font-weight: 200; font-size: 32px; line-height: 1; letter-spacing: -.04em; color: var(--h-cr); font-variant-numeric: tabular-nums; }
.hp-anel .num b small { font-size: 14px; font-weight: 300; color: var(--h-cr2); margin-left: 1px; }
.hp-anel .num span { font: 500 8.5px/1.25 var(--fonte); letter-spacing: .18em; text-transform: uppercase; color: var(--h-cr3); max-width: 80px; }
.hp-barras { display: grid; gap: 11px; min-width: 0; }
.hp-barra { display: grid; gap: 6px; }
.hp-barra > div { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; line-height: 1.3; color: var(--h-cr2); }
.hp-barra > div b { font-weight: 500; color: var(--h-cr); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hp-barra i { display: block; height: 4px; border-radius: 4px; background: rgba(247, 243, 236, .1); overflow: hidden; }
.hp-barra i s { display: block; height: 100%; border-radius: 4px; background: var(--c, var(--h-salvia)); box-shadow: 0 0 10px color-mix(in srgb, var(--c, #C5DBAE) 60%, transparent); }
.anim .hp-barra i s { animation: hp-encher 1.2s cubic-bezier(.2, .7, .2, 1) .2s both; transform-origin: left; }
@keyframes hp-encher { from { transform: scaleX(0); } }
.hp-lista { display: grid; gap: 13px; }
.hp-cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; align-items: end; height: 132px; }
.hp-col { display: grid; grid-template-rows: 1fr auto; gap: 7px; height: 100%; text-align: center; }
.hp-col i { align-self: end; display: block; border-radius: 6px 6px 3px 3px; min-height: 3px; background: linear-gradient(180deg, rgba(197, 219, 174, .85), rgba(197, 219, 174, .25)); }
.hp-col.on i { background: linear-gradient(180deg, #F0B472, rgba(240, 180, 114, .35)); box-shadow: 0 0 18px rgba(240, 180, 114, .45); }
.anim .hp-col i { animation: hp-subir 1s cubic-bezier(.2, .7, .2, 1) both; transform-origin: bottom; }
.anim .hp-col:nth-child(n+4) i { animation-delay: .06s; } .anim .hp-col:nth-child(n+8) i { animation-delay: .12s; }
@keyframes hp-subir { from { transform: scaleY(0); } }
.hp-col span { font-size: 10px; letter-spacing: .04em; color: var(--h-cr3); white-space: nowrap; }
.hp-pe { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(247, 243, 236, .09); font-size: 12px; color: var(--h-cr3); }
.hp-pe b { color: var(--h-cr); font-weight: 500; }

/* C-Vision usa o mesmo fundo */
.cv-hero { background: var(--h-bg) !important; color: var(--h-cr) !important; border: 1px solid rgba(247, 243, 236, .07); isolation: isolate; border-radius: 26px !important; }
.cv-hero > * { position: relative; z-index: 1; }
.cv-hero .rotulo, .cv-hero p { color: var(--h-cr2) !important; }
.cv-hero h2 { font-weight: 200 !important; letter-spacing: -.04em !important; }
.cv-hero h2 em { background: var(--h-grad); -webkit-background-clip: text; background-clip: text; color: transparent !important; -webkit-text-fill-color: transparent; font-style: normal; }
.cv-hero p b { color: var(--h-cr) !important; }
@media (max-width: 1280px) { .cv-hero { grid-template-columns: minmax(0, 1fr) !important; } .cv-hero .particulas-hero { display: none !important; } }

/* entrada da tela: cartões sobem, barras preenchem */
#tela.entrando .conteudo > *, #tela.entrando .kpis > * { animation: subir-suave .55s cubic-bezier(.2, .7, .2, 1) both; }
#tela.entrando .kpis > *:nth-child(2) { animation-delay: .05s; } #tela.entrando .kpis > *:nth-child(3) { animation-delay: .1s; } #tela.entrando .kpis > *:nth-child(4) { animation-delay: .15s; }
#tela.entrando .conteudo > *:nth-child(2) { animation-delay: .08s; } #tela.entrando .conteudo > *:nth-child(n+3) { animation-delay: .14s; }
#tela.entrando .trilho i { animation: hp-encher 1.1s cubic-bezier(.2, .7, .2, 1) .2s both; transform-origin: left; }
@keyframes subir-suave { from { opacity: 0; transform: translateY(12px); } }
.topo.hero.entrando { animation: subir-suave .5s cubic-bezier(.2, .7, .2, 1) both; }

@media (max-width: 1180px) {
  .topo.hero { grid-template-columns: minmax(0, 1fr) 300px; padding: 34px 32px; column-gap: 28px; }
  .topo.hero .topo-visual { width: 300px; }
}
@media (max-width: 960px) {
  .topo.hero, .topo.hero.acoes-largas { grid-template-columns: minmax(0, 1fr); grid-template-areas: "t" "v" "a"; }
  .topo.hero .topo-visual { width: 100%; max-width: 460px; }
}
@media (max-width: 820px) {
  .topo.hero, .topo.hero.compacto { margin: 12px 16px 0; padding: 26px 20px 24px; min-height: 0; border-radius: 22px; row-gap: 20px; }
  .topo.hero h1, .topo.hero.compacto h1 { font-size: 30px; }
  .topo.hero .topo-texto { font-size: 14.5px; }
  .topo.hero::after { left: 20px; right: 20px; }
  .topo.hero .hero-fx { display: none; }
  .topo.hero .segmentado { flex-wrap: wrap; overflow: visible; border-radius: 18px; }
  .topo.hero .busca, .topo.hero .busca .entrada { width: 100%; }
  .hero-stats b { font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) {
  .topo.hero::after, .hero-aurora, .anim *, #tela.entrando *, .topo.hero.entrando { animation: none !important; }
}
</style>
<script>
/** Banners das telas (manchete, números e painel com dados) e os números que contam ao abrir a tela. */

// Ícone do KPI pelo rótulo: todas as telas ganham ícone sem mexer em cada chamada de kpi().
function iconeKpi(rotulo) {
  const r = normal(rotulo);
  if (/atras|vencid|cobranc/.test(r)) return 'relogio';
  if (/renova/.test(r)) return 'trocar';
  if (/lead|cliente/.test(r)) return 'clientes';
  if (/publica|feedback|frequen|instagram|post/.test(r)) return 'social';
  if (/agend|semana|reuni/.test(r)) return 'calendario';
  if (/aprova|ajuste|over/.test(r)) return 'check';
  if (/rascunho|fila|propost|aguardando/.test(r)) return 'propostas';
  if (/funil/.test(r)) return 'funil';
  if (/previs|roas|cpl|taxa|ctr/.test(r)) return 'trafego';
  if (/hora|media por dia|total no periodo/.test(r)) return 'horas';
  return 'financeiro';
}

// Proporção segura (0..1) para as barras do painel.
function prop(a, b) { return b > 0 ? Math.max(0, Math.min(1, a / b)) : 0; }

const COR_HP = ['#C5DBAE', '#F0B472', '#8CC271', '#E6C7A0', '#9FC9B8'];

function painelHtml(p) {
  const tit = p.titulo ? '<div class="hp-t"><span>' + esc(p.titulo) + '</span>' + (p.total ? '<b>' + esc(p.total) + '</b>' : '') + '</div>' : '';
  const barra = function (x, i) {
    return '<div class="hp-barra" style="--c:' + esc(x.c || COR_HP[i % COR_HP.length]) + '"><div><span>' + esc(x.l) + '</span><b>' + esc(x.v == null ? Math.round(100 * (x.p || 0)) + '%' : x.v) + '</b></div>' +
      '<i><s style="width:' + Math.max(2, Math.round(100 * Math.max(0, Math.min(1, x.p || 0)))) + '%"></s></i></div>';
  };
  if (p.tipo === 'anel') {
    const v = Math.max(0, Math.min(1, Number(p.prog) || 0)), R = 46, C = 2 * Math.PI * R, id = 'hg' + Math.random().toString(36).slice(2, 7);
    return '<div class="hp">' + tit + '<div class="hp-anel"><div class="anel"><svg viewBox="0 0 108 108" aria-hidden="true"><defs><linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="#DCEBCB"/><stop offset=".55" stop-color="#C5DBAE"/><stop offset="1" stop-color="#F0B472"/></linearGradient></defs>' +
      '<circle class="tr" cx="54" cy="54" r="' + R + '"/>' +
      '<circle class="br" cx="54" cy="54" r="' + R + '" stroke="url(#' + id + ')" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - v)).toFixed(1) + '" style="--c0:' + C.toFixed(1) + '"/>' +
      '<circle class="ar" cx="54" cy="54" r="' + R + '" stroke="url(#' + id + ')" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - v)).toFixed(1) + '" style="--c0:' + C.toFixed(1) + '"/></svg>' +
      '<div class="num"><b>' + esc(p.valor) + (p.unidade ? '<small>' + esc(p.unidade) + '</small>' : '') + '</b><span>' + esc(p.rot) + '</span></div></div>' +
      '<div class="hp-barras">' + (p.barras || []).map(barra).join('') + '</div></div>' + (p.pe ? '<div class="hp-pe">' + p.pe + '</div>' : '') + '</div>';
  }
  if (p.tipo === 'colunas') {
    const max = Math.max.apply(null, (p.itens || []).map(function (x) { return x.v; }).concat([1]));
    return '<div class="hp">' + tit + '<div class="hp-cols">' + (p.itens || []).map(function (x) {
      return '<div class="hp-col' + (x.destaque ? ' on' : '') + '" title="' + esc(x.rot || '') + '"><i style="height:' + Math.max(2, Math.round(100 * x.v / max)) + '%"></i><span>' + esc(x.l) + '</span></div>';
    }).join('') + '</div>' + (p.pe ? '<div class="hp-pe">' + p.pe + '</div>' : '') + '</div>';
  }
  return '<div class="hp">' + tit + '<div class="hp-lista">' + (p.itens || []).map(barra).join('') + '</div>' + (p.pe ? '<div class="hp-pe">' + p.pe + '</div>' : '') + '</div>';
}

// ---------- pontinhos de fluxo: faixas de pontos correndo em ondas (o "flow"), o mouse afasta ----------
function bannerFluxo(canvas, alvo) {
  const ctx = canvas.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 2);
  const quieto = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const N = 380, ps = [], mouse = { x: -1e4, y: -1e4 };
  let W = 1, H = 1, parado = false, quadro = 0;
  for (let i = 0; i < N; i++) ps.push({ f: i % 5, u: Math.random(), vel: .00004 + Math.random() * .00007, fase: Math.random() * 6.3, dx: 0, dy: 0, vx: 0, vy: 0, cobre: Math.random() < .12, tam: .5 + Math.random() * .9 });
  function medir() { const r = canvas.getBoundingClientRect(); W = Math.max(1, Math.round(r.width * dpr)); H = Math.max(1, Math.round(r.height * dpr)); canvas.width = W; canvas.height = H; }
  medir();
  function desenhar(t, unico) {
    if (parado) return;
    if (!canvas.isConnected) { parar(); return; }
    if (!unico) quadro = requestAnimationFrame(desenhar);
    if (document.hidden) return;
    ctx.clearRect(0, 0, W, H);
    const rm = 90 * dpr;
    for (let i = 0; i < N; i++) {
      const p = ps[i];
      p.u += p.vel * 16; if (p.u > 1) p.u -= 1;
      const x = p.u * W, base = H * (.22 + p.f * .14);
      const y = base + Math.sin(p.u * 6.283 * 1.2 + t * .00035 + p.f * .8) * H * .07 + Math.sin(p.u * 19 + t * .0008 + p.fase) * H * .012;
      const mx = x + p.dx - mouse.x, my = y + p.dy - mouse.y, d2 = mx * mx + my * my;
      if (d2 < rm * rm && d2 > .01) { const d = Math.sqrt(d2), k = (1 - d / rm); p.vx += mx / d * k * k * 3 * dpr; p.vy += my / d * k * k * 3 * dpr; }

      const brilho = .5 + .5 * Math.sin(t * .0018 + p.fase);
      ctx.globalAlpha = (.18 + .5 * brilho) * Math.min(1, p.u * 6, (1 - p.u) * 6);

  if (quieto) { desenhar(0, true); return parar; }
  quadro = requestAnimationFrame(desenhar);
  return parar;
}

// ---------- pinta o banner no topo (chamado pelo desenhar(), depois de título e ações) ----------
let FLUXO_PARAR = null;
function pintarBanner(r, mudouTela) {
  const topo = document.querySelector('.topo'), b = r.banner;
  topo.classList.toggle('hero', !!b);
  topo.classList.toggle('compacto', !!(b && b.compacto));
  topo.classList.toggle('anim', !!mudouTela);
  // Mais de dois controles (busca, filtros, botões) não cabem ao lado do painel: vão para a linha de baixo.
  topo.classList.toggle('acoes-largas', !!b && document.getElementById('topo-acoes').querySelectorAll('.busca, select, .segmentado, .btn').length > 2);
  if (b && b.chip) document.getElementById('topo-rotulo').textContent = b.chip;
  if (b && b.manchete) document.getElementById('topo-titulo').innerHTML = b.manchete;
  document.getElementById('topo-texto').innerHTML = (b && b.texto) || '';
  document.getElementById('hero-stats').innerHTML = b && b.stats ? b.stats.map(function (s) { return '<div><b>' + esc(s.v) + '</b><span>' + esc(s.l) + '</span></div>'; }).join('') : '';
  document.getElementById('topo-visual').innerHTML = b && b.painel ? painelHtml(b.painel) : '';
  // Os pontinhos continuam correndo entre redesenhos; só começam de novo se o banner some e volta.
  const cv = topo.querySelector('.hero-fx');
  if (b && !FLUXO_PARAR) FLUXO_PARAR = bannerFluxo(cv, topo);
  if (!b && FLUXO_PARAR) { FLUXO_PARAR(); FLUXO_PARAR = null; }
  if (mudouTela && b) { topo.classList.remove('entrando'); void topo.offsetWidth; topo.classList.add('entrando'); }
}

// ---------- números que contam ao abrir a tela ----------
function contarNumeros(raiz) {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  raiz.querySelectorAll('.kpi .valor, .hp-anel .num b, .hero-stats b').forEach(function (el) {
    const n = el.firstChild;
    if (!n || n.nodeType !== 3) return;
    const txt = n.nodeValue, m = txt.match(/\d[\d.]*(,\d+)?/);
    if (!m) return;
    const casas = m[1] ? m[1].length - 1 : 0, alvo = parseFloat(m[0].replace(/\./g, '').replace(',', '.'));
    if (!isFinite(alvo) || alvo === 0) return;
    const antes = txt.slice(0, m.index), depois = txt.slice(m.index + m[0].length), t0 = performance.now(), dur = 900;
    const fmt = function (v) { return v.toLocaleString('pt-BR', { minimumFractionDigits: casas, maximumFractionDigits: casas }); };
    (function passo(t) {
      if (!n.isConnected) return;
      const x = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - x, 3);
      n.nodeValue = x < 1 ? antes + fmt(alvo * e) + depois : txt;
      if (x < 1) requestAnimationFrame(passo);
    })(t0);
  });
}
