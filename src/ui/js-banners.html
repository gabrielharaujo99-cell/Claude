<style>
/* =====================================================================================
   Banners das telas (como no Be Flow, com a cara da Seok): o topo de cada tela vira um banner
   quando a tela devolve { banner: { texto, visual } }. O fundo depende do tema da pessoa:
   claro = creme editorial (grão, ondas finas, brilho cobre); escuro = floresta profunda;
   floresta = aurora (manchas de verde, sálvia e cobre que se movem devagar).
   Do lado direito: órbita fina (Início e Funil) ou pontinhos que desenham uma forma da tela.
   Regra: nada corta. O banner tem altura mínima e cresce com o conteúdo.
   ===================================================================================== */
:root {
  --h-bg:
    radial-gradient(60% 90% at 100% 0%, rgba(181, 104, 58, .16), transparent 62%),
    radial-gradient(50% 80% at 0% 100%, rgba(140, 194, 113, .20), transparent 60%),
    linear-gradient(135deg, #FCFAF5 0%, #F5EFE4 55%, #EDE3D1 100%);
  --h-tx: #18231A; --h-tx2: rgba(24, 35, 26, .68); --h-em: #A9511F; --h-forte: #1E3324;
  --h-bd: rgba(30, 51, 36, .10); --h-linha: rgba(30, 51, 36, .09);
  --h-vidro: rgba(255, 255, 255, .62); --h-vidro-bd: rgba(30, 51, 36, .12);
  --h-sombra: 0 1px 0 rgba(255, 255, 255, .8) inset, 0 18px 50px -28px rgba(60, 42, 20, .35);
  --o1: #3F5B2E; --o2: #A9511F; --o3: #8CB572; --o-trilho: rgba(30, 51, 36, .16);
  --pt1: #2F5A2E; --pt2: #B5683A;
  --h-btn: #1E3324; --h-btn-tx: #F7F3EC;
}
:root[data-tema="escuro"] {
  --h-bg:
    radial-gradient(55% 90% at 92% 8%, rgba(140, 194, 113, .26), transparent 60%),
    radial-gradient(45% 70% at 8% 100%, rgba(217, 160, 102, .16), transparent 62%),
    linear-gradient(120deg, #0A110C 0%, #122016 45%, #1C3622 100%);
  --h-tx: #EEF3EA; --h-tx2: rgba(238, 243, 234, .70); --h-em: #C5DBAE; --h-forte: #FFFFFF;
  --h-bd: rgba(197, 219, 174, .14); --h-linha: rgba(197, 219, 174, .08);
  --h-vidro: rgba(255, 255, 255, .06); --h-vidro-bd: rgba(197, 219, 174, .18);
  --h-sombra: 0 1px 0 rgba(255, 255, 255, .05) inset, 0 24px 60px -30px rgba(0, 0, 0, .8);
  --o1: #C5DBAE; --o2: #D9A066; --o3: #8CC271; --o-trilho: rgba(197, 219, 174, .16);
  --pt1: #DCEBCB; --pt2: #D9A066;
  --h-btn: #C5DBAE; --h-btn-tx: #102016;
}
:root[data-tema="floresta"] {
  --h-bg: linear-gradient(125deg, #0B1A10 0%, #10261A 50%, #163320 100%);
  --h-tx: #F2F8EE; --h-tx2: rgba(242, 248, 238, .72); --h-em: #E2B276; --h-forte: #FFFFFF;
  --h-bd: rgba(166, 211, 136, .2); --h-linha: rgba(166, 211, 136, .1);
  --h-vidro: rgba(255, 255, 255, .07); --h-vidro-bd: rgba(166, 211, 136, .24);
  --h-sombra: 0 1px 0 rgba(255, 255, 255, .06) inset, 0 24px 60px -30px rgba(0, 0, 0, .7);
  --o1: #C9E9B2; --o2: #E2B276; --o3: #A6D388; --o-trilho: rgba(201, 233, 178, .18);
  --pt1: #E8F5DC; --pt2: #E2B276;
  --h-btn: #C9E9B2; --h-btn-tx: #0E1F15;
}

/* ---------- o banner ---------- */
.topo-texto, .topo-visual { display: none; }
.topo.hero {
  position: relative; top: auto; z-index: 1; overflow: hidden; isolation: isolate;
  margin: 22px 32px 0; padding: 34px 38px; border-radius: 24px; min-height: 270px;
  display: grid; grid-template-columns: minmax(0, 1fr) 280px; grid-template-areas: "t v" "a v"; align-content: center; align-items: center; column-gap: 28px; row-gap: 20px;
  background: var(--h-bg); color: var(--h-tx); border: 1px solid var(--h-bd); box-shadow: var(--h-sombra);
  backdrop-filter: none; -webkit-backdrop-filter: none;
}
.topo.hero.compacto { min-height: 0; padding: 26px 34px; }
/* muitos filtros: a linha de ações ocupa a largura toda, embaixo do título e do visual */
.topo.hero.acoes-largas { grid-template-areas: "t v" "a a"; min-height: 0; padding-top: 26px; }
.topo.hero.acoes-largas .topo-visual { height: 180px; }
.topo.hero.acoes-largas .topo-acoes { border-top: 1px solid var(--h-linha); padding-top: 18px; }
.topo.hero .topo-titulo { grid-area: t; margin: 0; position: relative; z-index: 2; }
.topo.hero .topo-acoes { grid-area: a; position: relative; z-index: 2; align-self: start; }
.topo.hero .topo-visual { grid-area: v; display: block; position: relative; z-index: 1; width: 280px; height: 230px; justify-self: center; }
.topo.hero.compacto .topo-visual { height: 190px; }
.topo.hero .rotulo { color: var(--h-tx2); letter-spacing: .2em; margin-bottom: 12px; }
.topo.hero .rotulo::before { width: 28px; background: var(--h-em); }
.topo.hero h1 { font-weight: 200; font-size: clamp(30px, 3.1vw, 44px); letter-spacing: -.035em; line-height: 1.06; color: var(--h-tx); max-width: 22ch; }
.topo.hero.compacto h1 { font-size: clamp(28px, 2.6vw, 36px); }
.topo.hero h1 b { font-weight: 600; color: var(--h-forte); }
.topo.hero h1 em { color: var(--h-em); }
.topo.hero .topo-texto { display: block; margin: 14px 0 0; max-width: 62ch; font-weight: 300; font-size: 15px; line-height: 1.6; color: var(--h-tx2); }
.topo.hero .topo-texto:empty { display: none; }
.topo.hero .topo-texto b { font-weight: 500; color: var(--h-forte); font-variant-numeric: tabular-nums; }
.topo.hero .topo-texto .al { color: var(--h-em); font-weight: 500; }

/* textura: grão fino + ondas concêntricas (respiração) no canto, + linha da marca correndo na base */
.topo.hero::before {
  content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background: repeating-radial-gradient(circle at 87% 50%, transparent 0 26px, var(--h-linha) 26px 27px);
  -webkit-mask: radial-gradient(60% 110% at 87% 50%, #000 0 30%, transparent 72%);
  mask: radial-gradient(60% 110% at 87% 50%, #000 0 30%, transparent 72%);
}
/* grão bem sutil por cima de tudo (papel, no claro; filme, no escuro) */
.topo.hero .topo-titulo::before {
  content: ''; position: absolute; inset: -60px -9999px; z-index: -1; pointer-events: none; opacity: .045; mix-blend-mode: multiply;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>");
}
:root[data-tema="escuro"] .topo.hero .topo-titulo::before, :root[data-tema="floresta"] .topo.hero .topo-titulo::before { mix-blend-mode: screen; opacity: .04; }
.topo.hero::after {
  content: ''; position: absolute; left: 38px; right: 38px; bottom: 0; height: 1px; z-index: 0; pointer-events: none;
  background: var(--grad-marca); background-size: 200% 100%; opacity: .7; animation: linha-marca 14s linear infinite;
}
/* aurora (tema floresta): manchas grandes que derivam devagar (gradientes, sem filter) */
.hero-aurora { display: none; }
:root[data-tema="floresta"] .topo.hero .hero-aurora, :root[data-tema="floresta"] .cv-hero .hero-aurora {
  display: block; position: absolute; inset: -25%; z-index: 0; pointer-events: none;
  background:
    radial-gradient(30% 42% at 26% 34%, rgba(110, 175, 90, .55), transparent 70%),
    radial-gradient(26% 36% at 72% 26%, rgba(201, 233, 178, .34), transparent 70%),
    radial-gradient(30% 40% at 66% 74%, rgba(226, 158, 98, .42), transparent 70%),
    radial-gradient(26% 34% at 40% 82%, rgba(60, 140, 110, .45), transparent 70%),
    radial-gradient(18% 26% at 88% 52%, rgba(226, 178, 118, .30), transparent 70%);
  animation: aurora 22s ease-in-out infinite alternate;
}
@keyframes aurora {
  0% { transform: translate(0, 0) rotate(0deg) scale(1); }
  50% { transform: translate(6%, -4%) rotate(14deg) scale(1.08); }
  100% { transform: translate(-5%, 5%) rotate(-10deg) scale(1.02); }
}

/* controles dentro do banner: vidro fino */
.topo.hero .entrada, .topo.hero .filtro { background: var(--h-vidro); border-color: var(--h-vidro-bd); color: var(--h-tx); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.topo.hero .entrada::placeholder { color: var(--h-tx2); }
.topo.hero .busca svg { color: var(--h-tx2); z-index: 1; }
.topo.hero .busca .entrada { width: 270px; }
.topo.hero select.entrada option { color: #1E2A20; background: #fff; }
.topo.hero .segmentado { background: var(--h-vidro); border-color: var(--h-vidro-bd); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.topo.hero .segmentado button { color: var(--h-tx2); }
.topo.hero .segmentado button[aria-pressed="true"] { background: var(--h-btn); color: var(--h-btn-tx); box-shadow: none; }
.topo.hero .btn:not(.btn-primario) { background: var(--h-vidro); border-color: var(--h-vidro-bd); color: var(--h-tx); }
.topo.hero .btn-primario { background: var(--h-btn); border-color: var(--h-btn); color: var(--h-btn-tx); box-shadow: 0 10px 26px -12px color-mix(in srgb, var(--h-btn) 80%, transparent); }
.topo.hero .btn-primario:hover { filter: brightness(1.06); }

/* ---------- órbita fina (Início e Funil) ---------- */
.orb { position: absolute; inset: 0; display: grid; place-items: center; }
.orb svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.orb .halo { position: absolute; width: 62%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--o3) 30%, transparent), transparent 68%); animation: orb-respira 8s ease-in-out infinite; }
.orb .t1, .orb .t2, .orb .fundo-arco { fill: none; stroke: var(--o-trilho); }
.orb .t1 { stroke-width: 1; }
.orb .t2 { stroke-width: 1; stroke-dasharray: 1.5 6; }
.orb .fundo-arco { stroke-width: 3; }
.orb .arco, .orb .arco-brilho { fill: none; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 130px 130px; }
.orb .arco { stroke-width: 3; animation: orb-arco 1.6s cubic-bezier(.2, .7, .2, 1) both; }
.orb .arco-brilho { stroke-width: 11; opacity: .16; animation: orb-arco 1.6s cubic-bezier(.2, .7, .2, 1) both; }
.orb .resp { fill: none; stroke: var(--o1); stroke-width: 1; transform-origin: 130px 130px; animation: orb-onda 8s ease-in-out infinite; }
.orb .resp.r2 { animation-delay: -4s; }
.orb .giro { transform-origin: 130px 130px; animation: orb-giro 12s linear infinite; }
.orb .giro2 { transform-origin: 130px 130px; animation: orb-giro 22s linear infinite reverse; }
.orb .luz { fill: var(--o2); }
.orb .luz-b { fill: var(--o2); opacity: .2; }
.orb .centro { position: relative; z-index: 2; text-align: center; display: grid; gap: 4px; justify-items: center; }
.orb .centro b { font-weight: 200; font-size: 44px; line-height: 1; letter-spacing: -.04em; color: var(--h-forte); font-variant-numeric: tabular-nums; }
.orb .centro b small { font-size: 18px; font-weight: 300; margin-left: 1px; color: var(--h-tx2); }
.orb .centro span { font: 500 9.5px/1.3 var(--fonte); letter-spacing: .22em; text-transform: uppercase; color: var(--h-tx2); max-width: 110px; }
.orb-sat { position: absolute; z-index: 3; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; display: grid; place-items: center;
  background: color-mix(in srgb, var(--c) 9%, var(--h-vidro)); border: 1px solid color-mix(in srgb, var(--c) 38%, transparent); color: var(--c); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 6%, transparent), 0 8px 22px -12px color-mix(in srgb, var(--c) 80%, transparent);
  animation: orb-flutua 6s ease-in-out infinite; cursor: pointer; transition: transform .2s, box-shadow .2s; }
.orb-sat:nth-of-type(2n) { animation-delay: -3s; }
.orb-sat:hover, .orb-sat:focus-visible { transform: scale(1.12); outline: none; box-shadow: 0 0 0 6px color-mix(in srgb, var(--c) 16%, transparent), 0 10px 26px -8px color-mix(in srgb, var(--c) 80%, transparent); }
.orb-sat svg { width: 17px; height: 17px; }
.orb-sat::after { content: attr(data-l); position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 4px 9px; border-radius: 100px;
  font: 500 10px/1.3 var(--fonte); letter-spacing: .08em; background: var(--h-btn); color: var(--h-btn-tx); opacity: 0; pointer-events: none; transition: opacity .15s; }
.orb-sat.cima::after { top: auto; bottom: calc(100% + 8px); }
.orb-sat:hover::after, .orb-sat:focus-visible::after { opacity: 1; }
@keyframes orb-giro { to { transform: rotate(360deg); } }
@keyframes orb-respira { 50% { transform: scale(1.14); opacity: .7; } }
@keyframes orb-onda { 0% { transform: scale(.62); opacity: 0; } 40% { opacity: .45; } 100% { transform: scale(1.02); opacity: 0; } }
@keyframes orb-flutua { 50% { translate: 0 -4px; } }
@keyframes orb-arco { from { stroke-dashoffset: var(--c0); } }

/* ---------- pontinhos ---------- */
.pts-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* C-Vision usa o mesmo fundo dos banners */
.cv-hero { background: var(--h-bg) !important; color: var(--h-tx) !important; border: 1px solid var(--h-bd); box-shadow: var(--h-sombra) !important; isolation: isolate; }
.cv-hero > * { position: relative; z-index: 1; }
.cv-hero .rotulo, .cv-hero p { color: var(--h-tx2) !important; }
.cv-hero h2 em { color: var(--h-em) !important; }
.cv-hero p b { color: var(--h-forte) !important; }
.cv-anel .nota { fill: var(--h-forte) !important; }
.cv-anel .sub { fill: var(--h-tx2) !important; }
/* em telas médias o texto do C-Vision ficava sem espaço (anel + partículas): as partículas saem e o anel desce */
@media (max-width: 1280px) {
  .cv-hero { grid-template-columns: minmax(0, 1fr) !important; }
  .cv-hero .particulas-hero { display: none !important; }
}

/* ---------- KPIs: barra lateral colorida + ícone em vidro com brilho ---------- */
.kpis > .kpi { --k: var(--o1); }
.kpis > .kpi:nth-child(4n+2) { --k: var(--o2); }
.kpis > .kpi:nth-child(4n+3) { --k: #6E9F5A; }
.kpis > .kpi:nth-child(4n+4) { --k: #C9A27A; }
:root[data-tema="escuro"] .kpis > .kpi:nth-child(4n+3), :root[data-tema="floresta"] .kpis > .kpi:nth-child(4n+3) { --k: #8CC271; }
:root[data-tema="escuro"] .kpis > .kpi:nth-child(4n+4), :root[data-tema="floresta"] .kpis > .kpi:nth-child(4n+4) { --k: #E6C7A0; }
.kpi::before { content: ''; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--k, var(--destaque)); }
.kpi .k-ic { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: var(--k, var(--destaque));
  background: color-mix(in srgb, var(--k, var(--destaque)) 10%, transparent); border: 1px solid color-mix(in srgb, var(--k, var(--destaque)) 22%, transparent); }
.kpi .k-ic::before { content: ''; position: absolute; width: 90px; height: 90px; right: -34px; top: -34px; border-radius: 50%; z-index: -1; background: radial-gradient(circle, color-mix(in srgb, var(--k, var(--destaque)) 18%, transparent), transparent 70%); }
.kpi .k-ic svg { width: 16px; height: 16px; }
.kpi .rotulo { padding-right: 44px; display: block; }
.kpi .valor { color: var(--texto) !important; font-weight: 300; }
.kpi.escuro { background: var(--superficie); border-color: var(--linha); color: var(--texto); }
.kpi.escuro .rotulo { color: var(--suave); }
.kpi.escuro .det { color: var(--suave); }
.kpi { transition: transform .25s ease, box-shadow .25s ease, border-color .25s; isolation: isolate; }
.kpi:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--k, var(--destaque)) 35%, var(--linha)); }

/* ---------- cartões em vidro nos temas escuros ---------- */
:root[data-tema="escuro"] .cartao, :root[data-tema="floresta"] .cartao {
  background: linear-gradient(180deg, color-mix(in srgb, var(--superficie) 86%, #fff 2%), color-mix(in srgb, var(--superficie) 80%, transparent));
  border-color: color-mix(in srgb, var(--salvia) 12%, transparent);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .045), var(--sombra);
}
:root[data-tema="floresta"] .cartao { backdrop-filter: blur(12px) saturate(1.2); -webkit-backdrop-filter: blur(12px) saturate(1.2); }

/* ---------- menu: ícones mais leves, marcador fino com brilho ---------- */
.menu button { transition: background .18s, color .18s; }
.menu button svg { stroke-width: 1.4; transition: transform .2s; }
.menu button:hover svg { transform: translateX(1px); }
.menu button[aria-current="page"]::before { width: 3px; box-shadow: 0 0 12px color-mix(in srgb, var(--c-acc) 70%, transparent); }

/* ---------- entrada da tela: cartões sobem, barras preenchem ---------- */
#tela.entrando .conteudo > * { animation: subir-suave .55s cubic-bezier(.2, .7, .2, 1) both; }
#tela.entrando .conteudo > *:nth-child(2) { animation-delay: .06s; }
#tela.entrando .conteudo > *:nth-child(3) { animation-delay: .12s; }
#tela.entrando .conteudo > *:nth-child(n+4) { animation-delay: .18s; }
#tela.entrando .kpis > * { animation: subir-suave .55s cubic-bezier(.2, .7, .2, 1) both; }
#tela.entrando .kpis > *:nth-child(2) { animation-delay: .05s; }
#tela.entrando .kpis > *:nth-child(3) { animation-delay: .1s; }
#tela.entrando .kpis > *:nth-child(4) { animation-delay: .15s; }
#tela.entrando .trilho i { animation: encher 1.1s cubic-bezier(.2, .7, .2, 1) .2s both; transform-origin: left; }
@keyframes subir-suave { from { opacity: 0; transform: translateY(10px); } }
@keyframes encher { from { transform: scaleX(0); } }
.topo.hero.entrando { animation: subir-suave .5s cubic-bezier(.2, .7, .2, 1) both; }

/* ---------- larguras menores ---------- */
@media (max-width: 1100px) {
  .topo.hero { grid-template-columns: minmax(0, 1fr) 220px; padding: 28px 28px; column-gap: 18px; }
  .topo.hero .topo-visual { width: 220px; height: 200px; }
  .orb .centro b { font-size: 38px; }
}
@media (max-width: 820px) {
  .topo.hero, .topo.hero.compacto { margin: 12px 16px 0; padding: 24px 20px 22px; min-height: 0; grid-template-columns: minmax(0, 1fr); grid-template-areas: "t" "a"; border-radius: 20px; }
  .topo.hero .topo-visual { display: none; }
  .topo.hero h1 { font-size: 28px; }
  .topo.hero .topo-texto { font-size: 14px; }
  .topo.hero::after { left: 20px; right: 20px; }
  .topo.hero .segmentado { flex-wrap: wrap; overflow: visible; border-radius: 18px; }
  .topo.hero .busca, .topo.hero .busca .entrada { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .topo.hero::after, .hero-aurora, .orb *, .orb-sat, #tela.entrando *, .topo.hero.entrando { animation: none !important; }
}
</style>
<script>
/** Banners das telas: o visual do lado direito (órbita ou pontinhos) e os números que contam ao abrir a tela. */

// Ícone do KPI pelo rótulo: assim todas as telas ganham ícone sem mexer em cada chamada de kpi().
function iconeKpi(rotulo) {
  const r = normal(rotulo);
  if (/atras|vencid|cobranc/.test(r)) return 'relogio';
  if (/renova/.test(r)) return 'trocar';
  if (/lead|cliente/.test(r)) return 'clientes';
  if (/publica|feedback|frequen|instagram|post/.test(r)) return 'social';
  if (/agend|semana|reuni/.test(r)) return 'calendario';
  if (/aprova|ajuste|over/.test(r)) return 'check';
  if (/rascunho|fila|propost|aguardando/.test(r)) return 'propostas';
  if (/funil/.test(r)) return 'funil';
  if (/previs|roas|cpl|taxa|ctr/.test(r)) return 'trafego';
  if (/hora|media por dia|total no periodo/.test(r)) return 'horas';
  return 'financeiro';
}

// ---------- órbita ----------
const ORB_ANG = [-38, 38, 142, 218];
function bannerOrbita(v) {
  const p = Math.max(0, Math.min(1, Number(v.prog) || 0));
  const R = 64, C = 2 * Math.PI * R, id = 'og' + Math.random().toString(36).slice(2, 7);
  const sats = (v.sats || []).slice(0, 4).map(function (s, i) {
    const a = ORB_ANG[i] * Math.PI / 180, x = (130 + 118 * Math.cos(a)) / 2.6, y = (130 + 118 * Math.sin(a)) / 2.6;
    const cor = ['var(--o1)', 'var(--o2)', 'var(--o3)', 'var(--h-em)'][i];
    return '<span class="orb-sat' + (y > 50 ? ' cima' : '') + '" role="button" tabindex="0" data-ir-tela="' + esc(s.ir || '') + '" data-l="' + esc(s.rot) + '" aria-label="' + esc(s.rot) +
      '" style="left:' + x.toFixed(2) + '%;top:' + y.toFixed(2) + '%;--c:' + cor + '">' + icone(s.ic) + '</span>';
  }).join('');
  return '<div class="orb">' +
    '<span class="halo"></span>' +
    '<svg viewBox="0 0 260 260" aria-hidden="true"><defs>' +
      '<linearGradient id="' + id + 'a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--o3)"/><stop offset=".55" style="stop-color:var(--o1)"/><stop offset="1" style="stop-color:var(--o2)"/></linearGradient>' +
      '<linearGradient id="' + id + 'c" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--o2);stop-opacity:0"/><stop offset="1" style="stop-color:var(--o2)"/></linearGradient></defs>' +
      '<circle class="t1" cx="130" cy="130" r="118"/><circle class="t2" cx="130" cy="130" r="92"/>' +
      '<circle class="resp" cx="130" cy="130" r="100"/><circle class="resp r2" cx="130" cy="130" r="100"/>' +
      '<g class="giro"><circle cx="130" cy="130" r="118" fill="none" stroke="url(#' + id + 'c)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="70 ' + (2 * Math.PI * 118).toFixed(1) + '"/>' +
        '<circle class="luz-b" cx="248" cy="130" r="6"/><circle class="luz" cx="248" cy="130" r="2.2"/></g>' +
      '<g class="giro2"><circle class="luz-b" cx="38" cy="130" r="5"/><circle class="luz" cx="38" cy="130" r="1.8" style="fill:var(--o3)"/><circle class="luz" cx="196" cy="65" r="1.4" style="fill:var(--o1)"/></g>' +
      '<circle class="fundo-arco" cx="130" cy="130" r="' + R + '"/>' +
      '<circle class="arco-brilho" cx="130" cy="130" r="' + R + '" stroke="url(#' + id + 'a)" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - p)).toFixed(1) + '" style="--c0:' + C.toFixed(1) + '"/>' +
      '<circle class="arco" cx="130" cy="130" r="' + R + '" stroke="url(#' + id + 'a)" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - p)).toFixed(1) + '" style="--c0:' + C.toFixed(1) + '"/>' +
    '</svg>' +
    '<div class="centro"><b>' + esc(v.valor) + (v.unidade ? '<small>' + esc(v.unidade) + '</small>' : '') + '</b><span>' + esc(v.rot) + '</span></div>' +
    sats + '</div>';
}

// ---------- pontinhos que desenham formas ----------
// Cada forma é desenhada num canvas de 240×180 e amostrada em pontos; os pontos passeiam de uma forma para a outra.
const FORMAS = {
  folha: function (g) {
    g.beginPath(); g.moveTo(58, 152); g.quadraticCurveTo(30, 40, 196, 26); g.quadraticCurveTo(190, 150, 58, 152); g.fill();
    g.globalCompositeOperation = 'destination-out'; g.lineWidth = 5; g.beginPath(); g.moveTo(52, 160); g.quadraticCurveTo(120, 100, 182, 40); g.stroke();
  },
  pulso: function (g) { g.lineWidth = 9; g.beginPath(); [[8, 96], [70, 96], [88, 62], [108, 142], [130, 28], [150, 112], [164, 96], [232, 96]].forEach(function (p, i) { if (i) g.lineTo(p[0], p[1]); else g.moveTo(p[0], p[1]); }); g.stroke(); },
  barras: function (g) { [[34, 56], [80, 84], [126, 112], [172, 146]].forEach(function (b) { g.fillRect(b[0], 164 - b[1], 32, b[1]); }); },
  check: function (g) { g.lineWidth = 8; g.beginPath(); g.arc(120, 90, 72, 0, 7); g.stroke(); g.lineWidth = 12; g.beginPath(); g.moveTo(84, 92); g.lineTo(110, 118); g.lineTo(160, 66); g.stroke(); },
  relogio: function (g) { g.lineWidth = 8; g.beginPath(); g.arc(120, 90, 72, 0, 7); g.stroke(); g.lineWidth = 10; g.beginPath(); g.moveTo(120, 44); g.lineTo(120, 92); g.lineTo(156, 112); g.stroke(); },
  pessoas: function (g) {
    g.beginPath(); g.arc(98, 58, 28, 0, 7); g.fill(); g.beginPath(); g.ellipse(98, 160, 56, 52, 0, Math.PI, 0); g.fill();
    g.beginPath(); g.arc(164, 70, 21, 0, 7); g.fill(); g.beginPath(); g.ellipse(170, 160, 40, 42, 0, Math.PI, 0); g.fill();
  },
  balao: function (g) {
    g.lineWidth = 8; g.beginPath(); g.roundRect(30, 24, 180, 110, 26); g.stroke();
    g.beginPath(); g.moveTo(70, 132); g.lineTo(56, 164); g.lineTo(100, 134); g.stroke();
    [86, 120, 154].forEach(function (x) { g.beginPath(); g.arc(x, 79, 9, 0, 7); g.fill(); });
  },
  coracao: function (g) {
    g.beginPath(); g.moveTo(120, 160); g.bezierCurveTo(30, 100, 40, 20, 120, 52); g.bezierCurveTo(200, 20, 210, 100, 120, 160); g.fill();
  },
  alvo: function (g) { g.lineWidth = 8; [72, 48, 24].forEach(function (r) { g.beginPath(); g.arc(120, 90, r, 0, 7); g.stroke(); }); g.beginPath(); g.arc(120, 90, 7, 0, 7); g.fill(); },
  moeda: function (g) {
    g.lineWidth = 8; g.beginPath(); g.arc(120, 90, 72, 0, 7); g.stroke();
    g.font = '600 64px Archivo, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('R$', 120, 94);
  },
  documento: function (g) {
    g.lineWidth = 8; g.beginPath(); g.moveTo(70, 14); g.lineTo(140, 14); g.lineTo(174, 48); g.lineTo(174, 166); g.lineTo(70, 166); g.closePath(); g.stroke();
    g.beginPath(); g.moveTo(140, 14); g.lineTo(140, 48); g.lineTo(174, 48); g.stroke();
    g.lineWidth = 7; [[90, 82, 154], [90, 106, 154], [90, 130, 132]].forEach(function (l) { g.beginPath(); g.moveTo(l[0], l[1]); g.lineTo(l[2], l[1]); g.stroke(); });
  },
};
const CACHE_FORMAS = {};
function pontosDaForma(nome) {
  if (CACHE_FORMAS[nome]) return CACHE_FORMAS[nome];
  const c = document.createElement('canvas'); c.width = 240; c.height = 180;
  const g = c.getContext('2d'); g.fillStyle = g.strokeStyle = '#000'; g.lineCap = g.lineJoin = 'round';
  (FORMAS[nome] || FORMAS.folha)(g);
  const px = g.getImageData(0, 0, 240, 180).data, pts = [];
  for (let y = 0; y < 180; y += 4) for (let x = 0; x < 240; x += 4) if (px[(y * 240 + x) * 4 + 3] > 120) pts.push({ x: (x - 120) / 240, y: (y - 90) / 240 });
  for (let i = pts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = pts[i]; pts[i] = pts[j]; pts[j] = t; }
  return (CACHE_FORMAS[nome] = pts);
}

function bannerPontos(canvas, formas, alvo) {
  const ctx = canvas.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 2);
  const quieto = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fs = formas.map(pontosDaForma), N = 560, ps = [], mouse = { x: -1e4, y: -1e4 };
  let W = 1, H = 1, parado = false, quadro = 0, cores = ['#2F5A2E', '#B5683A'], nQ = 0;
  for (let i = 0; i < N; i++) ps.push({ x: 0, y: 0, vx: 0, vy: 0, livre: Math.random() < .1, ang: Math.random() * 6.3, raio: .3 + Math.random() * .2, fase: Math.random() * 6.3, vel: .6 + Math.random() * 1.6, cobre: Math.random() < .1, nx: Math.random() - .5, ny: Math.random() - .5 });
  function medir() { const r = canvas.getBoundingClientRect(); W = Math.max(1, Math.round(r.width * dpr)); H = Math.max(1, Math.round(r.height * dpr)); canvas.width = W; canvas.height = H; }
  function lerCores() { const cs = getComputedStyle(alvo || canvas); cores = [cs.getPropertyValue('--pt1').trim() || cores[0], cs.getPropertyValue('--pt2').trim() || cores[1]]; }
  const suave = function (x) { return x * x * (3 - 2 * x); };
  medir(); lerCores();
  ps.forEach(function (p) { p.x = W / 2 + p.nx * W * .6; p.y = H / 2 + p.ny * H * .6; });
  function desenhar(t, unico) {
    if (parado) return;
    if (!canvas.isConnected) { parar(); return; }
    if (!unico) quadro = requestAnimationFrame(desenhar);
    if (document.hidden) return;
    if (++nQ % 45 === 0) lerCores();
    const ciclo = 6.2, seg = (t / 1000) / ciclo, k = Math.floor(seg) % fs.length, fr = seg - Math.floor(seg);
    const trans = fs.length > 1 && fr > .74 ? suave((fr - .74) / .26) : 0, espalha = Math.sin(trans * Math.PI);
    const A = fs[k], B = fs[(k + 1) % fs.length], larg = Math.min(W * .86, H * 1.12), cx = W / 2, cy = H / 2;
    const balanco = Math.sin(t * .0005) * .12, rm = 70 * dpr;
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < N; i++) {
      const p = ps[i];
      let tx, ty;
      if (p.livre) { p.ang += .0016 * p.vel; tx = cx + Math.cos(p.ang) * W * p.raio * 1.25; ty = cy + Math.sin(p.ang * 1.3) * H * p.raio; }
      else {
        const a = A[i % A.length], b = B[i % B.length];
        const ax = a.x * Math.cos(balanco), bx = b.x * Math.cos(balanco);
        tx = cx + (ax + (bx - ax) * trans) * larg + p.nx * espalha * W * .5;
        ty = cy + (a.y + (b.y - a.y) * trans) * larg + p.ny * espalha * H * .5 + Math.sin(t * .0012 + p.fase) * 1.2 * dpr;
      }
      p.vx += (tx - p.x) * .06; p.vy += (ty - p.y) * .06;
      const dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy;
      if (d2 < rm * rm && d2 > .01) { const d = Math.sqrt(d2), f = 1 - d / rm; p.vx += dx / d * f * f * 8 * dpr; p.vy += dy / d * f * f * 8 * dpr; }
      p.vx *= .8; p.vy *= .8; p.x += p.vx; p.y += p.vy;
      const brilho = .55 + .45 * Math.sin(t * .002 * p.vel + p.fase);
      ctx.globalAlpha = p.livre ? .2 + .45 * brilho : .3 + .55 * brilho;
      ctx.fillStyle = p.cobre ? cores[1] : cores[0];
      const r = (p.livre ? .8 : .55 + brilho * .6) * dpr;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function mover(e) { const r = canvas.getBoundingClientRect(); mouse.x = (e.clientX - r.left) * dpr; mouse.y = (e.clientY - r.top) * dpr; }
  function sair() { mouse.x = mouse.y = -1e4; }
  const caixa = alvo || canvas;
  caixa.addEventListener('mousemove', mover); caixa.addEventListener('mouseleave', sair);
  const obs = window.ResizeObserver ? new ResizeObserver(medir) : null;
  if (obs) obs.observe(canvas);
  function parar() { parado = true; cancelAnimationFrame(quadro); if (obs) obs.disconnect(); caixa.removeEventListener('mousemove', mover); caixa.removeEventListener('mouseleave', sair); }
  if (quieto) { ps.forEach(function (p) { p.livre = false; }); for (let q = 0; q < 120; q++) desenhar(0, true); return parar; }
  quadro = requestAnimationFrame(desenhar);
  return parar;
}

// ---------- pinta o banner no topo (chamado pelo desenhar()) ----------
let BANNER_CHAVE = '', BANNER_PARAR = null;
function pintarBanner(r, mudouTela) {
  const topo = document.querySelector('.topo'), b = r.banner;
  topo.classList.toggle('hero', !!b);
  topo.classList.toggle('compacto', !!(b && b.compacto));
  // Mais de dois controles (busca, filtros, botões) não cabem ao lado do visual: vão para a linha de baixo.
  topo.classList.toggle('acoes-largas', !!b && document.getElementById('topo-acoes').querySelectorAll('.busca, select, .segmentado, .btn').length > 2);
  document.getElementById('topo-texto').innerHTML = (b && b.texto) || '';
  const vis = document.getElementById('topo-visual');
  const chave = b && b.visual ? S.tela + '|' + JSON.stringify(b.visual) : '';
  if (chave === BANNER_CHAVE && !mudouTela) return; // mesmo visual: não reinicia a animação
  BANNER_CHAVE = chave;
  if (BANNER_PARAR) { try { BANNER_PARAR(); } catch (e) { /* já parou */ } BANNER_PARAR = null; }
  vis.innerHTML = '';
  if (!b || !b.visual) return;
  if (b.visual.tipo === 'orbita') vis.innerHTML = bannerOrbita(b.visual);
  else {
    const cv = document.createElement('canvas'); cv.className = 'pts-cv'; cv.setAttribute('aria-hidden', 'true'); vis.appendChild(cv);
    BANNER_PARAR = bannerPontos(cv, b.visual.formas || ['folha'], topo);
  }
  if (mudouTela) { topo.classList.remove('entrando'); void topo.offsetWidth; topo.classList.add('entrando'); }
}

// ---------- números que contam ao abrir a tela ----------
function contarNumeros(raiz) {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  raiz.querySelectorAll('.kpi .valor, .orb .centro b').forEach(function (el) {
    const n = el.firstChild;
    if (!n || n.nodeType !== 3) return;
    const txt = n.nodeValue, m = txt.match(/\d[\d.]*(,\d+)?/);
    if (!m) return;
    const casas = m[1] ? m[1].length - 1 : 0, alvo = parseFloat(m[0].replace(/\./g, '').replace(',', '.'));
    if (!isFinite(alvo) || alvo === 0) return;
    const antes = txt.slice(0, m.index), depois = txt.slice(m.index + m[0].length), t0 = performance.now(), dur = 900;
    const fmt = function (v) { return v.toLocaleString('pt-BR', { minimumFractionDigits: casas, maximumFractionDigits: casas }); };
    (function passo(t) {
      if (!n.isConnected) return;
      const x = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - x, 3);
      n.nodeValue = x < 1 ? antes + fmt(alvo * e) + depois : txt;
      if (x < 1) requestAnimationFrame(passo);
    })(t0);
  });
}

// Clique num satélite da órbita leva para a tela dele.
document.addEventListener('click', function (e) {
  const s = e.target.closest && e.target.closest('.orb-sat[data-ir-tela]');
  if (s && s.dataset.irTela) irPara(s.dataset.irTela);
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  const s = e.target.closest && e.target.closest('.orb-sat[data-ir-tela]');
  if (s && s.dataset.irTela) irPara(s.dataset.irTela);
});
