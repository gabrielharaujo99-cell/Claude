<script>
/**
 * Base da tela: estado, chamadas ao servidor, formatação, ícones, modal, toasts e marca.
 * Cada tela registra uma entrada em TELAS (ver js-inicio, js-funil, js-telas, js-admin).
 */
const S = { dados: null, tela: 'inicio', filtros: { busca: '', responsavel: '', servico: '' } };
const TELAS = {};
const PAPEIS = { leitor: 1, colaborador: 2, gestor: 3, admin: 4 };
const NOME_PAPEL = { leitor: 'Leitor', colaborador: 'Colaborador', gestor: 'Gestor', admin: 'Admin' };

// Nome do produto (Admin > Marca); antes de carregar, o padrão.
function produto() { return (S.dados && S.dados.config && S.dados.config.produto) || 'Flowloop'; }

// Carimbo desta tela (o empacotador troca 'dev' pela data da publicação; o servidor tem o mesmo em BUILD).
const BUILD = 'dev';
// Leituras: podem ser repetidas sem efeito colateral, então tentam de novo uma vez se a rede falhar.
const LEITURAS = { carregar: 1, cvision: 1, detalheOportunidade: 1, ping: 1 };

// google.script.run em forma de Promise. O erro chega como Error com uma mensagem que dá para mostrar à pessoa.
function chamar(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  const uma = function () {
    return new Promise(function (ok, erro) {
      google.script.run.withSuccessHandler(ok).withFailureHandler(erro)[fn].apply(null, args);
    });
  };
  return uma().catch(function (e) {
    if (LEITURAS[fn] && erroDeRede(e)) return new Promise(function (r) { setTimeout(r, 1500); }).then(uma);
    throw e;
  }).catch(function (e) {
    const err = new Error(mensagemErro(e));
    err.original = e;
    throw err;
  });
}

function erroDeRede(e) { return /NetworkError|network|Failed to fetch|timed? ?out|tempo esgotado/i.test(String(e && e.message || e)); }

// Erros técnicos do Google viram frases que a pessoa entende; as mensagens do nosso servidor passam como estão.
function mensagemErro(e) {
  const m = String(e && e.message || e || '').replace(/^(Exception|Error|ScriptError|TypeError):\s*/i, '').trim();
  if (!navigator.onLine || erroDeRede(e)) return 'Sem conexão com o servidor. Confira a internet e tente de novo.';
  if (/Authorization is required/i.test(m)) return 'O Google pediu uma nova autorização. Recarregue a página e aceite as permissões.';
  if (/too many times|Service invoked|Quota/i.test(m)) return 'O Google limitou as chamadas por alguns instantes. Espere um minuto e tente de novo.';
  if (/Lock timeout|another process/i.test(m)) return 'Outra pessoa está gravando agora. Tente de novo em alguns segundos.';
  if (/Script function not found/i.test(m)) return 'Esta página está desatualizada. Recarregue para usar a versão nova.';
  if (/exceeded maximum execution time/i.test(m)) return 'A operação demorou demais. Tente de novo; se repetir, avise o administrador.';
  if (/PERMISSION_DENIED|You do not have permission|Access denied/i.test(m)) return 'O Google negou o acesso a este recurso. Fale com o administrador.';
  return m || 'Algo deu errado. Tente de novo.';
}

// Faixa fixa no topo, para avisos que não podem sumir sozinhos (versão nova, sem internet). html vazio remove.
function faixa(id, html, tipo) {
  let el = document.getElementById(id);
  if (!html) { if (el) el.remove(); return null; }
  if (!el) {
    el = document.createElement('div');
    el.id = id;
    el.className = 'faixa-aviso ' + (tipo || '');
    el.setAttribute('role', 'status');
    document.body.appendChild(el);
  }
  el.innerHTML = html;
  return el;
}

function avisarVersaoNova() {
  if (document.getElementById('faixa-versao')) return;
  const el = faixa('faixa-versao', '<span>Saiu uma versão nova do ' + esc(produto()) + '.</span><button type="button" class="btn btn-peq">Atualizar agora</button>', 'novidade');
  el.querySelector('button').onclick = function () { location.reload(); };
}

window.addEventListener('offline', function () { faixa('faixa-rede', '<span>Você está sem internet. O que gravar agora não vai ser salvo.</span>', 'alerta'); });
window.addEventListener('online', function () { if (document.getElementById('faixa-rede')) { faixa('faixa-rede', ''); toast('Conexão de volta.'); } });

// Nenhum erro da tela passa em silêncio: vai para o console e vira um aviso (no máximo um a cada 10 s).
let ULTIMO_ERRO_TELA = 0;
function erroDaTela() {
  if (Date.now() - ULTIMO_ERRO_TELA < 10000) return;
  ULTIMO_ERRO_TELA = Date.now();
  try { toast('Algo deu errado nesta tela. Se continuar, recarregue a página.', { erro: true, acao: { texto: 'Recarregar', fn: function () { location.reload(); } } }); } catch (e) { /* toasts ainda não existem */ }
}
window.addEventListener('error', function (e) {
  if (!e.message || /ResizeObserver|^Script error\.?$/.test(e.message)) return;
  console.error('[Flowloop]', e.message, e.error);
  erroDaTela();
});
window.addEventListener('unhandledrejection', function (e) {
  console.error('[Flowloop]', e.reason);
  erroDaTela();
});

// Executa uma gravação mostrando o erro num toast; devolve o resultado ou null.
async function gravar(fn, args, ok) {
  try {
    const r = await chamar.apply(null, [fn].concat(args || []));
    if (ok) toast(ok);
    return r;
  } catch (e) {
    toast(e.message, { erro: true });
    return null;
  }
}

function pode(papel) { return !!S.dados && (PAPEIS[S.dados.eu.papel] || 0) >= PAPEIS[papel]; }

// ---------- texto e formatação ----------
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function dinheiro(v, curto) {
  const moeda = S.dados ? S.dados.config.moeda : 'BRL';
  const n = Number(v) || 0;
  if (curto && Math.abs(n) >= 1000) {
    const fmt = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: moeda, notation: 'compact', maximumFractionDigits: 1 });
    return fmt.format(n);
  }
  return n.toLocaleString('pt-BR', { style: 'currency', currency: moeda, maximumFractionDigits: n % 1 ? 2 : 0 });
}

function dataBr(iso) {
  if (!iso) return '';
  const s = String(iso).slice(0, 10).split('-');
  return s.length === 3 ? s[2] + '/' + s[1] + '/' + s[0] : '';
}

function dataCurta(iso) {
  if (!iso) return '';
  const d = new Date(String(iso).length <= 10 ? iso + 'T12:00:00' : iso);
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }).replace('.', '');
}

function quando(iso) {
  const t = Date.parse(iso);
  if (!isFinite(t)) return '';
  const min = Math.round((Date.now() - t) / 6e4);
  if (min < 1) return 'agora';
  if (min < 60) return 'há ' + min + ' min';
  const h = Math.round(min / 60);
  if (h < 24) return 'há ' + h + ' h';
  const d = Math.round(h / 24);
  if (d < 30) return 'há ' + d + (d === 1 ? ' dia' : ' dias');
  return dataBr(iso);
}

function diasDesde(iso) { const t = Date.parse(iso); return isFinite(t) ? Math.floor((Date.now() - t) / 864e5) : 0; }

function normal(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

function iniciais(nome) {
  const p = String(nome || '?').replace(/\(.*?\)/g, '').trim().split(/\s+/);
  return ((p[0] || '?').charAt(0) + (p.length > 1 ? p[p.length - 1].charAt(0) : '')).toUpperCase();
}

const CORES_AVATAR = ['#5E8A4A', '#3E6B45', '#8C9A7E', '#B5683A', '#4D7C6A', '#7A8F3E', '#2F5A2E', '#C9A27A'];

// As fotos (enviadas no perfil ou do diretório do Google) viram classes num <style> só, para não repetir
// a imagem inteira em cada avatar da tela. Chamar de novo sempre que a equipe mudar.
const CLASSE_FOTO = {};
function registrarFotos() {
  let css = '', i = 0;
  Object.keys(CLASSE_FOTO).forEach(function (k) { delete CLASSE_FOTO[k]; });
  (S.dados ? S.dados.equipe : []).forEach(function (m) {
    if (!m.foto || !/^(data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+|https:\/\/[^\s"'()]+)$/.test(m.foto)) return;
    CLASSE_FOTO[m.email] = 'av-' + (++i);
    css += '.av-' + i + '{background-image:url("' + m.foto + '")}';
  });
  let st = document.getElementById('fotos-equipe');
  if (!st) { st = document.createElement('style'); st.id = 'fotos-equipe'; document.head.appendChild(st); }
  st.textContent = css;
}

// tamanho: '' | 'p' | 'g' | 'xg'. online: mostra a bolinha verde de presença.
function avatar(email, tamanho, online) {
  const m = membro(email);
  const nome = m ? m.nome : (email || '?');
  let h = 0;
  for (let i = 0; i < String(email).length; i++) h = (h * 31 + String(email).charCodeAt(i)) >>> 0;
  const foto = CLASSE_FOTO[email];
  return '<span class="avatar' + (tamanho ? ' ' + tamanho : '') + (foto ? ' foto ' + foto : '') + (online ? ' on' : '') + '" style="--av:' + CORES_AVATAR[h % CORES_AVATAR.length] + '" title="' +
    esc(nome + (m && m.cargo ? ' · ' + m.cargo : '') + (online ? ' · online' : '')) + '">' + (foto ? '' : esc(iniciais(nome))) + '</span>';
}

// ---------- consultas ao estado ----------
function membro(email) { return S.dados ? S.dados.equipe.find(function (m) { return m.email === email; }) : null; }
function nomeMembro(email) { const m = membro(email); return m ? m.nome : (email || '—'); }
function cliente(id) { return S.dados ? S.dados.clientes.find(function (c) { return c.id === id; }) : null; }
function nomeCliente(id) { const c = cliente(id); return c ? c.nome : ''; }
function oportunidade(id) { return S.dados ? S.dados.oportunidades.find(function (o) { return o.id === id; }) : null; }
function etapa(id) { return S.dados.config.etapas.find(function (e) { return e.id === id; }) || null; }
function totalOp(o) { return o.contrato === 'fee' ? (o.valor || 0) * (o.meses || 0) : (o.valor || 0); }
function parada(o) {
  const e = etapa(o.etapa);
  return !!e && e.tipo === 'aberta' && diasDesde(o.etapaDesde) >= S.dados.config.diasParado;
}
function equipeAtiva() { return S.dados.equipe.filter(function (m) { return m.ativo; }); }
function opsAtivas() { return S.dados.oportunidades.filter(function (o) { return !o.arquivado; }); }

// Troca um registro no estado local pelo que o servidor devolveu.
function trocar(lista, novo, chave) {
  const k = chave || 'id';
  const arr = S.dados[lista];
  const i = arr.findIndex(function (x) { return x[k] === novo[k]; });
  if (i >= 0) arr[i] = novo; else arr.push(novo);
  return novo;
}

function opcoes(lista, atual, vazio) {
  return (vazio != null ? '<option value="">' + esc(vazio) + '</option>' : '') + lista.map(function (x) {
    const v = typeof x === 'object' ? x.v : x, t = typeof x === 'object' ? x.t : x;
    return '<option value="' + esc(v) + '"' + (String(v) === String(atual == null ? '' : atual) ? ' selected' : '') + '>' + esc(t) + '</option>';
  }).join('');
}

function lerForm(form) {
  const o = {};
  Array.prototype.forEach.call(form.elements, function (el) {
    if (!el.name) return;
    if (el.type === 'checkbox') o[el.name] = el.checked;
    else if (el.type === 'radio') { if (el.checked) o[el.name] = el.value; }
    else o[el.name] = el.value;
  });
  return o;
}

function icone(nome) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONES[nome] || '') + '</svg>';
}

// ---------- toasts ----------
function toast(msg, o) {
  o = o || {};
  const t = document.createElement('div');
  t.className = 'toast' + (o.erro ? ' erro' : '');
  t.setAttribute('role', o.erro ? 'alert' : 'status');
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (o.acao ? '<button type="button">' + esc(o.acao.texto) + '</button>' : '');
  if (o.acao) t.querySelector('button').onclick = function () { t.remove(); o.acao.fn(); };
  document.getElementById('toasts').appendChild(t);
  setTimeout(function () { t.remove(); }, o.erro ? 6000 : o.acao ? 6000 : 3200);
}

// ---------- modal e gaveta (empilháveis) ----------
function modal(o) {
  const camada = document.getElementById('camada-modal');
  const fundo = document.createElement('div');
  fundo.className = 'fundo-modal' + (o.gaveta ? ' gaveta' : '');
  fundo.innerHTML = '<div class="modal' + (o.estreito ? ' estreito' : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(o.titulo || '') + '">' +
    (o.html != null ? o.html :
      '<div class="modal-cab"><h2>' + esc(o.titulo) + '</h2><button type="button" class="btn btn-fantasma btn-icone" data-fechar aria-label="Fechar">' + icone('fechar') + '</button></div>' +
      '<div class="modal-corpo">' + (o.corpo || '') + '</div>' +
      (o.pe ? '<div class="modal-pe">' + o.pe + '</div>' : '')) + '</div>';
  const anterior = document.activeElement;
  const api = {
    el: fundo.firstChild,
    fechar: function () {
      if (!fundo.isConnected) return;
      fundo.remove();
      document.removeEventListener('keydown', tecla);
      if (o.aoFechar) o.aoFechar();
      if (anterior && anterior.focus && anterior.isConnected) anterior.focus();
    },
  };
  function tecla(e) {
    if (e.key === 'Escape' && camada.lastElementChild === fundo) { e.stopPropagation(); api.fechar(); }
  }
  fundo.addEventListener('mousedown', function (e) { if (e.target === fundo) api.fechar(); });
  fundo.addEventListener('click', function (e) { if (e.target.closest('[data-fechar]')) api.fechar(); });
  document.addEventListener('keydown', tecla);
  camada.appendChild(fundo);
  const foco = fundo.querySelector('[autofocus]') || fundo.querySelector('input:not([type=hidden]), select, textarea');
  if (foco && !matchMedia('(max-width: 820px)').matches) setTimeout(function () { foco.focus(); }, 30);
  if (o.aoAbrir) o.aoAbrir(api.el, api);
  return api;
}

// Confirmação sem o confirm() do navegador.
function confirmar(titulo, texto, rotuloOk, perigo) {
  return new Promise(function (ok) {
    let resposta = false;
    const m = modal({
      titulo: titulo, estreito: true,
      corpo: '<p class="mudo" style="margin:0">' + esc(texto) + '</p>',
      pe: '<button type="button" class="btn btn-fantasma" data-fechar>Cancelar</button><button type="button" class="btn ' + (perigo ? 'btn-escuro' : 'btn-primario') + '" data-ok>' + esc(rotuloOk || 'Confirmar') + '</button>',
      aoFechar: function () { ok(resposta); },
    });
    m.el.querySelector('[data-ok]').onclick = function () { resposta = true; m.fechar(); };
  });
}

// Botão "ocupado" enquanto grava.
async function ocupado(btn, fn) {
  if (btn.disabled) return;
  const texto = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = 'Salvando…';
  try { return await fn(); } finally { if (btn.isConnected) { btn.disabled = false; btn.innerHTML = texto; } }
}

// ---------- marca da agência ----------
function aplicarMarca(m) {
  const r = document.documentElement.style;
  r.setProperty('--m-primaria', m.primaria);
  r.setProperty('--m-destaque', m.destaque);
  r.setProperty('--m-fundo', m.fundo);
  r.setProperty('--m-superficie', m.superficie);
  r.setProperty('--m-texto', m.texto);
  r.setProperty('--fonte-t', "'" + m.fonteTitulos + "'");
  r.setProperty('--fonte', "'" + m.fonteTexto + "'");
  r.setProperty('--raio', (Number(m.raio) || 0) + 'px');
  const familias = [m.fonteTitulos, m.fonteTexto].filter(function (f, i, a) { return f && a.indexOf(f) === i; });
  const href = 'https://fonts.googleapis.com/css2?' + familias.map(function (f) {
    return 'family=' + f.trim().replace(/\s+/g, '+') + ':wght@200;300;400;500;600';
  }).join('&') + '&display=swap';
  const link = document.getElementById('fontes');
  if (link && link.href !== href) link.href = href;
  // Itálico num link à parte: se a fonte não tiver itálico, só este falha e o resto carrega.
  const hrefIt = 'https://fonts.googleapis.com/css2?' + familias.map(function (f) {
    return 'family=' + f.trim().replace(/\s+/g, '+') + ':ital,wght@1,300;1,400';
  }).join('&') + '&display=swap';
  let it = document.getElementById('fontes-it');
  if (!it) { it = document.createElement('link'); it.id = 'fontes-it'; it.rel = 'stylesheet'; document.head.appendChild(it); }
  if (it.href !== hrefIt) it.href = hrefIt;
  const meta = document.querySelector('meta[name="theme-color"]') || document.head.appendChild(Object.assign(document.createElement('meta'), { name: 'theme-color' }));
  meta.content = m.primaria;
}

// ---------- tema (por pessoa) ----------
const TEMAS = [
  { id: 'claro', nome: 'Claro' },
  { id: 'escuro', nome: 'Escuro' },
  { id: 'floresta', nome: 'Floresta' },
];
const CHAVE_TEMA = 'flowloop.tema';

// O tema também fica no navegador, para a próxima abertura já começar certa (ver o script no <head> do index).
function aplicarTema(t) {
  if (!TEMAS.some(function (x) { return x.id === t; })) t = 'claro';
  document.documentElement.setAttribute('data-tema', t);
  try { localStorage.setItem(CHAVE_TEMA, t); } catch (e) { /* sem armazenamento: só não lembra */ }
  return t;
}
