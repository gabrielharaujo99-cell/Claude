<style>
/* =====================================================================================
   Seok Flow · linguagem do Be Flow (vem por último e manda no visual).
   - moldura clara: barra do topo e menu brancos, menu em grupos que recolhem, busca no menu
   - barra de abas do grupo no alto de cada tela (pílula ativa em degradê verde)
   - banner escuro com selo "● ÁREA · TELA", título forte e números em degradê sálvia → ouro
   - cartões brancos, títulos e números em peso forte, botões sem caixa alta
   As cores são da Seok (floresta, sálvia, cobre); a marca do Admin continua valendo por --m-*.
   ===================================================================================== */
:root {
  --fonte: 'Google Sans', 'Manrope', system-ui, sans-serif;
  --fonte-t: 'Google Sans', 'Manrope', system-ui, sans-serif;
  --fundo: var(--m-fundo, #F4F6F1);
  --superficie: #FFFFFF;
  --texto: #17201A;
  --suave: #5B665E;
  --apagado: #8A938C;
  --linha: rgba(23, 32, 26, .08);
  --linha-forte: rgba(23, 32, 26, .14);
  --destaque: #2F6B3A;
  --destaque-escuro: #24552D;
  --acento: #B5683A;
  --g-pilula: linear-gradient(135deg, #24552D 0%, #3F7D4E 55%, #6E9F5A 100%);
  --g-cta: linear-gradient(135deg, #9C4A1C 0%, #C2702F 55%, #D9A066 100%);
  --g-texto: linear-gradient(92deg, #DCEBCB 0%, #A6D388 38%, #F0B472 80%, #E39A5C 100%);
  --sombra: 0 1px 2px rgba(16, 24, 18, .04), 0 10px 30px -18px rgba(16, 24, 18, .22);
  --sombra-alta: 0 28px 70px -24px rgba(16, 24, 18, .4);
  --rotulo: 600 10.5px/1.4 var(--fonte);
  --k1: #2F6B3A; --k2: #C2702F; --k3: #4E8FA0; --k4: #8A5BB5;
  /* moldura clara */
  --c-barra: rgba(255, 255, 255, .94); --c-lado: #FFFFFF; --c-bd: rgba(23, 32, 26, .08);
  --c-tx: #39443C; --c-tx2: #7F8981; --c-forte: #17201A; --c-hv: rgba(47, 107, 58, .06);
  --c-onbg: rgba(47, 107, 58, .10); --c-ontx: #24552D; --c-acc: #2F6B3A; --c-logo: none;
}
:root[data-tema="escuro"], :root[data-tema="floresta"] {
  --superficie: #161D17; --texto: #E9EFE6; --suave: #A7B2AA; --apagado: #7E8A81;
  --linha: rgba(233, 239, 230, .08); --linha-forte: rgba(233, 239, 230, .15);
  --destaque: #8CC271; --destaque-escuro: #A6D388; --acento: #F0B472;
  --c-barra: rgba(18, 24, 19, .92); --c-lado: #121813; --c-bd: rgba(233, 239, 230, .08);
  --c-tx: #C9D3CB; --c-tx2: #87938A; --c-forte: #F2F6EF; --c-hv: rgba(233, 239, 230, .05);
  --c-onbg: rgba(140, 194, 113, .14); --c-ontx: #C9E9B2; --c-acc: #8CC271;
  --k1: #8CC271; --k2: #F0B472; --k3: #7CC4D4; --k4: #C7A6E8;
}
:root[data-tema="escuro"] { --fundo: #0E130F; }
:root[data-tema="floresta"] { --fundo: #112016; --superficie: #17291D; --c-lado: #10201A; }

body { font-family: var(--fonte); background: radial-gradient(1200px 520px at 100% -10%, rgba(110, 159, 90, .10), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(217, 160, 102, .08), transparent 60%), var(--fundo); background-attachment: fixed; }
h1, h2, h3 { font-family: var(--fonte-t); }
.rotulo { font: var(--rotulo); letter-spacing: .14em; }

/* ---------- barra do topo ---------- */
.barra-app { box-shadow: 0 1px 0 var(--c-bd); }
.barra-nome b { font-weight: 700; font-size: 17px; letter-spacing: -.02em; }
.barra-nome small { color: var(--c-tx2); font-weight: 600; letter-spacing: .16em; font-size: 9.5px; }
.barra-sep { width: 2px; background: var(--g-pilula); opacity: 1; }
.barra-marca .monograma { background: var(--g-pilula); color: #fff; border: 0; font-weight: 700; }
.linha-marca { height: 2px; background: linear-gradient(90deg, #2F6B3A, #6E9F5A 30%, #C5DBAE 50%, #D9A066 72%, #B5683A); background-size: 200% 100%; opacity: .9; }
.barra-busca { border-radius: 12px !important; background: var(--c-hv) !important; border: 1px solid var(--c-bd) !important; color: var(--c-tx2) !important; }
.barra-busca kbd { background: var(--c-lado) !important; border: 1px solid var(--c-bd) !important; color: var(--c-tx2) !important; border-radius: 6px; font: 600 10px/1 var(--fonte); padding: 4px 6px; }
@media (min-width: 821px) { .barra-app .barra-busca, .barra-app #recolher { display: none !important; } }
.barra-cta { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border: 0; border-radius: 12px; cursor: pointer;
  background: var(--g-cta); color: #fff; font: 600 14px/1 var(--fonte); box-shadow: 0 10px 22px -12px rgba(156, 74, 28, .8); transition: transform .15s, filter .15s; }
.barra-cta:hover { transform: translateY(-1px); filter: brightness(1.05); }
.barra-cta svg { width: 17px; height: 17px; stroke-width: 2.2; }
.barra-eu-txt b { font-weight: 700; }

/* ---------- menu lateral: grupos que recolhem ---------- */
.lateral { padding: 12px 12px 12px; gap: 6px; }
.lat-topo { display: grid; gap: 8px; margin-bottom: 8px; }
.lat-recolher { display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 12px; border: 0; border-radius: 10px; background: none; color: var(--c-tx2); cursor: pointer; font: 500 13.5px var(--fonte); white-space: nowrap; }
.lat-recolher:hover { background: var(--c-hv); color: var(--c-forte); }
.lat-recolher svg { width: 18px; height: 18px; flex: none; transition: transform .2s; }
.recolhido .lat-recolher svg { transform: scaleX(-1); }
.lat-busca { display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 10px 0 12px; border: 1px solid var(--c-bd); border-radius: 12px; background: var(--c-lado); color: var(--c-tx); cursor: pointer; font: 500 14px var(--fonte); white-space: nowrap; transition: border-color .15s, box-shadow .15s; }
.lat-busca:hover { border-color: color-mix(in srgb, var(--c-acc) 40%, var(--c-bd)); box-shadow: 0 6px 16px -10px rgba(16, 24, 18, .25); }
.lat-busca svg { width: 18px; height: 18px; flex: none; }
.lat-busca kbd { margin-left: auto; font: 600 10px/1 var(--fonte); padding: 4px 6px; border-radius: 6px; border: 1px solid var(--c-bd); color: var(--c-tx2); background: var(--c-hv); }
.recolhido .lat-busca { justify-content: center; padding: 0; width: 44px; margin: 0 auto; }
.recolhido .lat-busca span, .recolhido .lat-busca kbd, .recolhido .lat-recolher span { display: none; }
.recolhido .lat-recolher { justify-content: center; padding: 0; width: 44px; margin: 0 auto; }

.menu::before { display: none !important; }
.menu { gap: 2px; }
.menu button { height: 40px; border-radius: 12px; font: 500 14px var(--fonte); letter-spacing: 0; color: var(--c-tx); }
.menu button svg { width: 19px; height: 19px; stroke-width: 1.7; opacity: .9; }
.menu button[aria-current="page"] { background: var(--c-onbg); color: var(--c-ontx); font-weight: 600; box-shadow: none; }
.menu button[aria-current="page"]::before { left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--g-pilula); box-shadow: none; }
.menu .menu-grupo { display: none; }
.menu-sec { display: grid; gap: 2px; }
.menu .menu-grupo-bt { font-weight: 600; color: var(--c-forte); }
.menu .menu-grupo-bt.ativo { color: var(--c-ontx); }
.menu .menu-grupo-bt .chev { margin-left: auto; width: 16px; height: 16px; opacity: .6; transition: transform .2s; }
.menu-sec.fechado .chev { transform: rotate(-90deg); }
.menu-filhos { display: grid; gap: 2px; padding-left: 14px; margin-left: 9px; border-left: 1px solid var(--c-bd); overflow: hidden; }
.menu-filhos button { height: 38px; font-size: 13.8px; }
.menu-filhos button[aria-current="page"]::before { left: -15px; }
.menu-sec.fechado .menu-filhos { display: none; }
.menu-pe { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--c-bd); }
.menu-pe .menu-pe-cab { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px 8px; font: 600 10.5px/1 var(--fonte); letter-spacing: .18em; text-transform: uppercase; color: var(--c-tx2); }
.lateral-pe { border-top: 0; padding-top: 8px; }
.recolhido .menu-filhos { padding-left: 0; margin-left: 0; border-left: 0; }
.recolhido .menu-sec.fechado .menu-filhos { display: grid; }
.recolhido .menu-grupo-bt, .recolhido .menu-pe-cab { display: none !important; }

/* ---------- barra de abas do grupo (topo de cada tela) ---------- */
.abas-grupo { display: flex; align-items: center; gap: 4px; width: fit-content; max-width: calc(100% - 64px); overflow-x: auto; margin: 22px 32px 0; padding: 5px;
  background: var(--superficie); border: 1px solid var(--linha); border-radius: 16px; box-shadow: var(--sombra); scrollbar-width: none; }
.abas-grupo:empty { display: none; }
.abas-grupo button { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border: 0; border-radius: 12px; background: none; cursor: pointer;
  font: 500 14px var(--fonte); color: var(--suave); white-space: nowrap; transition: background .15s, color .15s; }
.abas-grupo button:hover { background: var(--afundado); color: var(--texto); }
.abas-grupo button svg { width: 17px; height: 17px; }
.abas-grupo button[aria-current="page"] { background: var(--g-pilula); color: #fff; font-weight: 600; box-shadow: 0 8px 18px -10px rgba(36, 85, 45, .9); }
.abas-grupo + .topo.hero { margin-top: 16px; }

/* ---------- banner ---------- */
:root {
  --h-bg:
    radial-gradient(55% 120% at 92% -10%, rgba(217, 160, 102, .30), transparent 58%),
    radial-gradient(50% 110% at -8% 112%, rgba(110, 159, 90, .45), transparent 60%),
    linear-gradient(118deg, #0B1A10 0%, #15301D 42%, #234026 72%, #3A3420 100%);
  --h-grad: var(--g-texto);
}
.topo.hero { border-radius: 26px; padding: 40px 44px; border: 0; box-shadow: 0 30px 60px -34px rgba(11, 26, 16, .75); }
.topo.hero .hero-aurora { display: block; position: absolute; inset: 0; z-index: 0; pointer-events: none; animation: none;
  background-image: linear-gradient(rgba(247, 243, 236, .045) 1px, transparent 1px), linear-gradient(90deg, rgba(247, 243, 236, .045) 1px, transparent 1px);
  background-size: 36px 36px; -webkit-mask: linear-gradient(100deg, #000 0%, rgba(0, 0, 0, .55) 55%, transparent 100%); mask: linear-gradient(100deg, #000 0%, rgba(0, 0, 0, .55) 55%, transparent 100%); }
.topo.hero::after { left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #6E9F5A, #C5DBAE 35%, #F0B472 65%, #B5683A); background-size: 200% 100%; }
.topo.hero .rotulo { gap: 10px; padding: 7px 14px; border-radius: 100px; border: 1px solid rgba(247, 243, 236, .16); background: rgba(247, 243, 236, .06);
  font: 600 10.5px/1 var(--fonte); letter-spacing: .2em; color: rgba(247, 243, 236, .86); }
.topo.hero .rotulo::before { width: 7px; height: 7px; border-radius: 50%; background: #7BD389; box-shadow: 0 0 0 3px rgba(123, 211, 137, .2), 0 0 12px rgba(123, 211, 137, .9); }
.topo.hero h1 { font-weight: 700; font-size: clamp(32px, 3.1vw, 48px); letter-spacing: -.03em; line-height: 1.08; max-width: 20ch; }
.topo.hero h1 b { font-weight: 700; }
.topo.hero h1 em { font-weight: 700; }
.topo.hero .topo-texto { font-weight: 400; font-size: 15px; color: rgba(247, 243, 236, .8); }
.topo.hero .topo-texto b { font-weight: 700; }
.hero-stats > div { border-radius: 16px; background: rgba(247, 243, 236, .06); border: 1px solid rgba(247, 243, 236, .14); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.hero-stats b { font-weight: 700; font-size: 22px; white-space: nowrap; letter-spacing: -.02em; background: var(--g-texto); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.hero-stats span { color: rgba(247, 243, 236, .66); }
.topo.hero .btn { border-color: rgba(247, 243, 236, .22); color: #F7F3EC; background: rgba(247, 243, 236, .05); }
.topo.hero .btn:hover { background: rgba(247, 243, 236, .12); }
.topo.hero .btn-primario, .topo.hero .btn.claro { background: var(--g-pilula); border-color: transparent; color: #fff; }

/* título simples (telas sem banner) */
.topo:not(.hero) h1 { font-weight: 700; font-size: 30px; letter-spacing: -.025em; }
h1 em, h2 em { color: var(--destaque); }

/* ---------- botões, campos, segmentado ---------- */
.btn { height: 40px; padding: 0 18px; border-radius: 12px; font: 600 13.5px/1 var(--fonte); letter-spacing: 0; text-transform: none; }
.btn-peq { height: 34px; padding: 0 13px; font-size: 13px; border-radius: 10px; }
.btn-primario { background: var(--g-pilula); border-color: transparent; color: #fff; box-shadow: 0 10px 22px -14px rgba(36, 85, 45, .95); }
.btn-primario:hover { background: var(--g-pilula); filter: brightness(1.06); }
.entrada, .campo input, .campo select, .campo textarea { border-radius: 12px; font-family: var(--fonte); }
.campo > span { font: 600 11px/1.3 var(--fonte); letter-spacing: .1em; }
.segmentado { padding: 4px; border-radius: 14px; background: var(--superficie); border: 1px solid var(--linha); box-shadow: 0 1px 2px rgba(16, 24, 18, .04); }
.segmentado button { padding: 8px 14px; border-radius: 10px; font: 500 13px/1.2 var(--fonte); letter-spacing: 0; text-transform: none; }
.segmentado button[aria-pressed="true"] { background: var(--g-pilula); color: #fff; font-weight: 600; box-shadow: 0 6px 14px -8px rgba(36, 85, 45, .9); }
:root[data-tema="escuro"] .segmentado button[aria-pressed="true"], :root[data-tema="floresta"] .segmentado button[aria-pressed="true"] { background: var(--g-pilula); color: #fff; }
.abas button { font: 500 13.5px/1 var(--fonte); letter-spacing: 0; text-transform: none; }
.abas button[aria-selected="true"], .abas button.ativo { font-weight: 600; }

/* ---------- cartões e KPIs ---------- */
.cartao { border-radius: 18px; }
.cartao-cab h2 { font-weight: 700; font-size: 17px; letter-spacing: -.015em; }
.cartao-cab h2::before { display: none; }
.kpi { padding: 22px 22px 20px; border-radius: 18px; }
.kpi::before { top: 0; bottom: 0; height: auto; width: 4px; border-radius: 18px 0 0 18px; box-shadow: none; }
.kpi .rotulo { font: 600 10.5px/1.3 var(--fonte); letter-spacing: .14em; color: var(--suave); }
.kpi .valor { font-weight: 700; font-size: clamp(28px, 2.3vw, 36px); letter-spacing: -.03em; margin: 12px 0 6px; }
.kpi .det { font-size: 12.5px; }
.kpi .k-ic { border-radius: 12px; width: 38px; height: 38px; }
.kpi .k-ic svg { width: 18px; height: 18px; stroke-width: 1.8; }
.vazio b { font-weight: 600; }
.tabela th { font: 600 10.5px/1.3 var(--fonte); letter-spacing: .12em; }
.pilula { font-weight: 600; }

/* ---------- funil (kanban) ---------- */
.coluna { background: var(--superficie); border: 1px solid var(--linha); border-radius: 20px; box-shadow: var(--sombra); overflow: hidden; }
.coluna-cab { padding: 0 16px 14px; }
.coluna-cab .faixa { height: 3px; margin: 0 -16px 12px; border-radius: 0; opacity: 1; }
.coluna-cab .t b { font: 700 14px/1.3 var(--fonte); letter-spacing: 0; text-transform: none; }
.coluna-cab .t .n { font-weight: 700; background: var(--afundado); }
.coluna-cab .soma { font-weight: 700; color: var(--texto); font-size: 14px; }
.coluna-cards { background: color-mix(in srgb, var(--fundo) 60%, var(--superficie)); }
.op { border-radius: 16px; border-left: 0; box-shadow: 0 1px 2px rgba(16, 24, 18, .05), 0 6px 16px -12px rgba(16, 24, 18, .25); }
.op::before { width: 4px; }
.op .cli { font: 700 11px/1.3 var(--fonte); letter-spacing: .08em; color: var(--destaque); }
.funil-resumo b { font-weight: 700; font-size: 26px; letter-spacing: -.02em; }

/* ---------- prioridade sobre a tipografia antiga (design.html usa !important) ---------- */
body { background: radial-gradient(1200px 520px at 100% -10%, rgba(110, 159, 90, .10), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(217, 160, 102, .08), transparent 60%), var(--fundo) !important; background-attachment: fixed !important; }
h1, h2, h3, .topo h1, .cartao-cab h2, .modal-cab h2, .det-topo h2, .sm-cal-cab h2, .cv-hero h2, .pf-ola, .vazio b, .tela-cheia h1 { letter-spacing: -.02em !important; }
h1 em, h2 em { font-style: normal !important; font-weight: inherit !important; }
.topo h1 { font-weight: 700 !important; }
.topo.hero h1 { font-weight: 700 !important; font-size: clamp(32px, 3.1vw, 48px); letter-spacing: -.03em !important; }
.topo.hero h1 b, .topo.hero h1 em { font-weight: 700 !important; }
.cartao-cab h2 { font-weight: 700 !important; font-size: 17px !important; }
.modal-cab h2, .det-topo h2 { font-weight: 700 !important; }
.barra-nome b { font-family: var(--fonte); font-weight: 700; }
.kpis .kpi .valor, .hero-stats b, .hp-anel .num b, .funil-resumo b, .op .val { font-weight: 700 !important; }
.vazio b { font-weight: 600 !important; }

@media (max-width: 820px) {
  .abas-grupo { margin: 14px 16px 0; max-width: calc(100% - 32px); }
  .barra-cta span { display: none; }
  .barra-cta { width: 40px; padding: 0; justify-content: center; }
  .lat-topo, .menu-pe .menu-pe-cab { display: none; }
  .menu-filhos { padding: 0; margin: 0; border: 0; display: contents !important; }
  .menu-sec { display: contents; }
  .menu .menu-grupo-bt { display: none; }
  .lateral { gap: 0; }
  .lateral > .menu:not(.menu-pe) { flex: 1; min-width: 0; width: auto; }
  .menu-pe { display: grid; grid-auto-flow: column; grid-auto-columns: 66px; flex: none; width: auto; margin: 0 0 0 4px; padding: 0 0 0 4px; border-top: 0; border-left: 1px solid var(--c-bd); }
  .menu button, .menu-filhos button { height: auto; font-size: 10px; }
}
</style>
