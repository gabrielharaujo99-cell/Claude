<script>
/** Telas de Clientes, Tarefas, Propostas e Horas, com os formulários de cada uma. */
const NOME_STATUS_T = { afazer: 'A fazer', fazendo: 'Fazendo', feito: 'Feito' };
const NOME_STATUS_P = { rascunho: 'Rascunho', enviada: 'Enviada', aprovada: 'Aprovada', recusada: 'Recusada' };

// ================= Clientes =================
S.filtrosCli = { busca: '', segmento: '', arquivados: false };

TELAS.clientes = {
  desenhar: function () {
    const f = S.filtrosCli, cfg = S.dados.config;
    const ativos = S.dados.clientes.filter(function (c) { return !c.arquivado; });
    const porSeg = cfg.segmentos.map(function (s) { return { s: s, n: ativos.filter(function (c) { return c.segmento === s; }).length }; }).filter(function (x) { return x.n; });
    return {
      titulo: 'Carteira de <em>clientes</em>',
      banner: {
        chip: 'Carteira de clientes',
        manchete: '<em>' + ativos.length + '</em> ' + (ativos.length === 1 ? 'cliente ativo' : 'clientes ativos') + ' na carteira',
        texto: porSeg.length ? 'Distribuídos pelos segmentos do wellness: ' + porSeg.map(function (x) { return esc(x.s) + ' <b>' + x.n + '</b>'; }).join(' · ') + '.' : 'Cadastre os clientes e escolha o segmento de cada um.',
        painel: porSeg.length ? { tipo: 'lista', titulo: 'Por segmento', total: String(ativos.length), itens: (function () {
          const max = Math.max.apply(null, porSeg.map(function (x) { return x.n; }).concat([1]));
          return porSeg.map(function (x) { return { l: x.s, v: String(x.n), p: x.n / max }; });
        })() } : null,
      },
      acoes: '<label class="busca">' + icone('busca') + '<input class="entrada" type="search" id="c-busca" placeholder="Buscar cliente" value="' + esc(f.busca) + '" aria-label="Buscar"></label>' +
        '<select class="entrada filtro" id="c-seg" aria-label="Segmento">' + opcoes(cfg.segmentos, f.segmento, 'Todos os segmentos') + '</select>' +
        (pode('colaborador') ? '<button class="btn btn-primario" data-novo>' + icone('mais') + '<span>Novo cliente</span></button>' : ''),
      corpo: '<div class="conteudo"><div class="cartao"><div id="lista-cli"></div></div>' +
        '<label class="chk pequeno mudo" style="margin-top:14px"><input type="checkbox" id="c-arq"' + (f.arquivados ? ' checked' : '') + '>Mostrar arquivados</label></div>',
      montar: function (el, topo) {
        topo.querySelector('#c-busca').addEventListener('input', function (e) { f.busca = e.target.value; listaClientes(); });
        topo.querySelector('#c-seg').addEventListener('change', function (e) { f.segmento = e.target.value; listaClientes(); });
        el.querySelector('#c-arq').addEventListener('change', function (e) { f.arquivados = e.target.checked; listaClientes(); });
        const n = topo.querySelector('[data-novo]');
        if (n) n.onclick = function () { abrirFormCliente(); };
        el.querySelector('#lista-cli').addEventListener('click', function (e) {
          const tr = e.target.closest('[data-cli]');
          if (tr && !e.target.closest('a')) abrirFormCliente(cliente(tr.dataset.cli));
        });
        listaClientes();
      },
    };
  },
};

function listaClientes() {
  const f = S.filtrosCli, q = normal(f.busca);
  const lista = S.dados.clientes.filter(function (c) {
    if (c.arquivado && !f.arquivados) return false;
    if (f.segmento && c.segmento !== f.segmento) return false;
    return !q || normal(c.nome + ' ' + c.contato + ' ' + c.email + ' ' + c.instagram).indexOf(q) >= 0;
  }).sort(function (a, b) { return a.nome.localeCompare(b.nome, 'pt-BR'); });
  const box = document.getElementById('lista-cli');
  if (!lista.length) {
    box.innerHTML = '<div class="vazio"><b>Nenhum cliente encontrado.</b>' + (S.dados.clientes.length ? 'Ajuste a busca.' : 'Os clientes também nascem ao criar uma oportunidade.') + '</div>';
    return;
  }
  box.innerHTML = '<div class="tabela-wrap"><table class="tabela"><thead><tr><th>Cliente</th><th class="some-cel">Segmento</th><th class="some-cel">Instagram</th><th class="d">Em aberto</th><th class="d">Ganho</th></tr></thead><tbody>' +
    lista.map(function (c) {
      const ops = S.dados.oportunidades.filter(function (o) { return o.clienteId === c.id && !o.arquivado; });
      const tipo = function (o) { const e = etapa(o.etapa); return e ? e.tipo : ''; };
      const aberto = ops.filter(function (o) { return tipo(o) === 'aberta'; });
      const ganho = ops.filter(function (o) { return tipo(o) === 'ganho'; }).reduce(function (s, o) { return s + totalOp(o); }, 0);
      return '<tr data-cli="' + esc(c.id) + '"><td><div class="cl-linha">' + logoCliente(c.id) + '<div><b>' + esc(c.nome) + '</b>' + (c.arquivado ? ' <span class="pilula">arquivado</span>' : '') +
        (c.contato ? '<br><span class="mudo pequeno">' + esc(c.contato) + '</span>' : '') + '</div></div></td>' +
        '<td class="some-cel">' + (c.segmento ? '<span class="pilula">' + esc(c.segmento) + '</span>' : '<span class="mudo">—</span>') + '</td>' +
        '<td class="some-cel">' + (c.instagram ? '<a href="https://instagram.com/' + esc(c.instagram.replace(/^@/, '')) + '" target="_blank" rel="noopener">' + esc(c.instagram) + '</a>' : '<span class="mudo">—</span>') + '</td>' +
        '<td class="d num">' + (aberto.length ? dinheiro(aberto.reduce(function (s, o) { return s + totalOp(o); }, 0)) + '<br><span class="mudo pequeno">' + aberto.length + ' op.</span>' : '<span class="mudo">—</span>') + '</td>' +
        '<td class="d num">' + (ganho ? dinheiro(ganho) : '<span class="mudo">—</span>') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}

function abrirFormCliente(base, semAntigos) {
  // O cliente mostra todas as oportunidades dele: busca antes as que ficaram fora da abertura.
  if (base && base.id && !semAntigos && temAntigos('oportunidades')) {
    carregarAntigos().catch(function () { /* abre com o que já tem */ }).then(function () { abrirFormCliente(base, true); });
    return;
  }
  base = base || {};
  const novo = !base.id, cfg = S.dados.config, c = base;
  const ops = novo ? [] : S.dados.oportunidades.filter(function (o) { return o.clienteId === c.id; });
  const ler = !pode('colaborador');
  const m = modal({
    titulo: novo ? 'Novo cliente' : c.nome,
    corpo: '<form id="form-cli" class="grade" autocomplete="off"><fieldset style="display:contents"' + (ler ? ' disabled' : '') + '>' +
      '<label class="campo inteira"><span>Nome</span><input name="nome" required maxlength="100" value="' + esc(c.nome) + '"></label>' +
      '<label class="campo"><span>Segmento</span><select name="segmento">' + opcoes(cfg.segmentos.indexOf(c.segmento) < 0 && c.segmento ? cfg.segmentos.concat([c.segmento]) : cfg.segmentos, c.segmento, 'Escolha') + '</select></label>' +
      '<label class="campo"><span>Contato</span><input name="contato" value="' + esc(c.contato) + '" placeholder="Pessoa de contato"></label>' +
      '<label class="campo"><span>E-mail</span><input name="email" type="email" value="' + esc(c.email) + '"></label>' +
      '<label class="campo"><span>Telefone</span><input name="telefone" type="tel" value="' + esc(c.telefone) + '"></label>' +
      '<label class="campo"><span>Instagram</span><input name="instagram" value="' + esc(c.instagram) + '" placeholder="@perfil"></label>' +
      '<label class="campo"><span>Site</span><input name="site" value="' + esc(c.site) + '" placeholder="site.com.br"></label>' +
      '<label class="campo"><span>Logo (link da imagem)</span><input name="logo" value="' + esc(c.logo) + '" placeholder="https://…/logo.png"></label>' +
      '<label class="campo inteira"><span>Observações</span><textarea name="obs">' + esc(c.obs) + '</textarea></label></fieldset></form>' +
      (ops.length ? '<div style="margin-top:22px"><span class="rotulo">Oportunidades</span><ul class="lista" style="margin-top:6px">' + ops.map(function (o) {
        const e = etapa(o.etapa);
        return '<li data-op="' + esc(o.id) + '" style="cursor:pointer"><div class="principal-li"><b>' + esc(o.titulo) + '</b><span class="num">' + dinheiro(totalOp(o)) + '</span></div>' +
          '<span class="pilula" style="color:' + esc(e ? e.cor : '') + '"><span class="ponto"></span><span style="color:var(--texto)">' + esc(e ? e.nome : '') + '</span></span></li>';
      }).join('') + '</ul></div>' : ''),
    pe: (!novo && pode('gestor') ? '<div class="esq"><button class="btn btn-fantasma btn-peq" data-arq>' + (c.arquivado ? 'Desarquivar' : 'Arquivar') + '</button></div>' : '') +
      '<button class="btn btn-fantasma" data-fechar>' + (ler ? 'Fechar' : 'Cancelar') + '</button>' + (ler ? '' : '<button class="btn btn-primario" data-salvar>' + (novo ? 'Criar' : 'Salvar') + '</button>'),
  });
  const form = m.el.querySelector('#form-cli');
  m.el.querySelectorAll('[data-op]').forEach(function (li) { li.onclick = function () { m.fechar(); abrirOportunidade(li.dataset.op); }; });
  const arq = m.el.querySelector('[data-arq]');
  if (arq) arq.onclick = async function () {
    const r = await gravar('arquivarCliente', [c.id, !c.arquivado], c.arquivado ? 'Cliente desarquivado.' : 'Cliente arquivado.');
    if (r) { trocar('clientes', r); m.fechar(); desenhar(); }
  };
  const salvar = m.el.querySelector('[data-salvar]');
  if (!salvar) return;
  form.addEventListener('submit', function (e) { e.preventDefault(); salvar.click(); });
  salvar.onclick = function () {
    const d = lerForm(form);
    if (!d.nome.trim()) return form.nome.focus();
    if (c.id) d.id = c.id;
    ocupado(salvar, async function () {
      const r = await gravar('salvarCliente', [d], novo ? 'Cliente criado.' : 'Salvo.');
      if (r) { trocar('clientes', r); m.fechar(); desenhar(); atualizarGaveta(); }
    });
  };
}

// ================= Tarefas =================
S.filtrosTar = { quem: 'minhas' };

// compacto: para colunas estreitas (quadro por pessoa): prazo embaixo do título e sem avatar.
function linhaTarefa(t, compacto) {
  const feito = t.status === 'feito', atrasada = !feito && t.prazo && t.prazo < S.dados.hoje, hoje = !feito && t.prazo === S.dados.hoje;
  const o = t.oportunidadeId ? oportunidade(t.oportunidadeId) : null;
  const onde = o ? o.titulo + (nomeCliente(o.clienteId) ? ' · ' + nomeCliente(o.clienteId) : '') : nomeCliente(t.clienteId);
  const prazo = t.prazo ? '<span class="pilula' + (atrasada ? ' alerta' : hoje ? ' destaque' : '') + '"' + (compacto ? ' style="margin-top:6px"' : '') + '>' + (atrasada ? 'Atrasada · ' : hoje ? 'Hoje · ' : '') + dataCurta(t.prazo) + '</span>' : '';
  return '<div class="tarefa' + (feito ? ' feita' : '') + '" style="flex:1;min-width:0">' +
    '<button type="button" class="marcar' + (feito ? ' feito' : '') + '" data-marcar="' + esc(t.id) + '" aria-label="' + (feito ? 'Reabrir' : 'Concluir') + ' tarefa"' + (pode('colaborador') ? '' : ' disabled') + '>' + icone('check') + '</button>' +
    '<div class="tt" data-tarefa="' + esc(t.id) + '" style="cursor:pointer"><b>' + esc(t.titulo) + '</b><span>' + esc(onde || 'Tarefa solta') + '</span>' + (compacto ? prazo : '') + '</div>' +
    (compacto ? '' : prazo + (t.responsavel ? avatar(t.responsavel) : '')) + '</div>';
}

// Clique em tarefa (concluir ou abrir), usado em várias telas. Devolve true se tratou.
// Cartão "Minhas tarefas" do Início: abas (Hoje, Atrasadas, Abertas, Concluídas) e ações rápidas na linha.
S.abaTarefas = '';
function cartaoMinhasTarefas(limite) {
  const d = S.dados, hoje = d.hoje, eu = d.eu.email;
  const minhas = d.tarefas.filter(function (t) { return t.responsavel === eu; });
  const porPrazo = function (a, b) { return (a.prazo || '9999') < (b.prazo || '9999') ? -1 : 1; };
  const abas = {
    hoje: minhas.filter(function (t) { return t.status !== 'feito' && t.prazo === hoje; }).sort(porPrazo),
    atrasadas: minhas.filter(function (t) { return t.status !== 'feito' && t.prazo && t.prazo < hoje; }).sort(porPrazo),
    abertas: minhas.filter(function (t) { return t.status !== 'feito'; }).sort(porPrazo),
    feitas: minhas.filter(function (t) { return t.status === 'feito'; }).sort(function (a, b) { return a.concluidoEm < b.concluidoEm ? 1 : -1; }),
  };
  const aba = abas[S.abaTarefas] ? S.abaTarefas : abas.atrasadas.length ? 'atrasadas' : abas.hoje.length ? 'hoje' : 'abertas';
  const nomes = { hoje: 'Hoje', atrasadas: 'Atrasadas', abertas: 'Abertas', feitas: 'Concluídas' };
  const vazio = { hoje: 'Nada para hoje.', atrasadas: 'Nenhuma atrasada.', abertas: 'Nada pendente.', feitas: 'Nada concluído ainda.' };
  const lista = abas[aba].slice(0, limite || 7);
  return '<div class="cartao"><div class="cartao-cab"><h2>Minhas tarefas</h2><button class="btn btn-fantasma btn-peq" data-ir-tela="tarefas">Ver todas' + icone('seta') + '</button>' +
    '<div class="segmentado t-abas" role="tablist">' + Object.keys(nomes).map(function (k) {
      return '<button type="button" role="tab" data-aba-t="' + k + '" aria-pressed="' + (k === aba) + '">' + nomes[k] + ' <span class="n">' + abas[k].length + '</span></button>';
    }).join('') + '</div></div>' +
    '<div class="cartao-corpo">' + (lista.length ? '<ul class="lista">' + lista.map(function (t) {
      const atrasada = t.status !== 'feito' && t.prazo && t.prazo <= hoje;
      return '<li class="t-linha">' + linhaTarefa(t) + '<span class="t-acoes">' +
        (t.status !== 'feito' ? '<button type="button" class="btn btn-icone btn-peq" data-marcar="' + esc(t.id) + '" title="Concluir" aria-label="Concluir tarefa">' + icone('check') + '</button>' : '') +
        (atrasada ? '<button type="button" class="btn btn-peq t-adiar" data-adiar="' + esc(t.id) + '" title="Passar o prazo para amanhã">' + icone('calendario') + 'Amanhã</button>' : '') +
        '</span></li>';
    }).join('') + '</ul>' : '<div class="vazio"><b>' + vazio[aba] + '</b>Suas tarefas aparecem aqui.</div>') + '</div></div>';
}

async function adiarTarefa(t) {
  const antes = Object.assign({}, t);
  const am = new Date(Date.parse(S.dados.hoje + 'T12:00:00') + 864e5).toISOString().slice(0, 10);
  t.prazo = am;
  desenhar();
  try {
    trocar('tarefas', await chamar('salvarTarefa', Object.assign({}, t)));
    toast('Prazo passado para amanhã.', { acao: { texto: 'Desfazer', fn: function () { t.prazo = antes.prazo; chamar('salvarTarefa', Object.assign({}, t)).then(function (r) { trocar('tarefas', r); desenhar(); }); desenhar(); } } });
  } catch (err) {
    trocar('tarefas', antes);
    toast(err.message, { erro: true });
  }
  desenhar(); atualizarGaveta();
}

function tratarCliqueTarefa(e) {
  const ab = e.target.closest('[data-aba-t]');
  if (ab) { S.abaTarefas = ab.dataset.abaT; desenhar(); return true; }
  const ad = e.target.closest('[data-adiar]');
  if (ad) { const t = S.dados.tarefas.find(function (x) { return x.id === ad.dataset.adiar; }); if (t) adiarTarefa(t); return true; }
  const mk = e.target.closest('[data-marcar]');
  if (mk) { const t = S.dados.tarefas.find(function (x) { return x.id === mk.dataset.marcar; }); if (t) moverTarefaPara(t, t.status === 'feito' ? 'afazer' : 'feito'); return true; }
  const tt = e.target.closest('[data-tarefa]');
  if (tt) { abrirFormTarefa(S.dados.tarefas.find(function (x) { return x.id === tt.dataset.tarefa; })); return true; }
  return false;
}

async function moverTarefaPara(t, status, ordem) {
  const antes = Object.assign({}, t);
  t.status = status;
  if (ordem != null) t.ordem = ordem;
  desenhar(); atualizarGaveta();
  try {
    trocar('tarefas', await chamar('moverTarefa', t.id, status, ordem == null ? '' : ordem));
    if (status === 'feito' && antes.status !== 'feito') toast('Tarefa concluída.', { acao: { texto: 'Desfazer', fn: function () { moverTarefaPara(t, antes.status); } } });
  } catch (err) {
    trocar('tarefas', antes);
    toast(err.message, { erro: true });
  }
  desenhar(); atualizarGaveta();
}

TELAS.tarefas = {
  desenhar: function () {
    const f = S.filtrosTar, eu = S.dados.eu.email;
    const lista = S.dados.tarefas.filter(function (t) { return f.quem !== 'minhas' || t.responsavel === eu; });
    const colunas = ['afazer', 'fazendo', 'feito'].map(function (s) {
      let ts = lista.filter(function (t) { return t.status === s; });
      ts = s === 'feito'
        ? ts.sort(function (a, b) { return a.concluidoEm < b.concluidoEm ? 1 : -1; }).slice(0, 25)
        : ts.sort(function (a, b) { return (a.prazo || '9999') < (b.prazo || '9999') ? -1 : (a.prazo || '9999') > (b.prazo || '9999') ? 1 : a.ordem - b.ordem; });
      return '<section class="coluna" data-status="' + s + '"><header class="coluna-cab"><div class="t"><b>' + NOME_STATUS_T[s] + '</b><span class="n">' + ts.length + '</span>' +
        (s !== 'feito' && pode('colaborador') ? '<button class="btn btn-fantasma btn-icone btn-peq" data-nova-t="' + s + '" aria-label="Nova tarefa">' + icone('mais') + '</button>' : '') + '</div></header>' +
        '<div class="coluna-cards">' + (ts.length ? ts.map(function (t) {
          return '<div class="op" draggable="' + pode('colaborador') + '" data-t="' + esc(t.id) + '" style="cursor:' + (pode('colaborador') ? 'grab' : 'default') + '">' + linhaTarefa(t) +
            (t.descricao ? '<span class="mudo pequeno" style="padding-left:28px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">' + esc(t.descricao) + '</span>' : '') + '</div>';
        }).join('') : '<div class="vazio" style="padding:18px 8px">Nada aqui.</div>') + '</div></section>';
    }).join('');
    const porPessoa = f.quem === 'pessoa';
    const titulos = { minhas: 'Minhas <em>tarefas</em>', todas: 'Tarefas da <em>equipe</em>', pessoa: 'Quadro por <em>pessoa</em>' };
    const hojeT = S.dados.hoje, abertasT = lista.filter(function (t) { return t.status !== 'feito'; });
    const atrasadasT = abertasT.filter(function (t) { return t.prazo && t.prazo < hojeT; }).length, hojeN = abertasT.filter(function (t) { return t.prazo === hojeT; }).length;
    return {
      titulo: titulos[f.quem] || titulos.minhas,
      banner: {
        compacto: true,
        chip: { minhas: 'Minhas tarefas', todas: 'Tarefas da equipe', pessoa: 'Quadro por pessoa' }[f.quem] || 'Tarefas',
        manchete: '<em>' + abertasT.length + '</em> ' + (abertasT.length === 1 ? 'tarefa' : 'tarefas') + ' em aberto',
        texto: (hojeN ? '<b>' + hojeN + '</b> para hoje' : 'Nada para hoje') + (atrasadasT ? ' e <span class="al">' + atrasadasT + ' atrasada(s)</span>.' : '. Nenhuma atrasada.'),
        painel: { tipo: 'anel', titulo: 'Em dia', valor: String(Math.round(100 * prop(abertasT.length - atrasadasT, abertasT.length))), unidade: '%', rot: 'no prazo',
          prog: prop(abertasT.length - atrasadasT, abertasT.length), barras: ['afazer', 'fazendo', 'feito'].map(function (s, i) {
            const n = lista.filter(function (t) { return t.status === s; }).length;
            return { l: NOME_STATUS_T[s], v: String(n), p: prop(n, lista.length), c: COR_HP[i] };
          }) },
      },
      acoes: '<div class="segmentado" role="group" id="t-quem">' + [['minhas', 'Minhas'], ['todas', 'Toda a equipe'], ['pessoa', 'Por pessoa']].map(function (x) {
        return '<button data-v="' + x[0] + '" aria-pressed="' + (f.quem === x[0]) + '">' + x[1] + '</button>';
      }).join('') + '</div>' +
        (pode('colaborador') ? '<button class="btn btn-primario" data-nova>' + icone('mais') + '<span>Nova tarefa</span></button>' : ''),
      corpo: porPessoa
        ? '<div class="funil-wrap"><div class="quadro" id="quadro-t">' + colunasPorPessoa(lista) + '</div></div>'
        : '<div class="conteudo"><div class="tarefas-quadro" id="quadro-t">' + colunas + '</div></div>',
      montar: function (el, topo) {
        topo.querySelector('#t-quem').addEventListener('click', function (e) { const b = e.target.closest('[data-v]'); if (b) { f.quem = b.dataset.v; desenhar(); } });
        const n = topo.querySelector('[data-nova]');
        if (n) n.onclick = function () { abrirFormTarefa(); };
        const q = el.querySelector('#quadro-t');
        q.addEventListener('click', function (e) {
          const nt = e.target.closest('[data-nova-t]');
          if (nt) return abrirFormTarefa({ status: nt.dataset.novaT });
          const np = e.target.closest('[data-nova-p]');
          if (np) return abrirFormTarefa({ responsavel: np.dataset.novaP });
          tratarCliqueTarefa(e);
        });
        let arr = null;
        q.addEventListener('dragstart', function (e) { const c = e.target.closest('[data-t]'); if (!c) return; arr = c.dataset.t; e.dataTransfer.setData('text/plain', arr); requestAnimationFrame(function () { c.classList.add('arrastando'); }); });
        q.addEventListener('dragend', function () { arr = null; q.querySelectorAll('.arrastando,.alvo').forEach(function (x) { x.classList.remove('arrastando', 'alvo'); }); });
        q.addEventListener('dragover', function (e) { const col = e.target.closest('.coluna'); if (!col || !arr) return; e.preventDefault(); q.querySelectorAll('.alvo').forEach(function (x) { if (x !== col) x.classList.remove('alvo'); }); col.classList.add('alvo'); });
        q.addEventListener('drop', function (e) {

// Quadro estilo Trello: uma coluna por pessoa ativa, com o que está aberto e quantas já foram feitas.
function colunasPorPessoa(lista) {
  const ordem = { fazendo: 0, afazer: 1 };
  return equipeAtiva().slice().sort(function (a, b) { return a.nome.localeCompare(b.nome, 'pt-BR'); }).map(function (m) {
    const minhas = lista.filter(function (t) { return t.responsavel === m.email; });
    const abertas = minhas.filter(function (t) { return t.status !== 'feito'; }).sort(function (a, b) {
      return (ordem[a.status] - ordem[b.status]) || ((a.prazo || '9999') < (b.prazo || '9999') ? -1 : 1);
    });
    const feitas = minhas.length - abertas.length;
    const atrasadas = abertas.filter(function (t) { return t.prazo && t.prazo < S.dados.hoje; }).length;
    return '<section class="coluna" data-pessoa="' + esc(m.email) + '" aria-label="' + esc(m.nome) + '">' +
      '<header class="coluna-cab"><div class="t">' + avatar(m.email) + '<div style="min-width:0;flex:1"><b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(m.nome) + '</b>' +
        '<span class="mudo pequeno" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(m.cargo || NOME_PAPEL[m.papel]) + '</span></div>' +

        '<span class="soma">' + abertas.length + ' aberta(s)' + (atrasadas ? ' · <span style="color:var(--alerta)">' + atrasadas + ' atrasada(s)</span>' : '') + ' · ' + feitas + ' feita(s)</span></header>' +
      '<div class="coluna-cards">' + (abertas.length ? abertas.map(function (t) {

function periodoHoras(p) {
  const hoje = S.dados.hoje, [a, m] = hoje.split('-').map(Number);
  const iso = function (y, mm, d) { return y + '-' + String(mm).padStart(2, '0') + '-' + String(d).padStart(2, '0'); };
  if (p === 'mes') return { de: iso(a, m, 1), ate: hoje };
  if (p === 'anterior') { const y = m === 1 ? a - 1 : a, mm = m === 1 ? 12 : m - 1; return { de: iso(y, mm, 1), ate: iso(y, mm, new Date(y, mm, 0).getDate()) }; }
  if (p === 'semana') { const d = new Date(hoje + 'T12:00:00'); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return { de: d.toISOString().slice(0, 10), ate: hoje }; }
  return {};
}

  const m = modal({
    titulo: novo ? 'Lançar horas' : 'Lançamento', estreito: true,
    corpo: '<form id="form-h" class="grade" autocomplete="off"><fieldset style="display:contents"' + (editavel ? '' : ' disabled') + '>' +
      (pode('gestor') ? '<label class="campo inteira"><span>Pessoa</span><select name="email">' + opcoes(equipeAtiva().map(function (x) { return { v: x.email, t: x.nome }; }), h.email) + '</select></label>' : '') +
      '<label class="campo"><span>Data</span><input name="data" type="date" value="' + esc(h.data) + '"></label>' +
      '<label class="campo"><span>Horas</span><input name="horas" inputmode="decimal" value="' + (h.horas ? String(h.horas).replace('.', ',') : '') + '" placeholder="1,5" autofocus></label>' +
      '<label class="campo inteira"><span>Cliente</span><select name="clienteId" required>' + opcoes(clientes.map(function (c) { return { v: c.id, t: c.nome }; }), h.clienteId, 'Escolha') + '</select></label>' +
      '<label class="campo inteira"><span>Oportunidade (opcional)</span><select name="oportunidadeId">' + opcoes(opsDe(h.clienteId), h.oportunidadeId, '—') + '</select></label>' +
      '<label class="campo inteira"><span>O que foi feito</span><input name="descricao" maxlength="500" value="' + esc(h.descricao) + '"></label></fieldset></form>',
    pe: (!novo && editavel ? '<div class="esq"><button class="btn btn-fantasma btn-perigo btn-peq" data-apagar>' + icone('lixo') + 'Apagar</button></div>' : '') +
      '<button class="btn btn-fantasma" data-fechar>' + (editavel ? 'Cancelar' : 'Fechar') + '</button>' + (editavel ? '<button class="btn btn-primario" data-salvar>' + (novo ? 'Lançar' : 'Salvar') + '</button>' : ''),
  });
  const form = m.el.querySelector('#form-h');
  form.clienteId.addEventListener('change', function () { form.oportunidadeId.innerHTML = opcoes(opsDe(form.clienteId.value), '', '—'); });
  const ap = m.el.querySelector('[data-apagar]');
  if (ap) ap.onclick = async function () {
    if (await gravar('removerHoras', [h.id], 'Lançamento apagado.') != null) { m.fechar(); carregarHoras(); }
  };
  const salvar = m.el.querySelector('[data-salvar]');
  if (!salvar) return;
  form.addEventListener('submit', function (e) { e.preventDefault(); salvar.click(); });
  salvar.onclick = function () {
    const d = lerForm(form);
    if (h.id) d.id = h.id;
    ocupado(salvar, async function () {
      const r = await gravar('lancarHoras', [d], novo ? 'Horas lançadas.' : 'Salvo.');
      if (r) { m.fechar(); if (S.tela === 'horas') carregarHoras(); }
    });
  };
}
</script>
