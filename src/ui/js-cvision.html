<script>
/**
 * C-Vision: a visão do CEO sobre tudo o que acontece na agência. Os números vêm prontos do servidor (cvision()),
 * que só responde a quem tem a marcação C-Vision. A tela pede os dados ao abrir e a cada 2 minutos.
 */
S.cv = { dados: null, carregando: false, em: 0 };

function cvMoeda(v) { return dinheiro(v || 0, true); }
function cvPct(v) { return v == null ? '—' : String(v).replace('.', ',') + '%'; }
function cvVar(v, inverter) {
  if (v == null) return '';
  const bom = inverter ? v <= 0 : v >= 0;
  return '<span class="var ' + (bom ? 'sobe' : 'desce') + '">' + (v >= 0 ? '▲ ' : '▼ ') + String(Math.abs(v)).replace('.', ',') + '%</span>';
}

// Linha fina com área suave (uma série só), para dar tendência aos números.
function cvSpark(valores) {
  if (!valores.length) return '';
  const L = 200, A = 34, max = Math.max.apply(null, valores.concat([1])), min = Math.min.apply(null, valores.concat([0]));
  const x = function (i) { return valores.length === 1 ? L : i * L / (valores.length - 1); };
  const y = function (v) { return A - 3 - (v - min) / (max - min || 1) * (A - 6); };
  const linha = valores.map(function (v, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1); }).join(' ');
  return '<svg class="spark" viewBox="0 0 ' + L + ' ' + A + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<path d="' + linha + ' L' + L + ',' + A + ' L0,' + A + ' Z" fill="color-mix(in srgb, var(--destaque) 14%, transparent)"/>' +
    '<path d="' + linha + '" fill="none" stroke="var(--destaque)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>' +
    '<circle cx="' + x(valores.length - 1) + '" cy="' + y(valores[valores.length - 1]) + '" r="3" fill="var(--destaque)"/></svg>';
}

function cvKpi(rotulo, valor, det, extra, spark) {
  return '<div class="cartao cv-kpi"><span class="rotulo">' + esc(rotulo) + '</span><div class="valor">' + esc(valor) + '</div>' +
    '<div class="det">' + (extra || '') + (extra ? ' ' : '') + esc(det || '') + '</div>' + (spark || '') + '</div>';
}

function cvAnel(nota) {
  const r = 50, c = 2 * Math.PI * r, cor = nota >= 75 ? '#C5DBAE' : nota >= 50 ? '#E2B276' : '#EBA07F';
  return '<svg viewBox="0 0 120 120" role="img" aria-label="Saúde da empresa: ' + nota + ' de 100">' +
    '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="9"/>' +
    '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="' + cor + '" stroke-width="9" stroke-linecap="round" stroke-dasharray="' + (c * nota / 100) + ' ' + c + '" transform="rotate(-90 60 60)"/>' +
    '<text x="60" y="62" text-anchor="middle" class="nota">' + nota + '</text><text x="60" y="80" text-anchor="middle" class="sub">SAÚDE</text></svg>';
}

function cvBarras(lista, rotulo, valor, fmt, cor) {
  const max = Math.max.apply(null, lista.map(valor).concat([1]));
  return '<div class="barra-funil">' + lista.map(function (x) {
    return '<div class="linha"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + rotulo(x) + '</span>' +
      '<span class="trilho"><i style="width:' + Math.max(2, Math.round(100 * valor(x) / max)) + '%;background:' + (cor ? cor(x) : 'var(--destaque)') + '"></i></span><span class="num pequeno">' + fmt(x) + '</span></div>';
  }).join('') + '</div>';
}

async function carregarCVision(forcar) {
  if (S.cv.carregando) return;
  if (!forcar && S.cv.dados && Date.now() - S.cv.em < 120000) return;
  S.cv.carregando = true;
  try {
    S.cv.dados = await chamar('cvision');
    S.cv.em = Date.now();
    if (S.tela === 'cvision') desenhar();
  } catch (e) { toast(e.message, { erro: true }); } finally { S.cv.carregando = false; }
}

TELAS.cvision = {
  desenhar: function () {
    const v = S.cv.dados;
    const base = { rotulo: 'Visão do CEO', titulo: 'C-<em>Vision</em>', acoes: '<button class="btn" data-atualizar-cv>' + icone('recarregar') + 'Atualizar</button>' };
    if (!v) {
      carregarCVision();
      return Object.assign(base, { corpo: '<div class="conteudo"><div class="vazio" style="padding:80px 0"><b>Montando a visão da empresa…</b>Juntando comercial, financeiro, social, tráfego e equipe.</div></div>' });
    }
    const c = v.comercial, f = v.financeiro, so = v.social, tr = v.trafego;
    const primeiro = String(v.nome).split(' ')[0];
    const dataHoje = new Date(v.hoje + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
    const altos = v.alertas.filter(function (a) { return a.nivel === 'alto'; }).length;
    const meses = f.faturado12.map(function (x) { return x.valor; });

    const hero = '<section class="cv-hero"><span class="hero-aurora" aria-hidden="true"></span><div>' +
      '<span class="rotulo">' + esc(dataHoje) + ' · ' + esc(v.empresa) + '</span>' +
      '<h2>' + esc(primeiro) + ', aqui está a <em>' + esc(S.dados.config.empresa) + '</em> hoje.</h2>' +
      '<p>Receita recorrente de <b>' + esc(dinheiro(f.mrr)) + '/mês</b>' + (f.crescimento != null ? ' (' + (f.crescimento >= 0 ? '+' : '') + String(f.crescimento).replace('.', ',') + '% em 3 meses)' : '') +
        ', <b>' + esc(dinheiro(c.abertoTotal)) + '</b> em ' + c.abertoN + ' oportunidades abertas e <b>' + so.publicadosMes + ' conteúdos</b> publicados no mês. ' +
        (v.alertas.length ? 'Atenção a <b>' + v.alertas.length + ' ponto(s)</b>' + (altos ? ', ' + altos + ' urgente(s)' : '') + '.' : 'Nenhum alerta agora.') + '</p></div>' +
      '<canvas class="particulas-hero" aria-hidden="true"></canvas>' +
      '<div class="cv-anel">' + cvAnel(v.saude.nota) + '<ul>' + v.saude.itens.map(function (i) {
        return '<li title="' + esc(i.det) + '"><span>' + esc(i.rotulo) + '</span><i><b style="width:' + Math.round(100 * i.pontos / i.peso) + '%"></b></i></li>';
      }).join('') + '</ul></div></section>';

    const nav = '<nav class="cv-nav">' + [['geral', 'Visão geral'], ['comercial', 'Comercial'], ['financeiro', 'Financeiro'], ['forcas', '4 forças'], ['social', 'Social'], ['trafego', 'Tráfego'], ['equipe', 'Equipe'], ['atividade', 'Atividade']].map(function (x) {
      return '<a href="#cv-' + x[0] + '" data-ir-sec="cv-' + x[0] + '">' + x[1] + '</a>';
    }).join('') + '</nav>';

    const geral = '<section class="cv-sec" id="cv-geral"><header><h2>Visão <em>geral</em></h2><span class="mudo pequeno">' + v.totais.clientes + ' clientes · ' + v.totais.pessoas + ' pessoas · ' + v.online.length + ' online agora</span></header>' +
      '<div class="cv-kpis">' +
        cvKpi('Receita recorrente', cvMoeda(f.mrr) + '/mês', f.contratosAtivos + ' contratos ativos', cvVar(f.crescimento), cvSpark(meses)) +
        cvKpi('Faturado no ano', cvMoeda(f.faturadoAno), 'fee, projetos e extras', '', cvSpark(meses.map(function (x, i, a) { return a.slice(0, i + 1).reduce(function (s, y) { return s + y; }, 0); }))) +
        cvKpi('Funil aberto', cvMoeda(c.abertoTotal), cvMoeda(c.ponderado) + ' ponderado', '', cvSpark(c.serieGanhos.map(function (x) { return x.valor; }))) +
        cvKpi('Fechado no ano', cvMoeda(c.ganhoAno), c.ganhosAno + ' ganho(s) · ticket ' + cvMoeda(c.ticketMedio)) +
        cvKpi('Leads (30 dias)', String(tr.leads30), 'CPL ' + (tr.cpl30 ? dinheiro(tr.cpl30) : '—'), cvVar(tr.variacaoLeads)) +
        cvKpi('Conteúdos no mês', String(so.publicadosMes), so.agendados7 + ' agendado(s) na semana') +
      '</div>' +
      '<div class="cv-grade"><div class="cartao"><div class="cartao-cab"><h2>Alertas</h2><span class="pilula' + (altos ? ' alerta' : '') + '">' + v.alertas.length + '</span></div><div class="cartao-corpo">' +
        (v.alertas.length ? v.alertas.map(function (a) { return '<div class="cv-alerta ' + a.nivel + '"><i></i><span style="flex:1">' + esc(a.texto) + '</span>' + (a.valor ? '<span class="num mudo pequeno">' + esc(dinheiro(a.valor)) + '</span>' : '') + '</div>'; }).join('')
          : '<div class="vazio"><b>Tudo sob controle.</b>Nenhum alerta agora.</div>') + '</div></div>' +
      '<div class="cartao"><div class="cartao-cab"><h2>Receita por mês</h2><span class="mudo pequeno">últimos 12 meses</span></div><div class="cartao-corpo">' +
        graficoBarras(f.faturado12.map(function (x) { return { rotulo: mesCurto(x.mes, x.mes.slice(5) === '01' || x === f.faturado12[0]), valor: x.valor, apagado: false, dica: '<b>' + esc(mesCurto(x.mes, true)) + '</b><span>' + esc(dinheiro(x.valor)) + '</span>' }; }), 200) +
      '</div></div></div></section>';

    const comercial = '<section class="cv-sec" id="cv-comercial"><header><h2>Comercial</h2><span class="mudo pequeno">' + c.novas30 + ' oportunidade(s) nova(s) em 30 dias</span></header>' +
      '<div class="cv-kpis">' +
        cvKpi('Conversão (90 dias)', cvPct(c.conversao90), 'ganhas sobre decididas') +
        cvKpi('Ciclo de venda', c.cicloMedio == null ? '—' : c.cicloMedio + ' dias', 'da entrada ao fechamento') +
        cvKpi('Fechado no mês', cvMoeda(c.ganhoMes), 'valor total dos contratos') +
        cvKpi('Ticket médio', cvMoeda(c.ticketMedio), 'no ano') +
      '</div><div class="cv-grade tres">' +
        '<div class="cartao"><div class="cartao-cab"><h2>Funil</h2></div><div class="cartao-corpo">' + cvBarras(c.funil, function (x) { return esc(x.etapa) + ' <span class="mudo pequeno">' + x.n + '</span>'; }, function (x) { return x.valor; }, function (x) { return esc(cvMoeda(x.valor)); }, function (x) { return esc(x.cor); }) + '</div></div>' +
        '<div class="cartao"><div class="cartao-cab"><h2>De onde vêm os ganhos</h2></div><div class="cartao-corpo">' + (c.origens.length ? cvBarras(c.origens.slice(0, 6), function (x) { return esc(x.origem); }, function (x) { return x.valorGanho; }, function (x) { return x.ganhos + '/' + x.total; }) : '<div class="vazio">Sem dados.</div>') + '</div></div>' +
        '<div class="cartao"><div class="cartao-cab"><h2>Paradas</h2></div><div class="cartao-corpo">' + (c.paradas.length ? '<ul class="lista">' + c.paradas.map(function (o) {
          return '<li>' + avatar(o.responsavel) + '<div class="principal-li"><b>' + esc(o.titulo) + '</b><span>' + esc(o.cliente) + ' · ' + esc(o.etapa) + '</span></div><span class="pilula alerta">' + o.dias + 'd</span></li>';
        }).join('') + '</ul>' : '<div class="vazio">Nada parado.</div>') + '</div></div>' +
      '</div></section>';

    const financeiro = '<section class="cv-sec" id="cv-financeiro"><header><h2>Financeiro</h2><span class="mudo pequeno">reajuste médio ' + cvPct(f.reajusteMedio) + '</span></header>' +
      '<div class="cv-grade tres">' +
        '<div class="cartao"><div class="cartao-cab"><h2>Maiores clientes</h2><span class="mudo pequeno">da receita recorrente</span></div><div class="cartao-corpo">' + (f.topClientes.length ? cvBarras(f.topClientes, function (x) { return esc(x.cliente); }, function (x) { return x.mensal; }, function (x) { return Math.round(x.share * 100) + '%'; }) : '<div class="vazio">Sem contratos de fee.</div>') + '</div></div>' +
        '<div class="cartao"><div class="cartao-cab"><h2>Renovações</h2><span class="mudo pequeno">próximos 90 dias</span></div><div class="cartao-corpo">' + (f.renovacoes.length ? '<ul class="lista">' + f.renovacoes.map(function (r) {
          return '<li><div class="principal-li"><b>' + esc(r.cliente) + '</b><span>' + esc(r.titulo) + ' · ' + esc(dinheiro(r.mensal)) + '/mês</span></div><span class="pilula' + (r.dias <= 30 ? ' alerta' : '') + '">' + r.dias + ' dias</span></li>';
        }).join('') + '</ul>' : '<div class="vazio">Nenhuma renovação próxima.</div>') + '</div></div>' +
        '<div class="cartao"><div class="cartao-cab"><h2>Rentabilidade</h2><span class="mudo pequeno">receita por hora (30 dias)</span></div><div class="cartao-corpo">' + (v.rentabilidade.length ? '<ul class="lista">' + v.rentabilidade.map(function (r) {
          return '<li><div class="principal-li"><b>' + esc(r.cliente) + '</b><span>' + String(r.horas).replace('.', ',') + ' h · ' + esc(dinheiro(r.receita)) + '/mês</span></div><span class="num">' + (r.porHora ? esc(dinheiro(r.porHora)) + '/h' : '<span class="mudo">sem horas</span>') + '</span></li>';
        }).join('') + '</ul>' : '<div class="vazio">Lance horas para ver a rentabilidade.</div>') + '</div></div>' +
      '</div></section>';

    const forcas = '<section class="cv-sec" id="cv-forcas"><header><h2>As quatro <em>forças</em></h2><span class="mudo pequeno">por segmento de cliente</span></header><div class="cv-forcas">' + v.segmentos.map(function (s) {
      return '<div class="cartao cv-forca"><span class="rotulo">Força</span><h3>' + esc(s.segmento) + '</h3><dl>' +
        '<dt>Receita recorrente</dt><dd>' + esc(cvMoeda(s.mrr)) + '</dd><dt>Funil aberto</dt><dd>' + esc(cvMoeda(s.pipeline)) + '</dd>' +
        '<dt>Fechado no ano</dt><dd>' + esc(cvMoeda(s.ganhoAno)) + '</dd><dt>Clientes</dt><dd>' + s.clientes + '</dd></dl></div>';
    }).join('') + '</div></section>';

    const NOMES_POST = { pauta: 'Pauta', producao: 'Produção', aprovacao: 'Aprovação', agendado: 'Agendado', publicado: 'Publicado' };
    const social = '<section class="cv-sec" id="cv-social"><header><h2>Social <em>media</em></h2><span class="mudo pequeno">' + so.atrasados + ' atrasado(s) · ' + so.aprovacao + ' em aprovação</span></header>' +
      '<div class="cv-etapas">' + so.porStatus.map(function (x) { return '<div><span class="rotulo">' + esc(NOMES_POST[x.status] || x.status) + '</span><b>' + x.n + '</b></div>'; }).join('') + '</div>' +
      '<div class="cartao"><div class="cartao-cab"><h2>Por cliente</h2><span class="mudo pequeno">publicados no mês · na fila</span></div><div class="cartao-corpo">' + (so.porCliente.length ? cvBarras(so.porCliente, function (x) { return esc(x.cliente); }, function (x) { return x.publicados + x.fila; }, function (x) { return x.publicados + ' · ' + x.fila; }) : '<div class="vazio">Sem conteúdos.</div>') + '</div></div></section>';

    const trafego = '<section class="cv-sec" id="cv-trafego"><header><h2>Tráfego <em>pago</em></h2><span class="mudo pequeno">últimos 30 dias · ' + tr.campanhasAtivas + ' campanha(s) ativa(s)</span></header>' +
      '<div class="cv-kpis">' + cvKpi('Investimento', cvMoeda(tr.investimento30), 'vs 30 dias antes', cvVar(tr.variacaoInvest)) + cvKpi('Leads', String(tr.leads30), 'vs 30 dias antes', cvVar(tr.variacaoLeads)) +
        cvKpi('CPL', tr.cpl30 ? dinheiro(tr.cpl30) : '—', tr.cpl60 ? 'antes ' + dinheiro(tr.cpl60) : '', tr.cpl30 && tr.cpl60 ? cvVar(Math.round((tr.cpl30 / tr.cpl60 - 1) * 1000) / 10, true) : '') +
        cvKpi('ROAS', tr.roas30 ? String(tr.roas30.toFixed(1)).replace('.', ',') + 'x' : '—', 'receita ' + cvMoeda(tr.receita30)) + '</div>' +
      (tr.campanhas.length ? '<div class="cartao"><div class="tabela-wrap"><table class="tabela"><thead><tr><th>Campanha</th><th class="d">Investido</th><th class="d">Leads</th><th class="d">CPL</th><th class="d some-cel">ROAS</th></tr></thead><tbody>' + tr.campanhas.map(function (x) {
        return '<tr style="cursor:default"><td><b>' + esc(x.nome) + '</b><br><span class="mudo pequeno">' + esc(x.cliente) + '</span></td><td class="d num">' + esc(dinheiro(x.investimento)) + '</td><td class="d num">' + x.leads + '</td><td class="d num">' + (x.cpl ? esc(dinheiro(x.cpl)) : '—') + '</td><td class="d num some-cel">' + (x.roas ? x.roas.toFixed(1).replace('.', ',') + 'x' : '—') + '</td></tr>';
      }).join('') + '</tbody></table></div></div>' : '') + '</section>';

    const equipe = '<section class="cv-sec" id="cv-equipe"><header><h2>Equipe</h2><span class="mudo pequeno">' + v.totais.tarefasAbertas + ' tarefas abertas · ' + String(v.totais.horasMes).replace('.', ',') + ' h lançadas no mês</span></header><div class="cv-pessoas">' + v.equipe.map(function (p) {
      const on = v.online.some(function (x) { return x.email === p.email; });
      return '<div class="cartao cv-pessoa" data-pessoa-cv="' + esc(p.email) + '"><div class="topo-p">' + avatar(p.email, 'g', on) + '<div style="min-width:0"><b>' + esc(p.nome) + '</b><span>' + esc(p.cargo || '') + '</span></div></div>' +
        '<div class="nums"><div><b>' + p.abertas + '</b><span>abertas</span></div><div><b' + (p.atrasadas ? ' style="color:var(--alerta)"' : '') + '>' + p.atrasadas + '</b><span>atras.</span></div><div><b>' + p.feitas30 + '</b><span>feitas</span></div><div><b>' + String(p.horasMes).replace('.', ',') + '</b><span>horas</span></div></div></div>';
    }).join('') + '</div></section>';

    const atividade = '<section class="cv-sec" id="cv-atividade"><header><h2>O que está <em>acontecendo</em></h2></header><div class="cartao"><div class="cartao-corpo">' + (v.feed.length ? '<ul class="cv-feed">' + v.feed.map(function (h) {
      return '<li>' + avatar(h.email) + '<div><time>' + esc(quando(h.ts)) + '</time><b style="font-weight:500">' + esc(h.quem) + '</b> ' + esc(h.texto) + (h.alvo ? ' <span class="mudo">· ' + esc(h.alvo) + '</span>' : '') + '</div></li>';
    }).join('') + '</ul>' : '<div class="vazio">Sem atividade registrada.</div>') + '</div></div></section>';

    return Object.assign(base, {
      corpo: '<div class="conteudo cv">' + hero + nav + geral + comercial + financeiro + forcas + social + trafego + equipe + atividade + '</div>',
      montar: function (el, topo) {
        topo.querySelector('[data-atualizar-cv]').onclick = function () { const b = this; ocupado(b, function () { return carregarCVision(true); }); };
        const hero = el.querySelector('.cv-hero');
        particulas(hero.querySelector('.particulas-hero'), { alvo: hero, escala: 1.15 });
        el.querySelectorAll('[data-ir-sec]').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); document.getElementById(a.dataset.irSec).scrollIntoView({ behavior: 'smooth', block: 'start' }); }; });
        el.querySelectorAll('[data-pessoa-cv]').forEach(function (d) { d.onclick = function () { abrirPessoa(d.dataset.pessoaCv); }; });
        ligarGraficos(el, [f.faturado12.map(function (x) { return { dica: '<b>' + esc(mesCurto(x.mes, true)) + '</b><span>' + esc(dinheiro(x.valor)) + '</span>' }; })]);
        carregarCVision();
      },
    });
  },
};
</script>
