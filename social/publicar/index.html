<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seok Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* =========================================================================================
   Seok Social · design
   Calma por restrição: papel quente, tinta escura, um verde Seok de destaque, cor do cliente só como assinatura.
   Grade de 4px. Hierarquia por peso e espaço, não por caixas. Uma superfície de cartão para o app inteiro.
   ========================================================================================= */
:root {
  --bg: #F4F2EC; --surface: #FFFFFF; --surface-2: #FAF9F6; --sunken: #EFEDE6;
  --ink: #15171A; --ink-2: #4A4F55; --ink-3: #868B91; --ink-4: #B4B8BC;
  --line: rgba(21, 23, 26, .08); --line-2: rgba(21, 23, 26, .14);
  --accent: #1F3D2B; --accent-2: #2E5A3F; --accent-soft: #E6EEE7; --accent-ink: #1F3D2B;
  --warn: #A9561F; --warn-soft: #F6E9DE; --bad: #B23B2E; --bad-soft: #F8E4E0; --ok: #2E7A4C; --ok-soft: #E3F1E8;
  --org: #1E6B33; --pago: #D9944F;
  --r: 16px; --r-sm: 10px;
  --shadow: 0 1px 2px rgba(21, 23, 26, .04), 0 1px 1px rgba(21, 23, 26, .02);
  --shadow-hover: 0 1px 2px rgba(21, 23, 26, .05), 0 12px 32px -16px rgba(21, 23, 26, .22);
  --shadow-pop: 0 24px 64px -20px rgba(21, 23, 26, .35), 0 2px 6px rgba(21, 23, 26, .06);
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --serif: 'Instrument Serif', Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss01'; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
svg { display: block; }
.num { font-variant-numeric: tabular-nums; }
.hide { display: none !important; }
::selection { background: var(--accent-soft); }

/* ---------- estrutura ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 28px 18px 20px; border-right: 1px solid var(--line); background: var(--surface-2); }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 28px; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: #F4F2EC; display: grid; place-items: center; font: 400 19px/1 var(--serif); }
.brand b { font: 600 15px/1.1 var(--sans); letter-spacing: -.01em; display: block; }
.brand small { font-size: 11.5px; color: var(--ink-3); }
.nav { display: grid; gap: 2px; }
.nav-sec { font: 600 10.5px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-4); padding: 22px 10px 10px; }
.nav button { display: flex; align-items: center; gap: 11px; width: 100%; height: 36px; padding: 0 10px; border: 0; border-radius: 9px; background: none; color: var(--ink-2); cursor: pointer; text-align: left; font-weight: 500; transition: background .15s, color .15s; }
.nav button:hover { background: var(--sunken); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); }
.nav button svg { width: 17px; height: 17px; color: var(--ink-3); flex: none; }
.nav button[aria-current="page"] svg { color: var(--accent); }
.nav .dot { width: 8px; height: 8px; border-radius: 50%; margin: 0 4px; flex: none; }
.nav .badge { margin-left: auto; font: 600 11px/1 var(--sans); color: var(--warn); }
.side-foot { margin-top: auto; display: grid; gap: 2px; padding-top: 16px; border-top: 1px solid var(--line); }
.me { display: flex; align-items: center; gap: 10px; padding: 10px; }
.me b { font-weight: 600; font-size: 13px; display: block; }
.me small { color: var(--ink-3); font-size: 12px; }
.main { min-width: 0; }
.page { max-width: 1320px; margin: 0 auto; padding: 44px 48px 80px; }

/* ---------- tipografia de página ---------- */
.eyebrow { font: 600 11px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.h1 { font: 400 46px/1.05 var(--serif); letter-spacing: -.015em; margin: 12px 0 10px; }
.h1 i { font-style: italic; color: var(--accent); }
.lede .muted { color: var(--ink-3); }
.lede { color: var(--ink-2); font-size: 15px; max-width: 64ch; margin: 0; }
.head { display: flex; align-items: flex-end; gap: 24px; margin-bottom: 32px; }
.head > div:first-child { flex: 1; min-width: 0; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.h2 { font: 600 16px/1.3 var(--sans); letter-spacing: -.01em; margin: 0; }
.sec { display: flex; align-items: baseline; gap: 12px; margin: 40px 0 16px; }
.sec .h2 { font-size: 18px; }
.sec small { color: var(--ink-3); }
.sec .grow { flex: 1; }

/* ---------- botões, campos ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none; transition: background .15s, border-color .15s, box-shadow .15s, transform .1s; }
.btn:hover { border-color: rgba(21, 23, 26, .24); box-shadow: var(--shadow); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #F7F6F1; }
.btn.primary:hover { background: var(--accent-2); }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); }
.btn.ghost:hover { background: var(--sunken); box-shadow: none; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 8px; }
.btn.icon { width: 34px; padding: 0; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; pointer-events: none; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
.field small { font-size: 12px; color: var(--ink-3); }
.input, .field input, .field select, .field textarea { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); outline: none; transition: border-color .15s, box-shadow .15s; }
.field textarea { height: auto; min-height: 88px; padding: 10px 12px; resize: vertical; line-height: 1.5; }
.input:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.full { grid-column: 1 / -1; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 11px; background: var(--sunken); }
.seg button { height: 32px; padding: 0 14px; border: 0; border-radius: 8px; background: none; color: var(--ink-2); font-weight: 500; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 100px; font-size: 12px; font-weight: 500; background: var(--sunken); color: var(--ink-2); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.accent { background: var(--accent-soft); color: var(--accent-ink); }
.chip .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.avatar { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #fff; font: 600 15px/1 var(--sans); letter-spacing: .02em; flex: none; }
.avatar.sm { width: 28px; height: 28px; border-radius: 8px; font-size: 11px; }
.avatar.lg { width: 64px; height: 64px; border-radius: 18px; font-size: 22px; }

/* ---------- resumo do portfólio ---------- */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); }
.stat { padding: 22px 24px; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat b { display: block; font: 400 38px/1 var(--serif); letter-spacing: -.01em; margin: 10px 0 6px; }
.stat small { color: var(--ink-3); font-size: 12.5px; }
.stat.warn b { color: var(--warn); }

/* ---------- cartões de cliente ---------- */
.clients { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.cc { position: relative; display: flex; flex-direction: column; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow), inset 0 0 0 1px var(--line); cursor: pointer; overflow: hidden; transition: box-shadow .2s, transform .2s; text-align: left; border: 0; padding: 0; }
.cc:hover { box-shadow: var(--shadow-hover), inset 0 0 0 1px var(--line); transform: translateY(-2px); }
.cc:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.cc::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--c); }
.cc-top { display: flex; align-items: center; gap: 14px; padding: 24px 26px 18px; }
.cc-top .nm { flex: 1; min-width: 0; }
.cc-top .nm b { display: block; font: 400 26px/1.1 var(--serif); letter-spacing: -.01em; }
.cc-top .nm small { color: var(--ink-3); font-size: 13px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
.cc-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.cc-kpi { padding: 16px 18px 16px 26px; min-width: 0; }
.cc-kpi + .cc-kpi { border-left: 1px solid var(--line); padding-left: 18px; }
.cc-kpi .lab { font: 600 10.5px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.cc-kpi .val { font: 600 22px/1.15 var(--sans); letter-spacing: -.02em; margin: 10px 0 4px; white-space: nowrap; }
.cc-kpi .val small { font: 500 13px var(--sans); color: var(--ink-3); letter-spacing: 0; }
.cc-kpi .sub { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cc-kpi .sub.warn { color: var(--warn); font-weight: 500; }
.cc-kpi .sub.bad { color: var(--bad); font-weight: 500; }
.spark { display: flex; align-items: flex-end; gap: 3px; height: 22px; margin-top: 8px; }
.spark i { flex: 1; border-radius: 2px 2px 1px 1px; background: var(--ink-4); min-height: 2px; }
.spark i.on { background: var(--accent); }
.runway { height: 6px; border-radius: 100px; background: var(--sunken); margin-top: 10px; overflow: hidden; }
.runway i { display: block; height: 100%; border-radius: 100px; background: var(--accent); }
.runway i.warn { background: var(--warn); }
.runway i.bad { background: var(--bad); }
.cc-focus { padding: 18px 26px 6px; display: grid; gap: 12px; flex: 1; }
.focus { display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
.cc, .cc-focus { min-width: 0; }
.cc { overflow: hidden; }
.focus .ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--sunken); color: var(--ink-2); flex: none; }
.focus .ic svg { width: 16px; height: 16px; }
.focus .tx { min-width: 0; flex: 1; }
.focus .tx b { display: block; font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.focus .tx small { display: block; color: var(--ink-3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.focus .tag { flex: none; }
.cc-foot { display: flex; align-items: center; gap: 18px; padding: 14px 26px 18px; margin-top: 8px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 12.5px; }
.cc-foot b { color: var(--ink); font-weight: 600; }
.cc-foot .up { color: var(--ok); } .cc-foot .down { color: var(--bad); }
.cc-foot .go { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-weight: 500; }
.cc-foot .go svg { width: 14px; height: 14px; transition: transform .2s; }
.cc:hover .cc-foot .go svg { transform: translateX(3px); }
.pecas { display: flex; gap: 4px; margin-top: 6px; }
.pecas i { height: 4px; flex: 1; border-radius: 100px; background: var(--sunken); }
.pecas i.on { background: var(--accent); }

/* ---------- painéis (página do cliente) ---------- */
.panel { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); padding: 22px 24px; min-width: 0; }
.panel-h { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.panel-h .h2 { flex: 1; }
.panel-h small { color: var(--ink-3); }
.panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.panels .wide { grid-column: 1 / -1; }
.rows { display: grid; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top: 0; padding-top: 2px; }
.row .tx { flex: 1; min-width: 0; }
.row .tx b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .tx small { display: block; color: var(--ink-3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .n { width: 26px; height: 26px; border-radius: 8px; background: var(--sunken); display: grid; place-items: center; font: 600 12px var(--sans); color: var(--ink-2); flex: none; }
.row .acts { display: flex; gap: 4px; flex: none; opacity: .55; transition: opacity .15s; }
.row:hover .acts { opacity: 1; }
.empty { padding: 26px 8px; text-align: center; color: var(--ink-3); font-size: 13.5px; }
.empty b { display: block; color: var(--ink-2); font-weight: 600; margin-bottom: 4px; }
.big { font: 400 54px/1 var(--serif); letter-spacing: -.02em; }
.meta-line { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-ink); font-size: 13.5px; margin-top: 16px; }
.alert.warn { background: var(--warn-soft); color: var(--warn); }
.alert.bad { background: var(--bad-soft); color: var(--bad); }
.alert svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
.ev { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
.ev:first-child { border-top: 0; }
.ev .day { text-align: center; padding: 6px 0; border-radius: 12px; background: var(--sunken); }
.ev .day b { display: block; font: 400 24px/1 var(--serif); }
.ev .day small { font: 600 10px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.ev .t { display: flex; align-items: center; gap: 8px; }
.ev .t b { font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev small.m { color: var(--ink-3); font-size: 12.5px; }
.pecas-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.peca { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px; border-radius: 9px; font-size: 12.5px; font-weight: 500; border: 1px dashed var(--line-2); background: none; color: var(--ink-3); cursor: pointer; }
.peca:hover { border-color: var(--accent); color: var(--accent); }
.peca.tem { border-style: solid; color: var(--ink-2); background: var(--surface-2); cursor: pointer; }
.peca.feita { border-color: transparent; background: var(--ok-soft); color: var(--ok); }
.peca a { color: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.peca svg { width: 13px; height: 13px; }

/* ---------- cabeçalho do cliente ---------- */
.ch { display: flex; align-items: center; gap: 20px; margin-bottom: 26px; }
.ch .tx { flex: 1; min-width: 0; }
.ch .h1 { margin: 6px 0 4px; }
.ch .lede { font-size: 14px; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 13px; font-weight: 500; background: none; border: 0; cursor: pointer; padding: 0; margin-bottom: 18px; }
.back:hover { color: var(--ink); }
.back svg { width: 14px; height: 14px; }
.tabs { display: flex; gap: 26px; border-bottom: 1px solid var(--line); margin-bottom: 28px; }
.tabs button { position: relative; height: 42px; border: 0; background: none; padding: 0; color: var(--ink-3); font-weight: 500; cursor: pointer; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); }
.tabs button[aria-selected="true"]::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }

/* ---------- calendário ---------- */
.cal-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.cal-bar .mes { font: 400 30px/1 var(--serif); min-width: 220px; }
.cal-filtros { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.fchip { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px; border-radius: 100px; border: 1px solid var(--line-2); background: var(--surface); font-size: 12.5px; font-weight: 500; color: var(--ink-2); cursor: pointer; }
.fchip i { width: 8px; height: 8px; border-radius: 50%; }
.fchip[aria-pressed="false"] { opacity: .45; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); overflow: hidden; }
.cal .wd { padding: 12px 12px 10px; font: 600 10.5px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); border-bottom: 1px solid var(--line); }
.cal .d { min-height: 128px; padding: 8px 8px 10px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; cursor: pointer; min-width: 0; transition: background .15s; }
.cal .d:nth-child(7n+1) { border-left: 0; }
.cal .d:hover { background: var(--surface-2); }
.cal .d.fora { background: var(--surface-2); }
.cal .d.fora .dn { color: var(--ink-4); }
.cal .dn { font: 500 12.5px/1 var(--sans); color: var(--ink-2); padding: 4px 4px 6px; }
.cal .d.hoje .dn { display: inline-grid; place-items: center; width: 24px; height: 24px; padding: 0; border-radius: 50%; background: var(--accent); color: #fff; margin-bottom: 2px; }
.pc { display: flex; align-items: center; gap: 6px; padding: 5px 7px; border-radius: 7px; background: var(--surface-2); box-shadow: inset 2px 0 0 var(--c); font-size: 12px; min-width: 0; cursor: pointer; }
.pc:hover { background: var(--sunken); }
.pc b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.pc .st { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.pc.publicado { opacity: .62; }
.st-ideia { background: var(--ink-4); } .st-producao { background: #C9A227; } .st-aprovacao { background: var(--warn); } .st-agendado { background: #2F6B8F; } .st-publicado { background: var(--ok); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--ink-3); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 7px; height: 7px; border-radius: 50%; }

/* ---------- resultados ---------- */
.rk { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); margin-bottom: 20px; }
.rk > div { padding: 20px 22px; }
.rk > div + div { border-left: 1px solid var(--line); }
.rk .lab { font: 600 10.5px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.rk b { display: block; font: 400 34px/1 var(--serif); margin: 10px 0 6px; }
.rk small { font-size: 12.5px; color: var(--ink-3); }
.rk .up { color: var(--ok); } .rk .down { color: var(--bad); }
.chart { width: 100%; height: auto; overflow: visible; }
.chart text { font: 500 11px var(--sans); fill: var(--ink-3); }
.chart .v { fill: var(--ink); font-weight: 600; }
.chart .gl { stroke: var(--line); }
.legend2 { display: flex; gap: 16px; font-size: 12px; color: var(--ink-2); margin-bottom: 10px; }
.legend2 i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.post-r { padding: 14px 0; border-top: 1px solid var(--line); }
.post-r:first-child { border-top: 0; padding-top: 0; }
.post-r b { font-weight: 600; display: block; margin-bottom: 6px; }
.post-r .nums { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-3); }
.post-r .nums strong { color: var(--ink); font-weight: 600; }
.why { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.why span { font-size: 12px; padding: 4px 10px; border-radius: 100px; }

@keyframes slide { from { opacity: 0; transform: translateX(24px); } }

.loading { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; color: var(--ink-3); }

  if (e.nivel === 'warn') return { t: 'Estoque curto', k: 'warn' };
  if (f.real < f.meta * 0.8) return { t: 'Abaixo da meta', k: 'warn' };
  return { t: 'Em dia', k: 'ok' };
}

// ---------- casca ----------
async function iniciar() {
  try {
    const d = await call('carregar');
    if (d.semAcesso) {
      $('#app').innerHTML = '<div class="gate"><span class="brand-mark" style="margin:0 auto">S</span><div class="h1">Você ainda não tem <i>acesso</i>.</div><p class="lede">Peça para um admin incluir ' + (d.email ? '<b>' + esc(d.email) + '</b>' : 'o seu e-mail') + ' na equipe do Seok Social.</p></div>';
      return;
    }
    S.d = d; S.mes = d.hoje.slice(0, 7);
    d.clientes.forEach(function (c) { S.filtroCal[c.id] = true; });
    casca(); ir('geral');
  } catch (e) {
    $('#app').innerHTML = '<div class="gate"><div class="h1">Não deu para abrir.</div><p class="lede">' + esc(e.message) + '</p><p><button class="btn" onclick="location.reload()">Tentar de novo</button></p></div>';

}

  return '<div class="head"><div><span class="eyebrow">' + esc(dt(d.hoje).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' })) + '</span>' +
      '<h1 class="h1">' + (h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite') + ', <i>' + esc(d.eu.nome.split(' ')[0]) + '</i>.</h1>' +
      '<p class="lede">' + (criticos.length ? (criticos.length === 1 ? '1 cliente pede' : criticos.length + ' clientes pedem') + ' atenção hoje: ' + criticos.map(function (c) { return esc(c.nome) + ' <span class="muted">(' + esc(saude(c).t.toLowerCase()) + ')</span>'; }).join(', ') + '.' : 'Todos os clientes estão em dia. Bom ritmo.') + '</p></div>' +

    '<div class="stats">' +
      '<div class="stat"><span class="eyebrow">Nesta semana</span><b class="num">' + semanaPosts.length + '</b><small>' + semanaPosts.filter(function (p) { return p.status === 'publicado'; }).length + ' publicados até agora</small></div>' +
      '<div class="stat"><span class="eyebrow">Com o cliente</span><b class="num">' + aprov + '</b><small>aguardando aprovação</small></div>' +

      '<div class="stat ' + (criticos.length ? 'warn' : '') + '"><span class="eyebrow">Pedem atenção</span><b class="num">' + criticos.length + '</b><small>estoque, frequência ou prazo</small></div>' +

function cartaoCliente(c) {
  const f = freq(c), e = estoque(c), prox = proximo(c), s = saude(c), reps = reportsDe(c.id), r = reps[reps.length - 1], ra = reps[reps.length - 2];
  const maxS = Math.max.apply(null, f.sem.concat([f.meta, 1]));
  const pctRun = Math.min(100, Math.round(e.cobre * 100 / 28));
  const kFreq = '<div class="cc-kpi"><div class="lab">Frequência</div><div class="val num">' + n(f.real, 1) + (f.meta ? ' <small>/ ' + n(f.meta, 1) + ' por semana</small>' : ' <small>por semana</small>') + '</div>' +
    '<div class="spark" title="Posts publicados nas últimas 8 semanas">' + f.sem.map(function (v) { return '<i class="' + (f.meta && v >= f.meta ? 'on' : '') + '" style="height:' + Math.max(8, v * 100 / maxS) + '%"></i>'; }).join('') + '</div></div>';
  const kEst = '<div class="cc-kpi"><div class="lab">Estoque</div><div class="val num">' + e.prontos + ' <small>' + (e.prontos === 1 ? 'pronto' : 'prontos') + '</small></div>' +
    (e.ate ? '<div class="sub ' + (e.nivel === 'ok' ? '' : e.nivel) + '">cobre até ' + curto(e.ate) + '</div>' : '<div class="sub ' + (c.frequencia ? 'bad' : '') + '">' + (c.frequencia ? 'sem posts prontos' : 'sem meta definida') + '</div>') +
    '<div class="runway"><i class="' + (e.nivel === 'ok' ? '' : e.nivel) + '" style="width:' + pctRun + '%"></i></div></div>';
  const kProx = '<div class="cc-kpi"><div class="lab">Próximo post</div>' + (prox ? '<div class="val" style="font-size:17px">' + esc(semana(prox.data)) + '</div><div class="sub">' + esc(prox.formato + ' · ' + prox.titulo) + '</div>' :
    '<div class="val" style="font-size:17px;color:var(--ink-3)">—</div><div class="sub">nada programado</div>') + '</div>';
  const foco = focos(c).slice(0, 2);
  const res = r ? '<span>Seguidores <b class="num">' + nc(r.seguidores) + '</b>' + (ra && ra.seguidores ? ' <span class="' + (r.seguidores >= ra.seguidores ? 'up' : 'down') + '">' + (r.seguidores >= ra.seguidores ? '▲' : '▼') + ' ' + n(Math.abs((r.seguidores - ra.seguidores) * 100 / ra.seguidores), 1) + '%</span>' : '') + '</span>' +
      (r.alcanceOrganico || r.alcancePago ? '<span>Orgânico <b class="num">' + n(r.alcanceOrganico * 100 / Math.max(1, r.alcance || (r.alcanceOrganico + r.alcancePago)), 1) + '%</b></span>' : '') :
    '<span>Sem relatório da Reportei ainda</span>';
  return '<button type="button" class="cc" data-abrir="' + esc(c.id) + '" style="--c:' + esc(c.cor) + '">' +
    '<div class="cc-top">' + avatar(c) + '<div class="nm"><b>' + esc(c.nome) + '</b><small>' + esc(c.nicho || c.obs || 'Nicho a definir') + '</small></div>' +
      '<span class="chip ' + s.k + '"><i class="d"></i>' + s.t + '</span></div>' +
    '<div class="cc-kpis">' + kFreq + kEst + kProx + '</div>' +
    '<div class="cc-focus">' + (foco.length ? foco.join('') : '<div class="focus"><span class="ic">' + ic('idea') + '</span><span class="tx"><b>' + esc(c.obs || 'Tudo em ordem') + '</b><small>Nenhum ponto de foco agora.</small></span></div>') + '</div>' +
    '<div class="cc-foot">' + (r ? '<span>' + esc(mesNome(r.mes).split(' ')[0]) + '</span>' : '') + res + '<span class="go">Abrir ' + ic('arrow') + '</span></div></button>';
}

// O que cada cliente tem de mais importante agora, conforme os blocos dele.
function focos(c) {
  const out = [], b = c.blocos || [], hoje = S.d.hoje;
  if (b.indexOf('eventos') >= 0) {
    const ev = S.d.eventos.filter(function (e) { return e.clienteId === c.id && e.inicio.slice(0, 10) >= hoje; }).sort(function (a, x) { return a.inicio < x.inicio ? -1 : 1; })[0];
    const pecas = c.entregasEvento || [];
    if (ev) {
      const feitas = pecas.filter(function (t) { return (ev.entregas || {})[t]; }).length;
      out.push('<div class="focus"><span class="ic">' + ic('people') + '</span><span class="tx"><b>' + esc(ev.titulo) + '</b><small>' + esc(semana(ev.inicio)) + ' · ' + feitas + ' de ' + pecas.length + ' peças na pauta</small>' +
        '<div class="pecas">' + pecas.map(function (t) { return '<i class="' + ((ev.entregas || {})[t] ? 'on' : '') + '" title="' + esc(t) + '"></i>'; }).join('') + '</div></span><span class="chip accent tag">' + ev.pax + ' PAX</span></div>');
    } else out.push('<div class="focus"><span class="ic">' + ic('people') + '</span><span class="tx"><b>Nenhum treinamento futuro</b><small>Sincronize a agenda na página do cliente.</small></span></div>');
  }
  if (b.indexOf('cases') >= 0) {
    const fila = S.d.temas.filter(function (t) { return t.clienteId === c.id && t.tipo === 'case' && t.status === 'aberto'; }).sort(function (a, x) { return a.ordem - x.ordem; });
    out.push('<div class="focus"><span class="ic">' + ic('stack') + '</span><span class="tx"><b>' + (fila[0] ? 'Próximo case: ' + esc(fila[0].titulo) : 'Fila de cases vazia') + '</b><small>' + fila.length + ' na fila</small></span></div>');
  }
  if (b.indexOf('pedidos') >= 0) {
    const ps = S.d.pedidos.filter(function (p) { return p.clienteId === c.id && p.status === 'aberto'; }).sort(function (a, x) { return (a.prazo || '9') < (x.prazo || '9') ? -1 : 1; });
    if (ps.length) out.push('<div class="focus"><span class="ic">' + ic('inbox') + '</span><span class="tx"><b>' + esc(ps[0].titulo) + '</b><small>' + (ps.length === 1 ? '1 pedido aberto' : ps.length + ' pedidos abertos') + (ps[0].prazo ? ' · prazo ' + curto(ps[0].prazo) : '') + '</small></span>' +
      (ps[0].prazo && ps[0].prazo < hoje ? '<span class="chip bad tag">atrasado</span>' : ps[0].prioridade === 'alta' ? '<span class="chip warn tag">alta</span>' : '') + '</div>');
  }
  if (b.indexOf('temas') >= 0) {
    const t = S.d.temas.filter(function (x) { return x.clienteId === c.id && x.tipo === 'tema' && x.status === 'aberto'; });
    out.push('<div class="focus"><span class="ic">' + ic('idea') + '</span><span class="tx"><b>' + (t[0] ? esc(t[0].titulo) : 'Nenhum tema mapeado') + '</b><small>' + t.length + ' tema(s) que o cliente vê valor</small></span></div>');
  }
  if (b.indexOf('tendencias') >= 0) {
    const t = S.d.temas.filter(function (x) { return x.clienteId === c.id && x.tipo === 'tendencia' && x.status === 'aberto'; }).sort(function (a, x) { return x.criadoEm < a.criadoEm ? -1 : 1; });
    out.push('<div class="focus"><span class="ic">' + ic('trend') + '</span><span class="tx"><b>' + (t[0] ? esc(t[0].titulo) : 'Pesquise as tendências do nicho') + '</b><small>' + (t[0] ? esc(t[0].fonte || 'tendência') : esc(c.nicho || 'nicho a definir')) + '</small></span></div>');
  }
  return out;
}

      '<p class="lede">' + esc(c.objetivo || c.obs || 'Defina o objetivo nos ajustes do cliente.') + '</p></div>' +

function tVisao(c) {
  // Frequência abre a página ao lado do estoque (ou dos próximos posts, quando o cliente não controla estoque).
  const b = c.blocos || [], tem = function (k) { return b.indexOf(k) >= 0; }, P = [];
  if (tem('frequencia')) P.push(pFrequencia(c));
  if (tem('estoque')) P.push(pEstoque(c)); else P.push(pProximos(c));
  if (tem('eventos')) P.push(pEventos(c));
  if (tem('cases')) P.push(pTemas(c, 'case'));
  if (tem('temas')) P.push(pTemas(c, 'tema'));
  if (tem('tendencias')) P.push(pTendencias(c));
  if (tem('pedidos')) P.push(pPedidos(c));
  if (tem('estoque')) P.push(pProximos(c));
  return '<div class="panels">' + P.join('') + '</div>';
}

function pFrequencia(c) {
  const f = freq(c), max = Math.max.apply(null, f.sem.concat([f.meta, 1]));
  const W = 360, H = 120;
  const barras = f.sem.map(function (v, i) {
    const h = Math.max(2, v * (H - 30) / max), x = 6 + i * (W - 12) / 8, w = (W - 12) / 8 - 10;
    return '<g><title>' + v + ' post(s) na semana</title><rect x="' + x + '" y="' + (H - 18 - h) + '" width="' + w + '" height="' + h + '" rx="3" fill="' + (f.meta && v >= f.meta ? 'var(--accent)' : 'var(--ink-4)') + '"/>' +
      '<text x="' + (x + w / 2) + '" y="' + (H - 4) + '" text-anchor="middle">' + (i === 7 ? 'agora' : '-' + (7 - i) + 's') + '</text></g>';
  }).join('');
  const yMeta = f.meta ? H - 18 - f.meta * (H - 30) / max : 0;
  return '<section class="panel"><div class="panel-h"><h2 class="h2">Frequência</h2><small>últimas 8 semanas</small></div>' +
    '<div style="display:flex;align-items:baseline;gap:10px"><span class="big num">' + n(f.real, 1) + '</span><span style="color:var(--ink-3)">posts por semana · média de 4 semanas</span></div>' +
    '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" style="margin-top:14px">' + barras + (f.meta ? '<line x1="0" x2="' + W + '" y1="' + yMeta + '" y2="' + yMeta + '" stroke="var(--warn)" stroke-dasharray="4 4"/><text x="' + W + '" y="' + (yMeta - 5) + '" text-anchor="end" class="v">meta ' + n(f.meta, 1) + '</text>' : '') + '</svg>' +
    (pode('editor') ? '<div class="meta-line"><span style="color:var(--ink-2);font-size:13px">Meta por semana</span><input class="input num" style="width:90px" type="number" min="0" max="30" step="0.5" id="meta-' + esc(c.id) + '" value="' + esc(c.frequencia || '') + '"><button class="btn sm" data-meta="' + esc(c.id) + '">Salvar</button></div>' : '') + '</section>';
}

function pEstoque(c) {
  const e = estoque(c);
  return '<section class="panel"><div class="panel-h"><h2 class="h2">Estoque de posts</h2><small>do que já está pronto</small></div>' +
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">' +
      '<div><span class="eyebrow">Prontos</span><div class="big num" style="font-size:44px;margin-top:8px">' + e.prontos + '</div><small style="color:var(--ink-3)">aprovação + agendados</small></div>' +
      '<div><span class="eyebrow">Agendados</span><div class="big num" style="font-size:44px;margin-top:8px">' + e.agendados + '</div><small style="color:var(--ink-3)">já na rede</small></div>' +
      '<div><span class="eyebrow">Em produção</span><div class="big num" style="font-size:44px;margin-top:8px">' + e.producao + '</div><small style="color:var(--ink-3)">ideia + produção</small></div></div>' +
    (e.ate ? '<div class="alert ' + (e.nivel === 'ok' ? '' : e.nivel) + '">' + ic(e.nivel === 'ok' ? 'check' : 'alert') + '<span>Posts prontos até <b>' + curto(e.ate) + '</b> (' + e.cobre + ' dias). ' +
      (e.nivel === 'ok' ? 'Comece o próximo lote até <b>' + curto(e.produzirAte) + '</b>.' : '<b>Produza o próximo lote agora</b> — a antecedência é de ' + (c.antecedencia || 7) + ' dias.') + '</span></div>'
      : '<div class="alert ' + (c.frequencia ? 'bad' : '') + '">' + ic('alert') + '<span>' + (c.frequencia ? 'Nenhum post pronto para os próximos dias. <b>Produza hoje.</b>' : 'Defina a meta de frequência para acompanhar o estoque.') + '</span></div>') + '</section>';
}

function peca(e, t) {
  const pid = (e.entregas || {})[t], p = pid && S.d.posts.find(function (x) { return x.id === pid; });
  if (!p) return pode('editor') ? '<button class="peca" data-peca="' + esc(e.id) + '" data-tipo="' + esc(t) + '">' + ic('plus') + esc(t) + '</button>' : '<span class="peca">' + esc(t) + '</span>';
  const links = (p.linkPost ? ' · <a href="' + esc(p.linkPost) + '" target="_blank" rel="noopener">' + (p.rede === 'LinkedIn' ? 'LinkedIn' : 'Instagram') + '</a>' : '') + (p.linkDrive ? ' · <a href="' + esc(p.linkDrive) + '" target="_blank" rel="noopener">Drive</a>' : '');
  return '<span class="peca tem ' + (p.status === 'publicado' ? 'feita' : '') + '" data-post="' + esc(p.id) + '">' + (p.status === 'publicado' ? ic('check') : '') + esc(t) + ' · ' + esc(NOME_ST[p.status]) + links + '</span>';
}

function evHtml(e, c) {
  const d = dt(e.inicio.slice(0, 10));
  return '<div class="ev"><div class="day"><b>' + d.getDate() + '</b><small>' + d.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '') + '</small></div><div>' +
    '<div class="t"><b>' + esc(e.titulo) + '</b><span class="chip accent">' + e.pax + ' PAX</span></div>' +
    '<small class="m">' + esc(d.toLocaleDateString('pt-BR', { weekday: 'long' })) + ' · ' + esc(new Date(e.inicio).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })) + (e.local ? ' · ' + esc(e.local) : '') + '</small>' +
    '<div class="pecas-row">' + (c.entregasEvento || []).map(function (t) { return peca(e, t); }).join('') + '</div></div></div>';
}

function pEventos(c) {
  const hoje = S.d.hoje, evs = S.d.eventos.filter(function (e) { return e.clienteId === c.id; }).sort(function (a, b) { return a.inicio < b.inicio ? -1 : 1; });
  const prox = evs.filter(function (e) { return e.inicio.slice(0, 10) >= hoje; }), pass = evs.filter(function (e) { return e.inicio.slice(0, 10) < hoje; }).reverse();
  const doMes = prox.filter(function (e) { return e.inicio.slice(0, 7) === hoje.slice(0, 7); }).length;
  const sinc = evs.reduce(function (m, e) { return e.sincronizadoEm > m ? e.sincronizadoEm : m; }, '');
  return '<section class="panel wide"><div class="panel-h"><h2 class="h2">Treinamentos</h2><small>' + doMes + ' neste mês · ' + (sinc ? 'agenda lida ' + br(sinc) : 'agenda ainda não lida') + '</small>' +

function calendario(ids, filtros) {
  const m = S.mes, primeiro = dt(m + '-01'), ini = addD(m + '-01', -primeiro.getDay());
  const vis = ids.filter(function (id) { return !filtros || S.filtroCal[id]; });
  const posts = S.d.posts.filter(function (p) { return p.data && vis.indexOf(p.clienteId) >= 0; });
  let cel = '';
  for (let i = 0; i < 42; i++) {
    const d = addD(ini, i), doDia = posts.filter(function (p) { return p.data === d; }).sort(function (a, b) { return (a.hora || '') < (b.hora || '') ? -1 : 1; });
    if (i >= 35 && d.slice(0, 7) !== m) break;
    cel += '<div class="d' + (d.slice(0, 7) !== m ? ' fora' : '') + (d === S.d.hoje ? ' hoje' : '') + '" data-dia="' + d + '"><span class="dn">' + dt(d).getDate() + '</span>' +
      doDia.slice(0, 4).map(function (p) { const c = cli(p.clienteId); return '<div class="pc ' + p.status + '" data-post="' + esc(p.id) + '" style="--c:' + esc(c.cor) + '" title="' + esc(c.nome + ' · ' + p.titulo + ' · ' + NOME_ST[p.status]) + '"><i class="st st-' + p.status + '"></i><b>' + esc(p.titulo) + '</b></div>'; }).join('') +
      (doDia.length > 4 ? '<span style="font-size:11.5px;color:var(--ink-3);padding:0 6px">+' + (doDia.length - 4) + '</span>' : '') + '</div>';
  }
  return '<div class="cal-bar"><button class="btn icon" data-mes="-1" aria-label="Mês anterior">' + ic('chevL') + '</button><span class="mes">' + esc(mesNome(m)) + '</span><button class="btn icon" data-mes="1" aria-label="Próximo mês">' + ic('chevR') + '</button>' +
      '<button class="btn ghost sm" data-mes="0">Hoje</button>' +
      (filtros ? '<div class="cal-filtros">' + S.d.clientes.map(function (c) { return '<button class="fchip" data-fcal="' + esc(c.id) + '" aria-pressed="' + !!S.filtroCal[c.id] + '"><i style="background:' + esc(c.cor) + '"></i>' + esc(c.nome) + '</button>'; }).join('') + '</div>' : '') + '</div>' +
    '<div class="cal">' + ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'].map(function (w) { return '<div class="wd">' + w + '</div>'; }).join('') + cel + '</div>' +
    '<div class="legend">' + S.d.listas.status.map(function (s) { return '<span><i class="st-' + s + '"></i>' + NOME_ST[s] + '</span>'; }).join('') + '</div>';
}

// Nota de cada post e o porquê (comparado à mediana do mês).
function avaliar(det) {
  const l = (det.posts || []).concat(det.reels || []).filter(function (p) { return p.alcance || p.visualizacoes; });
  if (!l.length) return [];
  const med = function (k) { const v = l.map(function (p) { return p[k] || 0; }).sort(function (a, b) { return a - b; }), m = Math.floor(v.length / 2); return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2; };
  const mt = med('taxa') || .01, ma = med('alcance') || 1;
  return l.map(function (p) {
    const g = [], r = [];
    if (l.length > 1 && p.taxa >= mt * 1.25) g.push('Taxa de ' + n(p.taxa, 1) + '%, acima da mediana');
    if (l.length > 1 && p.alcance >= ma * 1.5) g.push('Alcance bem acima da mediana');
    if (p.salvos >= 3) g.push(n(p.salvos) + ' salvamentos: conteúdo útil');
    if (p.compartilhamentos >= 3) g.push(n(p.compartilhamentos) + ' compartilhamentos');
    if (p.comentarios >= 3) g.push(n(p.comentarios) + ' comentários');
    if (l.length > 1 && p.taxa <= mt * .6) r.push('Taxa abaixo da mediana');
    if (l.length > 1 && p.alcance <= ma * .5) r.push('Pouca distribuição');
    if (!p.salvos && !p.compartilhamentos) r.push('Sem salvamentos nem compartilhamentos');
    if (!p.comentarios && p.alcance >= 50) r.push('Sem comentários: faltou uma pergunta');
    return Object.assign({}, p, { g: g, r: r, nota: (p.taxa / mt + p.alcance / ma) / 2 + (p.salvos + p.compartilhamentos) / Math.max(20, p.alcance) * 5 });
  }).sort(function (a, b) { return b.nota - a.nota; });
}

function postR(p, k) {
  const m = (k === 'g' ? p.g : p.r).slice(0, 3);
  if (!m.length) m.push(k === 'g' ? 'Melhor resultado do mês' : 'Menor resultado do mês');
  return '<div class="post-r"><b>' + esc(p.legenda || 'Post') + '</b><div class="nums"><span>' + esc(p.tipo || 'Post') + '</span><span>Alcance <strong>' + n(p.alcance) + '</strong></span><span>Taxa <strong>' + n(p.taxa, 1) + '%</strong></span><span>Salvos <strong>' + n(p.salvos) + '</strong></span><span>Compart. <strong>' + n(p.compartilhamentos) + '</strong></span></div>' +
    '<div class="why">' + m.map(function (x) { return '<span class="' + k + '">' + esc(x) + '</span>'; }).join('') + '</div></div>';
}

function linha(reps) {
  if (reps.length < 2) return '<div class="empty">A evolução aparece a partir do segundo mês importado.</div>';
  const W = 520, H = 170, v = reps.map(function (r) { return r.seguidores; }), mn = Math.min.apply(null, v), mx = Math.max.apply(null, v), fx = mx - mn || 1;
  const x = function (i) { return 14 + i * (W - 40) / (v.length - 1); }, y = function (k) { return 20 + (H - 48) * (1 - (k - mn) / fx); };
  const pts = v.map(function (k, i) { return x(i) + ',' + y(k); }).join(' ');
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '"><line class="gl" x1="0" x2="' + W + '" y1="' + (H - 24) + '" y2="' + (H - 24) + '"/>' +
    '<polyline points="' + pts + '" fill="none" stroke="var(--org)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    v.map(function (k, i) { return '<g><title>' + esc(mesNome(reps[i].mes) + ': ' + n(k)) + '</title><circle cx="' + x(i) + '" cy="' + y(k) + '" r="14" fill="transparent"/><circle cx="' + x(i) + '" cy="' + y(k) + '" r="4" fill="var(--org)" stroke="var(--surface)" stroke-width="2"/>' +
      '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(mesNome(reps[i].mes).slice(0, 3)) + '</text>' + (i === v.length - 1 || i === 0 ? '<text class="v" x="' + x(i) + '" y="' + (y(k) - 10) + '" text-anchor="middle">' + nc(k) + '</text>' : '') + '</g>'; }).join('') + '</svg>';
}

function orgPago(reps) {
  if (!reps.length) return '<div class="empty">Os relatórios da Reportei trazem o alcance orgânico e o pago.</div>';
  const W = 520, H = 190, mx = Math.max.apply(null, reps.map(function (r) { return r.alcanceOrganico + r.alcancePago; }).concat([1])), w = Math.min(56, (W - 20) / reps.length - 16);
  return '<div class="legend2"><span><i style="background:var(--org)"></i>Orgânico</span><span><i style="background:var(--pago)"></i>Pago</span></div><svg class="chart" viewBox="0 0 ' + W + ' ' + H + '"><line class="gl" x1="0" x2="' + W + '" y1="' + (H - 22) + '" y2="' + (H - 22) + '"/>' +
    reps.map(function (r, i) {
      const cx = 10 + (i + .5) * (W - 20) / reps.length, b = H - 22, ho = (H - 50) * r.alcanceOrganico / mx, hp = (H - 50) * r.alcancePago / mx, pct = r.alcanceOrganico * 100 / Math.max(1, r.alcanceOrganico + r.alcancePago);
      return '<g><title>' + esc(mesNome(r.mes) + ' · orgânico ' + n(r.alcanceOrganico) + ' · pago ' + n(r.alcancePago)) + '</title>' +
        (ho ? '<rect x="' + (cx - w / 2) + '" y="' + (b - ho) + '" width="' + w + '" height="' + ho + '" rx="' + Math.min(4, ho / 2) + '" fill="var(--org)"/>' : '') +
        (hp ? '<rect x="' + (cx - w / 2) + '" y="' + (b - ho - hp - (ho ? 2 : 0)) + '" width="' + w + '" height="' + hp + '" rx="' + Math.min(4, hp / 2) + '" fill="var(--pago)"/>' : '') +
        '<text class="v" x="' + cx + '" y="' + (b - ho - hp - 8) + '" text-anchor="middle">' + n(pct, pct < 10 ? 1 : 0) + '% org.</text><text x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(mesNome(r.mes).slice(0, 3)) + '</text></g>';
    }).join('') + '</svg>';
}

function gaveta(o) {
  const layer = $('#layer');
  layer.innerHTML = '<div class="scrim" data-fechar></div><aside class="drawer" role="dialog" aria-modal="true"><div class="drawer-h"><div class="tx"><span class="eyebrow">' + esc(o.eyebrow || '') + '</span><h3>' + esc(o.titulo) + '</h3></div><button class="btn ghost icon" data-fechar aria-label="Fechar">' + ic('x') + '</button></div>' +
    '<div class="drawer-b">' + o.corpo + '</div><div class="drawer-f">' + (o.esq || '') + '<span style="flex:1"></span><button class="btn ghost" data-fechar>Cancelar</button>' + (o.ok ? '<button class="btn primary" data-ok>' + esc(o.ok) + '</button>' : '') + '</div></aside>';
  const fechar = function () { layer.innerHTML = ''; document.removeEventListener('keydown', tecla); };
  const tecla = function (e) { if (e.key === 'Escape') fechar(); };
  document.addEventListener('keydown', tecla);
  $$('[data-fechar]', layer).forEach(function (b) { b.onclick = fechar; });
  const f = $('input:not([type=hidden]):not([type=checkbox]), textarea', layer);
  if (f) setTimeout(function () { f.focus(); }, 60);
  return { el: layer, fechar: fechar };
}

// ---------- importar PDF da Reportei ----------
function pdfjs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise(function (ok, no) {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = function () { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok(window.pdfjsLib); };
    s.onerror = function () { no(new Error('leitor de PDF indisponível')); };
    document.head.appendChild(s);
  });
}
async function textoPdf(file) {
  const lib = await pdfjs(), doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  let t = '';
  for (let i = 1; i <= Math.min(doc.numPages, 40); i++) { const c = await (await doc.getPage(i)).getTextContent(); t += ' ' + c.items.map(function (x) { return x.str; }).join(' '); }
  return t.replace(/\s+/g, ' ');
}

function importar(clienteId) {
  let lido = null, pdf = null;
  const g = gaveta({ eyebrow: 'Reportei', titulo: 'Importar relatório', ok: 'Salvar relatório',
    corpo: '<label class="field"><span>Cliente</span><select id="imp-cli">' + opt(S.d.clientes.map(function (c) { return { v: c.id, t: c.nome }; }), clienteId || (S.d.clientes[0] || {}).id) + '</select></label>' +
      '<div class="drop" id="drop" tabindex="0"><b>Solte aqui o PDF da Reportei</b>ou clique para escolher. Lemos os números do Instagram e do LinkedIn, os posts, os stories e a análise.<input type="file" accept="application/pdf" id="arq" hidden><div class="ok" id="lido"></div></div>' +
      '<div id="previa"></div>' });
  const drop = $('#drop', g.el), arq = $('#arq', g.el);
  const usar = async function (file) {
    if (!file) return;
    $('#lido').style.color = ''; $('#lido').textContent = 'Lendo ' + file.name + '…';
    try {
      const x = await call('lerReportei', await textoPdf(file)), ig = x.instagram || {}, li = x.linkedin || {};
      lido = { mes: x.mes, periodoIni: x.periodoIni, periodoFim: x.periodoFim, seguidores: ig.seguidores, alcance: ig.alcance, alcanceOrganico: ig.alcanceOrganico, alcancePago: ig.alcancePago,
        visualizacoes: ig.visualizacoes, interacoes: ig.interacoes, visitasPerfil: ig.visitasPerfil, liSeguidores: li.seguidores, liImpressoes: li.impressoes, liAlcance: li.alcance, liPosts: li.posts,
        resumo: (x.analise[0] || {}).texto || '', detalhe: { posts: x.posts, reels: x.reels, stories: x.stories, cidades: x.cidades, analise: x.analise, linkedin: li.postagens || [] } };
      $('#lido').textContent = '✓ ' + file.name + ' lido: ' + (x.posts.length + x.reels.length) + ' post(s), ' + x.stories.length + ' stories' + (x.linkedin ? ', LinkedIn' : '') + ' e a análise.';
      $('#previa').innerHTML = '<div class="rk" style="grid-template-columns:repeat(2,1fr);margin:0"><div><span class="lab">Mês</span><b style="font-size:24px">' + esc(mesNome(x.mes)) + '</b></div><div><span class="lab">Seguidores</span><b class="num" style="font-size:24px">' + n(ig.seguidores) + '</b></div>' +
        '<div><span class="lab">Alcance orgânico</span><b class="num" style="font-size:24px">' + n(ig.alcanceOrganico) + '</b></div><div><span class="lab">Alcance pago</span><b class="num" style="font-size:24px">' + n(ig.alcancePago) + '</b></div></div>';
    } catch (e) { lido = null; $('#lido').style.color = 'var(--bad)'; $('#lido').textContent = e.message; }
    const fr = new FileReader(); fr.onload = function () { pdf = { nome: file.name, base64: String(fr.result).split(',')[1] }; }; fr.readAsDataURL(file);
  };
  drop.onclick = function (e) { if (e.target !== arq) arq.click(); };
  arq.onchange = function () { usar(arq.files[0]); };
  drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('on'); });
  drop.addEventListener('dragleave', function () { drop.classList.remove('on'); });
  drop.addEventListener('drop', function (e) { e.preventDefault(); drop.classList.remove('on'); usar(e.dataTransfer.files[0]); });
  $('[data-ok]', g.el).onclick = function () {
    if (!lido) return toast('Escolha o PDF da Reportei primeiro.', true);
    const d = Object.assign({ clienteId: $('#imp-cli').value, pdf: pdf }, lido);
    busy($('[data-ok]', g.el), async function () {
      const r = await save('salvarReport', [d], 'Relatório salvo.');
      if (r) { upsert('reports', r); g.fechar(); abrirCliente(r.clienteId, 'resultados'); }
    });
  };
}

function apresentar(id, mes) {
  const c = cli(id), reps = reportsDe(id);
  const m = mes || (reps.length ? reps[reps.length - 1].mes : addD(S.d.hoje.slice(0, 7) + '-01', -1).slice(0, 7));
  const r = reps.filter(function (x) { return x.mes === m; })[0], a = reps.filter(function (x) { return x.mes < m; }).pop();
  const nomeMes = mesNome(m), mesCurto = nomeMes.split(' ')[0];
  const pe = '<div class="pe"><span>' + esc(c.nome) + ' · ' + esc(nomeMes) + '</span><span>Seok Social</span></div>';
  const slide = function (k, h, corpo, cls) { return '<section class="slide ' + (cls || '') + '"><div class="k">' + k + '</div>' + (h ? '<h2>' + h + '</h2>' : '') + corpo + pe + '</section>'; };
  const ini = m + '-01', fimD = new Date(dt(ini).getFullYear(), dt(ini).getMonth() + 1, 0), fim = iso(fimD), diasMes = fimD.getDate();
  const doMes = postsDe(id).filter(function (p) { return p.data >= ini && p.data <= fim; }).sort(function (x, y) { return x.data < y.data ? -1 : 1; });
  const pubs = doMes.filter(function (p) { return p.status === 'publicado'; });
  const previstos = Math.round((c.frequencia || 0) * diasMes / 7);
  const semanas = []; for (let d = ini; d <= fim; d = addD(d, 7)) { const f = addD(d, 6) > fim ? fim : addD(d, 6); semanas.push({ ini: d, v: pubs.filter(function (p) { return p.data >= d && p.data <= f; }).length }); }
  const porFmt = {}; pubs.forEach(function (p) { porFmt[p.formato] = (porFmt[p.formato] || 0) + 1; });
  const S1 = slide('Reunião de resultados', esc(c.nome), '<div class="txt">' + esc(nomeMes) + (c.nicho ? ' · ' + esc(c.nicho) : '') + '</div>', 'capa');
  const S2 = slide('Estratégia', 'Para onde <i>estamos indo</i>',
    '<div class="grid2"><div><div class="lab">Objetivo</div><p class="txt" style="font-size:26px;color:var(--ink);font-family:var(--serif);line-height:1.3">' + esc(c.objetivo || 'Objetivo a definir com o cliente.') + '</p>' +
      (c.obs ? '<div class="lab" style="margin-top:28px">Estratégia</div><p class="txt">' + esc(c.obs) + '</p>' : '') + '</div>' +
    '<div><div class="lab">Frequência combinada</div><div class="big num">' + n(c.frequencia || 0, 1) + '<small> posts por semana</small></div>' +
      '<div class="lab" style="margin-top:28px">Linhas de conteúdo</div><p class="txt">' + esc(Object.keys(porFmt).length ? Object.keys(porFmt).map(function (f) { return f + ' (' + porFmt[f] + ')'; }).join(' · ') : 'Sem posts publicados no mês.') + '</p></div></div>');
  const maxW = Math.max.apply(null, semanas.map(function (w) { return w.v; }).concat([c.frequencia || 1, 1]));
  const barras = '<svg class="chart" viewBox="0 0 520 240">' + semanas.map(function (w, i) {
    const bw = 520 / semanas.length, h = 180 * w.v / maxW, x = i * bw + bw * .2;
    return '<rect x="' + x + '" y="' + (200 - h) + '" width="' + bw * .6 + '" height="' + Math.max(2, h) + '" rx="6" fill="' + (c.frequencia && w.v >= c.frequencia ? 'var(--accent)' : 'var(--ink-4)') + '"/><text class="v" x="' + (x + bw * .3) + '" y="' + (192 - h) + '" text-anchor="middle">' + w.v + '</text><text x="' + (x + bw * .3) + '" y="226" text-anchor="middle">sem ' + (i + 1) + '</text>';
  }).join('') + (c.frequencia ? '<line x1="0" x2="520" y1="' + (200 - 180 * c.frequencia / maxW) + '" y2="' + (200 - 180 * c.frequencia / maxW) + '" stroke="var(--warn)" stroke-dasharray="4 4"/>' : '') + '</svg>';
  const S3 = slide('Frequência', 'Entregamos <i>' + pubs.length + '</i>' + (previstos ? ' de ' + previstos + ' posts' : ' posts'),
    '<div class="grid2"><div><div class="big num">' + (previstos ? Math.round(pubs.length * 100 / previstos) : 0) + '<small>% do combinado</small></div><p class="txt" style="margin-top:20px">' +
      (previstos ? (pubs.length >= previstos ? 'Ritmo cumprido no mês.' : 'Ficamos ' + (previstos - pubs.length) + ' post' + (previstos - pubs.length > 1 ? 's' : '') + ' abaixo do combinado de ' + n(c.frequencia, 1) + ' por semana.') : 'Frequência ainda não definida.') + '</p></div><div>' + barras + '</div></div>');
  const S4 = slide('O que postamos', 'Cada post e <i>por quê</i>', pubs.length ? '<div class="lst">' + pubs.slice(0, 6).map(function (p) {
    return '<div><span class="num" style="color:var(--ink-3)">' + esc(semana(p.data)) + '</span><span><b style="font-weight:600">' + esc(p.titulo) + '</b> <span style="color:var(--ink-3)">· ' + esc(p.formato) + ' · ' + esc(p.rede) + '</span><small>' + esc(p.porque || 'Sem o porquê registrado.') + '</small></span></div>';
  }).join('') + (pubs.length > 6 ? '<div><span></span><small>e mais ' + (pubs.length - 6) + ' posts no mês</small></div>' : '') + '</div>' : '<p class="txt">Nenhum post publicado em ' + esc(mesCurto.toLowerCase()) + '.</p>');
  let S5 = '', S6 = '', S7;
  const leitura = [];
  if (r) {
    const tot = r.alcance || (r.alcanceOrganico + r.alcancePago), org = tot ? r.alcanceOrganico * 100 / tot : 0;
    const v = function (k) { if (!a || !a[k]) return '<small style="color:var(--ink-3)">' + esc(mesCurto) + '</small>'; const p = Math.round((r[k] - a[k]) * 1000 / a[k]) / 10; return '<small class="' + (p >= 0 ? 'up' : 'down') + '">' + (p >= 0 ? '▲ ' : '▼ ') + n(Math.abs(p), 1) + '%</small>'; };
    S5 = slide('Resultados · Reportei', 'Os números de <i>' + esc(mesCurto.toLowerCase()) + '</i>',
      '<div class="kpis"><div><span class="lab">Seguidores</span><b class="num">' + nc(r.seguidores) + '</b>' + v('seguidores') + '</div><div><span class="lab">Alcance orgânico</span><b class="num">' + nc(r.alcanceOrganico) + '</b><small style="color:var(--ink-3)">' + n(org, 1) + '% do total</small></div>' +
        '<div><span class="lab">Visualizações</span><b class="num">' + nc(r.visualizacoes) + '</b>' + v('visualizacoes') + '</div><div><span class="lab">Interações</span><b class="num">' + nc(r.interacoes) + '</b>' + v('interacoes') + '</div></div>' +
      '<div class="grid2"><div><div class="lab" style="margin-bottom:8px">Seguidores por mês</div>' + linha(reps.filter(function (x) { return x.mes <= m && x.seguidores; }).slice(-6)) + '</div><div><div class="lab" style="margin-bottom:8px">Alcance orgânico x pago</div>' + orgPago(reps.filter(function (x) { return x.mes <= m; }).slice(-4)) + '</div></div>');
    const av = avaliar(r.detalhe || {}), nb = Math.min(2, Math.ceil(av.length / 2));
    if (av.length) S6 = slide('Posts do mês', 'O que <i>funcionou</i> e o que não', '<div class="grid2"><div><div class="lab" style="margin-bottom:12px;color:var(--ok)">Deu certo</div>' + av.slice(0, nb).map(function (p) { return postR(p, 'g'); }).join('') + '</div>' +
      '<div><div class="lab" style="margin-bottom:12px;color:var(--warn)">Não funcionou</div>' + (av.length > 1 ? av.slice(nb).slice(-2).reverse().map(function (p) { return postR(p, 'r'); }).join('') : '<p class="txt">Com um post só não dá para comparar.</p>') + '</div></div>');
    if (a && a.seguidores) { const p = (r.seguidores - a.seguidores) * 100 / a.seguidores; leitura.push((p >= 0 ? 'Ganhamos ' : 'Perdemos ') + n(Math.abs(r.seguidores - a.seguidores)) + ' seguidores (' + (p >= 0 ? '+' : '−') + n(Math.abs(p), 1) + '%), chegando a ' + n(r.seguidores) + '.'); }
    if (tot) { const ao = a && (a.alcance || a.alcanceOrganico + a.alcancePago) ? a.alcanceOrganico * 100 / (a.alcance || a.alcanceOrganico + a.alcancePago) : null; leitura.push(n(org, 0) + '% do alcance veio do orgânico' + (ao != null ? ', contra ' + n(ao, 0) + '% no mês anterior.' : '.')); }
    if (av.length) leitura.push('O melhor post foi "' + av[0].legenda + '" (' + (av[0].tipo || 'post') + '): ' + (av[0].g[0] || 'melhor resultado do mês').toLowerCase() + '.');
    ((r.detalhe || {}).analise || []).forEach(function (x) { if (x.texto) leitura.push(x.texto); });
  }
  if (previstos) leitura.unshift('Publicamos ' + pubs.length + ' de ' + previstos + ' posts combinados no mês.');
  const acoes = r ? ((r.detalhe || {}).analise || []).reduce(function (x, y) { return x.concat(y.acoes || []); }, []) : [];
  S7 = slide('Leitura', 'O que os números <i>dizem</i>', '<div class="grid2"><div class="pts">' + (leitura.length ? leitura.slice(0, 5).map(function (t, i) { return '<div><span class="n">' + (i + 1) + '</span><span>' + esc(t) + '</span></div>'; }).join('') : '<p class="txt">Importe o PDF da Reportei para a leitura aparecer aqui.</p>') + '</div>' +
    '<div><div class="lab" style="margin-bottom:14px">Próximos passos</div><div class="pts">' + (acoes.length ? acoes.slice(0, 4).map(function (t) { return '<div><span class="n">' + ic('arrow') + '</span><span>' + esc(t) + '</span></div>'; }).join('') : '<p class="txt">Defina os próximos passos na reunião.</p>') + '</div></div></div>');
  const prox = postsDe(id).filter(function (p) { return p.data > fim && p.status !== 'publicado'; }).sort(function (x, y) { return x.data < y.data ? -1 : 1; });
  const evs = S.d.eventos.filter(function (e) { return e.clienteId === id && e.inicio.slice(0, 10) > fim; }).sort(function (x, y) { return x.inicio < y.inicio ? -1 : 1; });
  const S8 = slide('Próximo mês', 'O que <i>vem aí</i>', '<div class="grid2"><div><div class="lab" style="margin-bottom:8px">Na pauta</div><div class="lst">' + (prox.length ? prox.slice(0, 6).map(function (p) { return '<div><span class="num" style="color:var(--ink-3)">' + esc(semana(p.data)) + '</span><span>' + esc(p.titulo) + '<small>' + esc(p.formato + ' · ' + (NOME_ST[p.status] || p.status)) + '</small></span></div>'; }).join('') : '<p class="txt">Pauta a montar.</p>') + '</div></div>' +
    '<div>' + (evs.length ? '<div class="lab" style="margin-bottom:8px">Treinamentos</div><div class="lst">' + evs.slice(0, 4).map(function (e) { return '<div><span class="num" style="color:var(--ink-3)">' + esc(semana(e.inicio)) + '</span><span>' + esc(e.titulo) + '<small>' + n(e.pax) + ' PAX</small></span></div>'; }).join('') + '</div>' : '') +
      '<div class="lab" style="margin:' + (evs.length ? '24px' : '0') + ' 0 8px">Frequência</div><div class="big num" style="font-size:72px">' + n(c.frequencia || 0, 1) + '<small> por semana</small></div></div></div>');
  const slides = [S1, S2, S3, S4, S5, S6, S7, S8].filter(Boolean);
  const meses = reps.map(function (x) { return x.mes; }); if (meses.indexOf(m) < 0) meses.push(m);
  const el = $('#apres');
  el.innerHTML = '<div class="ap-bar"><span class="t">Apresentação</span><small>' + esc(c.nome) + '</small><select id="ap-mes" class="ap-sel">' + meses.sort().reverse().map(function (x) { return '<option value="' + x + '"' + (x === m ? ' selected' : '') + '>' + esc(mesNome(x)) + '</option>'; }).join('') + '</select>' +
    '<span class="sp"></span><small>← → para navegar</small><button class="btn" data-ap-print>' + ic('doc') + 'Salvar PDF</button><button class="btn ghost icon" data-ap-fechar aria-label="Fechar">' + ic('x') + '</button></div>' +
    '<div class="ap-stage" style="--c:' + esc(c.cor) + '">' + slides.join('') + '</div><div class="ap-dots">' + slides.map(function () { return '<i></i>'; }).join('') + '</div>';
  el.classList.add('on'); document.body.style.overflow = 'hidden';
  let i = 0;
  const ir = function (k) { i = Math.max(0, Math.min(slides.length - 1, k)); $$('.slide', el).forEach(function (s, j) { s.classList.toggle('on', j === i); }); $$('.ap-dots i', el).forEach(function (d, j) { d.classList.toggle('on', j === i); }); };
  const escala = function () { el.style.setProperty('--k', Math.min((innerWidth - 48) / 1280, (innerHeight - 110) / 720)); $('.ap-stage', el).style.setProperty('--k', el.style.getPropertyValue('--k')); };
  const fechar = function () { el.classList.remove('on'); el.innerHTML = ''; document.body.style.overflow = ''; removeEventListener('keydown', tecla); removeEventListener('resize', escala); };
  const tecla = function (e) { if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); ir(i + 1); } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') ir(i - 1); else if (e.key === 'Escape') fechar(); };
  addEventListener('keydown', tecla); addEventListener('resize', escala); escala(); ir(0);
  $('.ap-stage', el).onclick = function (e) { if (e.target.closest('a, button, select')) return; ir(e.clientX > innerWidth / 2 ? i + 1 : i - 1); };
  $('[data-ap-fechar]', el).onclick = fechar;
  $('[data-ap-print]', el).onclick = function () { window.print(); };
  $('#ap-mes', el).onchange = function () { removeEventListener('keydown', tecla); removeEventListener('resize', escala); apresentar(id, this.value); };
}

// ======================================================================================
// Cliques (delegados)
// ======================================================================================
document.addEventListener('click', function (e) {
  if (!S.d || e.target.closest('#layer')) return;
  const t = e.target, q = function (s) { return t.closest(s); };
  let x;
  if ((x = q('[data-abrir]'))) return abrirCliente(x.dataset.abrir);
  if ((x = q('[data-res]'))) return abrirCliente(x.dataset.res, 'resultados');
  if (q('[data-ir-geral]')) return ir('geral');
  if ((x = q('[data-tab]'))) { S.tab = x.dataset.tab; return render(); }
  if (q('[data-novo-post]')) return formPost({ clienteId: S.cli || undefined });
  if ((x = q('[data-post]'))) { if (q('a')) return; return formPost(S.d.posts.find(function (p) { return p.id === x.dataset.post; })); }
  if ((x = q('[data-mes]'))) { const k = Number(x.dataset.mes); if (!k) S.mes = S.d.hoje.slice(0, 7); else { const d = dt(S.mes + '-01'); d.setMonth(d.getMonth() + k); S.mes = iso(d).slice(0, 7); } return render(); }
  if ((x = q('[data-fcal]'))) { S.filtroCal[x.dataset.fcal] = !S.filtroCal[x.dataset.fcal]; return render(); }
  if ((x = q('[data-dia]')) && pode('editor')) return formPost({ data: x.dataset.dia, clienteId: S.cli || undefined });
  if ((x = q('[data-meta]'))) { const v = $('#meta-' + x.dataset.meta).value; return busy(x, async function () { const r = await save('salvarCliente', [{ id: x.dataset.meta, frequencia: v }], 'Meta salva.'); if (r) { upsert('clientes', r); render(); } }); }
  if ((x = q('[data-agenda]'))) return busy(x, async function () { const r = await save('sincronizarAgenda', [x.dataset.agenda]); if (r) { S.d.eventos = S.d.eventos.filter(function (ev) { return ev.clienteId !== x.dataset.agenda; }).concat(r); toast(r.length ? r.length + ' treinamento(s) com PAX na agenda.' : 'Nenhum evento com PAX encontrado.'); render(); } });
  if ((x = q('[data-peca]'))) return busy(x, async function () { const r = await save('criarPeca', [x.dataset.peca, x.dataset.tipo], x.dataset.tipo + ' na pauta.'); if (r) { upsert('eventos', r.evento); upsert('posts', r.post); render(); } });
  if ((x = q('[data-novo-tema]'))) return formTema({ clienteId: S.cli, tipo: x.dataset.novoTema });
  if ((x = q('[data-ed-tema]'))) return formTema(S.d.temas.find(function (y) { return y.id === x.dataset.edTema; }));
  if ((x = q('[data-pauta]'))) { const tm = S.d.temas.find(function (y) { return y.id === x.dataset.pauta; }); return paraPauta(tm.titulo, 'temaParaPauta', tm.id); }
  if ((x = q('[data-sobe]')) || (x = q('[data-desce]'))) {
    const id = x.dataset.sobe || x.dataset.desce, passo = x.dataset.sobe ? -1 : 1, tm = S.d.temas.find(function (y) { return y.id === id; });
    const fila = S.d.temas.filter(function (y) { return y.clienteId === tm.clienteId && y.tipo === tm.tipo && y.status === 'aberto'; }).sort(function (a, b) { return a.ordem - b.ordem; });
    const i = fila.indexOf(tm); fila.splice(i, 1); fila.splice(i + passo, 0, tm);
    return save('ordenarTemas', [fila.map(function (y) { return y.id; })]).then(function (r) { if (r) { r.forEach(function (y) { upsert('temas', y); }); render(); } });
  }
  if ((x = q('[data-tend]'))) return busy(x, async function () { x.textContent = 'Pesquisando…'; const r = await save('pesquisarTendencias', [x.dataset.tend]); if (r) { r.novos.forEach(function (y) { S.d.temas.push(y); }); toast(r.novos.length ? r.novos.length + ' tendência(s) nova(s).' : 'Nada novo desde a última pesquisa.'); render(); } });
  if (q('[data-novo-pedido]')) return formPedido({ clienteId: S.cli });
  if ((x = q('[data-ed-pedido]'))) return formPedido(S.d.pedidos.find(function (y) { return y.id === x.dataset.edPedido; }));
  if ((x = q('[data-ped-pauta]'))) { const p = S.d.pedidos.find(function (y) { return y.id === x.dataset.pedPauta; }); return paraPauta(p.titulo, 'pedidoParaPauta', p.id); }
  if ((x = q('[data-importar]'))) return importar(x.dataset.importar || S.cli);
  if ((x = q('[data-apres]'))) return apresentar(x.dataset.apres);
  if ((x = q('[data-salvar-cli]'))) {
    const d = form($('#f-cli')); d.id = x.dataset.salvarCli;
    d.blocos = $$('[data-bloco]').filter(function (c) { return c.checked; }).map(function (c) { return c.dataset.bloco; });
    d.entregasEvento = String(d.entregasEvento || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    return busy(x, async function () { const r = await save('salvarCliente', [d], 'Ajustes salvos.'); if (r) { upsert('clientes', r); casca(); marcarNav(); render(); } });
  }
  if ((x = q('[data-salvar-aj]'))) return busy(x, async function () { const r = await save('salvarAjustes', [{ linkAberto: $('#aj-link').checked, chaveIA: $('#aj-chave').value || null }], 'Ajustes salvos.'); if (r) { S.d.ajustes = r; render(); } });
  if ((x = q('[data-apagar-chave]'))) return busy(x, async function () { const r = await save('salvarAjustes', [{ chaveIA: '', apagarChave: true }], 'Chave removida.'); if (r) { S.d.ajustes = r; render(); } });
  if ((x = q('[data-add-membro]'))) return busy(x, async function () { const r = await save('salvarMembro', [form($('#f-membro'))], 'Pessoa adicionada.'); if (r) { S.d.equipe = r; render(); } });
});

iniciar();
</script>
