<style>
/* =========================================================================================
   Seok Social · design "Performance"
   Modo claro com energia de academia premium: giz quente de fundo, tinta floresta da Seok, verde-pinho como ação,
   e três tons de treino usados com parcimônia — volt (energia, só sobre o escuro ou em fundos), brasa (esforço, alerta)
   e pulso (recuperação, mídia paga). Cor do cliente só como assinatura. Títulos em Archivo largo: leve + negrito.
   Gráficos: orgânico = verde #3D7A3F, pago = azul #2A84C2 (par validado para daltonismo).
   ========================================================================================= */
:root {
  --bg: #F4F3EE; --surface: #FFFFFF; --surface-2: #FAFAF6; --sunken: #EEEDE6;
  --ink: #141A0F; --ink-2: #474E3F; --ink-3: #7E8477; --ink-4: #B7BAAF;
  --line: rgba(20, 26, 15, .08); --line-2: rgba(20, 26, 15, .14);
  --forest: #141A0F; --forest-2: #1C2616; --pine: #23432A; --leaf: #3F5B2E; --sage: #C5DBAE; --cream: #F7F3EC; --copper: #A9511F;
  --volt: #D4F25A; --volt-2: #C3E842; --volt-soft: #F1FAD2;
  --ember: #D8692E; --ember-soft: #FBEADF; --pulse: #2A84C2; --pulse-soft: #E3F0F9; --plum: #8B5CC9; --gold: #A88A1E;
  --accent: #23432A; --accent-2: #2E5736; --accent-soft: #E6EFE0; --accent-ink: #23432A;
  --warn: #C25A1F; --warn-soft: #FBEADF; --bad: #BE3A28; --bad-soft: #F9E3DE; --ok: #2F7A3F; --ok-soft: #E3F1E4;
  --org: #3D7A3F; --pago: #2A84C2;
  --r: 18px; --r-sm: 12px;
  --shadow: 0 1px 2px rgba(20, 26, 15, .04), 0 2px 8px -4px rgba(20, 26, 15, .06);
  --shadow-hover: 0 2px 4px rgba(20, 26, 15, .04), 0 18px 40px -18px rgba(20, 26, 15, .28);
  --shadow-pop: 0 30px 70px -24px rgba(20, 26, 15, .40), 0 2px 6px rgba(20, 26, 15, .06);
  --sans: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --serif: 'Archivo', 'Manrope', system-ui, sans-serif;
  --display: 'Archivo', 'Manrope', system-ui, sans-serif;
  --top: 64px;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(900px 480px at 100% 0%, rgba(212, 242, 90, .16), transparent 60%), radial-gradient(800px 520px at 0% 100%, rgba(63, 91, 46, .07), transparent 60%); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
svg { display: block; }
.num { font-variant-numeric: tabular-nums; }
.hide { display: none !important; }
::selection { background: var(--volt); color: var(--forest); }

/* ---------- barra superior (como no Seok Flow) ---------- */
.topbar { position: fixed; z-index: 30; inset: 0 0 auto 0; height: var(--top); display: flex; align-items: center; gap: 16px; padding: 0 20px 0 22px;
  background: rgba(255, 255, 255, .82); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
.topbar::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: linear-gradient(90deg, var(--leaf), var(--volt) 40%, transparent 85%); opacity: .7; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; }
.logo-seok { width: 58px; height: 30px; flex: none; background: var(--forest); -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat; }
.brand .sep { width: 1px; height: 30px; background: var(--leaf); opacity: .6; }
.brand b { display: block; font: 600 17px/1.1 var(--display); font-stretch: 108%; letter-spacing: -.01em; text-align: left; }
.brand small { display: block; font: 700 10px/1.2 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3); margin-top: 3px; text-align: left; }
.top-sp { flex: 1; }
.top-acts { display: flex; align-items: center; gap: 14px; }
.time { display: flex; align-items: center; }
.time .pessoa { margin-left: -8px; box-shadow: 0 0 0 2px var(--surface); }
.time .pessoa:first-child { margin-left: 0; }
.time .mais { margin-left: -8px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--sunken); color: var(--ink-2); font: 700 11px var(--sans); box-shadow: 0 0 0 2px var(--surface); }
.top-div { width: 1px; height: 28px; background: var(--line-2); }
.eu { display: flex; align-items: center; gap: 10px; text-align: right; }
.eu b { display: block; font: 700 13px/1.2 var(--sans); }
.eu small { display: block; font-size: 11.5px; color: var(--ink-3); }
.pessoa { position: relative; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 700 11px/1 var(--sans); letter-spacing: .02em; flex: none; }
.pessoa.g { width: 36px; height: 36px; font-size: 12.5px; }
.pessoa.xg { width: 72px; height: 72px; font-size: 22px; }
.pessoa img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
.eu { border: 0; background: none; padding: 4px 4px 4px 10px; border-radius: 100px; cursor: pointer; font: inherit; color: inherit; transition: background .15s; }
.eu:hover { background: var(--sunken); }
.row > .pessoa { flex: none; }
.pessoa.on::after { content: ''; position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 50%; background: #3DBE5A; box-shadow: 0 0 0 2px var(--surface); }

/* ---------- estrutura ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; padding-top: var(--top); }
.side { position: sticky; top: var(--top); height: calc(100vh - var(--top)); overflow-y: auto; display: flex; flex-direction: column; padding: 20px 14px 18px; border-right: 1px solid var(--line); background: rgba(255, 255, 255, .55); }
.nav { display: grid; gap: 2px; }
.nav-sec { font: 700 10px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-4); padding: 22px 12px 10px; }
.nav button { position: relative; display: flex; align-items: center; gap: 11px; width: 100%; min-height: 38px; padding: 6px 12px; border: 0; border-radius: 11px; background: none; color: var(--ink-2); cursor: pointer; text-align: left; font-weight: 600; font-size: 13.5px; transition: background .15s, color .15s; }
.nav button:hover { background: var(--sunken); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav button[aria-current="page"]::before { content: ''; position: absolute; left: -14px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--leaf); }
.nav button svg { width: 18px; height: 18px; color: var(--ink-3); flex: none; }
.nav button[aria-current="page"] svg { color: var(--accent); }
.nav .dot { width: 9px; height: 9px; border-radius: 3px; margin: 0 4px; flex: none; }
.nav .badge { margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; display: grid; place-items: center; font: 800 10.5px/1 var(--sans); color: #fff; background: var(--ember); }
.nav .badge:empty { display: none; }
.side-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); }
.side-ver { font: 700 10px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-4); padding: 14px 12px 0; }
.main { min-width: 0; }
.page { max-width: 1340px; margin: 0 auto; padding: 32px 40px 80px; }

/* ---------- tipografia de página ---------- */
.eyebrow { font: 700 10.5px/1.2 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); }
.h1 { font: 300 44px/1.04 var(--display); font-stretch: 112%; letter-spacing: -.025em; margin: 12px 0 10px; }
.h1 i, .h1 b { font-style: normal; font-weight: 650; color: var(--accent); }
.lede .muted { color: var(--ink-3); }
.lede { color: var(--ink-2); font-size: 15px; max-width: 66ch; margin: 0; }
.head { display: flex; align-items: flex-end; gap: 24px; margin-bottom: 28px; flex-wrap: wrap; }
.head > div:first-child { flex: 1; min-width: 260px; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.h2 { font: 700 15.5px/1.3 var(--sans); letter-spacing: -.01em; margin: 0; }
.sec { display: flex; align-items: baseline; gap: 12px; margin: 40px 0 16px; flex-wrap: wrap; }
.sec .h2 { font: 400 24px/1.1 var(--display); font-stretch: 110%; letter-spacing: -.02em; }
.sec .h2 b { font-weight: 650; }
.sec small { color: var(--ink-3); }
.sec .grow { flex: 1; }

/* ---------- botões, campos ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 0 16px; border-radius: 11px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 700; font-size: 13.5px; cursor: pointer; white-space: nowrap; text-decoration: none; transition: background .15s, border-color .15s, box-shadow .15s, transform .1s; }
.btn:hover { border-color: rgba(20, 26, 15, .26); box-shadow: var(--shadow); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--pine); border-color: var(--pine); color: #F4F7EE; box-shadow: 0 6px 16px -8px rgba(35, 67, 42, .7); }
.btn.primary:hover { background: var(--accent-2); }
.btn.volt { background: var(--volt); border-color: var(--volt); color: var(--forest); }
.btn.volt:hover { background: var(--volt-2); }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); box-shadow: none; }
.btn.ghost:hover { background: var(--sunken); }
.btn.glass { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .16); color: #F2F5EC; }
.btn.glass:hover { background: rgba(255, 255, 255, .14); }
.btn.sm { min-height: 32px; padding: 0 12px; font-size: 12.5px; border-radius: 9px; }
.btn.icon { width: 36px; padding: 0; }
.btn.sm.icon { width: 32px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; pointer-events: none; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.field small { font-size: 12px; color: var(--ink-3); }
.input, .field input, .field select, .field textarea { width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 11px; background: var(--surface); outline: none; transition: border-color .15s, box-shadow .15s; }
.field textarea { height: auto; min-height: 88px; padding: 10px 12px; resize: vertical; line-height: 1.5; }
.input:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--leaf); box-shadow: 0 0 0 4px rgba(212, 242, 90, .45); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.full { grid-column: 1 / -1; }
.seg { display: inline-flex; flex-wrap: wrap; padding: 3px; gap: 2px; border-radius: 12px; background: var(--sunken); }
.seg button { min-height: 32px; padding: 0 14px; border: 0; border-radius: 9px; background: none; color: var(--ink-2); font-weight: 700; font-size: 13px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 2px 10px; border-radius: 100px; font-size: 11.5px; font-weight: 700; background: var(--sunken); color: var(--ink-2); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.accent { background: var(--accent-soft); color: var(--accent-ink); }
.chip.volt { background: var(--volt-soft); color: #4D5F0B; }
.chip .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.avatar { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: #fff; font: 700 15px/1 var(--display); font-stretch: 110%; letter-spacing: .02em; flex: none; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .18), 0 6px 14px -8px rgba(20, 26, 15, .5); }
.avatar.sm { width: 30px; height: 30px; border-radius: 9px; font-size: 11px; }
.avatar.lg { width: 68px; height: 68px; border-radius: 20px; font-size: 23px; }

/* ---------- herói (visão geral) ---------- */
.hero { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: center; min-height: 300px; padding: 34px 36px; border-radius: 26px; overflow: hidden; color: #EEF2E8;
  background: radial-gradient(70% 90% at 85% 40%, rgba(212, 242, 90, .16), transparent 60%), radial-gradient(60% 80% at 0% 100%, rgba(63, 91, 46, .55), transparent 65%), linear-gradient(135deg, #18210F, #0E130A); box-shadow: var(--shadow-hover); }
.hero::before { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background-image: linear-gradient(rgba(197, 219, 174, .05) 1px, transparent 1px), linear-gradient(90deg, rgba(197, 219, 174, .05) 1px, transparent 1px); background-size: 36px 36px;
  -webkit-mask: linear-gradient(90deg, #000, transparent 75%); mask: linear-gradient(90deg, #000, transparent 75%); }
.hero > * { position: relative; }
.hero .pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 100px; border: 1px solid rgba(197, 219, 174, .2); background: rgba(255, 255, 255, .04); font: 700 10.5px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: rgba(238, 242, 232, .8); }
.hero .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--volt); box-shadow: 0 0 0 4px rgba(212, 242, 90, .18); }
.hero h1 { font: 300 46px/1.05 var(--display); font-stretch: 112%; letter-spacing: -.03em; margin: 18px 0 14px; }
.hero h1 b { font-weight: 650; color: var(--volt); }
.hero p { color: rgba(238, 242, 232, .72); font-size: 15px; max-width: 58ch; margin: 0; }
.hero p b { color: #fff; }
.hero p .q { color: #F4B07F; font-weight: 700; }
.hero .acts { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
.esfera { width: 100%; height: 300px; cursor: crosshair; touch-action: none; }
.esfera circle { transition: none; }
.hero-kpis { display: flex; gap: 28px; margin-top: 26px; flex-wrap: wrap; }
.hero-kpis div { border-left: 1px solid rgba(197, 219, 174, .2); padding-left: 14px; }
.hero-kpis b { display: block; font: 600 26px/1 var(--display); font-stretch: 112%; color: #fff; }
.hero-kpis small { font-size: 11.5px; color: rgba(238, 242, 232, .6); }

/* ---------- blocos de números ---------- */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 18px; }
.stat { position: relative; padding: 20px 20px 18px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); overflow: hidden; }
.stat::before { content: ''; position: absolute; left: 0; top: 16px; bottom: 16px; width: 3px; border-radius: 0 3px 3px 0; background: var(--k, var(--leaf)); }
.stat .ico { position: absolute; right: 16px; top: 16px; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--k, var(--leaf)) 12%, transparent); color: var(--k, var(--leaf)); }
.stat .ico svg { width: 17px; height: 17px; }
.stat > b { display: block; font: 500 36px/1 var(--display); font-stretch: 112%; letter-spacing: -.02em; margin: 14px 0 6px; }
.stat small { color: var(--ink-3); font-size: 12.5px; }
.stat .up { color: var(--ok); font-weight: 700; } .stat .down { color: var(--bad); font-weight: 700; }
.stat.warn > b { color: var(--warn); }

/* ---------- cartões de cliente ---------- */
.clients { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.cc { position: relative; display: flex; flex-direction: column; min-width: 0; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow), inset 0 0 0 1px var(--line); cursor: pointer; overflow: hidden; transition: box-shadow .2s, transform .2s; text-align: left; border: 0; padding: 0; }
.cc:hover { box-shadow: var(--shadow-hover), inset 0 0 0 1px var(--line); transform: translateY(-3px); }
.cc:focus-visible { outline: 3px solid var(--volt); outline-offset: 3px; }
.cc::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 120px; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 10%, transparent), transparent); pointer-events: none; }
.cc-top { position: relative; display: flex; align-items: center; gap: 14px; padding: 22px 24px 16px; }
.cc-top .nm { flex: 1; min-width: 0; }
.cc-top .nm b { display: block; font: 500 24px/1.1 var(--display); font-stretch: 110%; letter-spacing: -.02em; }
.cc-top .nm small { color: var(--ink-3); font-size: 12.5px; display: block; margin-top: 3px; }
.cc-kpis { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 0 16px; }
.cc-kpi { padding: 14px 14px 12px; min-width: 0; border-radius: 14px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.cc-kpi .lab { font: 700 9.5px/1.2 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }
.cc-kpi .val { font: 600 21px/1.15 var(--display); font-stretch: 108%; letter-spacing: -.02em; margin: 8px 0 4px; }
.cc-kpi .val small { font: 600 12px var(--sans); color: var(--ink-3); letter-spacing: 0; }
.cc-kpi .sub { font-size: 12px; color: var(--ink-3); }
.cc-kpi .sub.warn { color: var(--warn); font-weight: 700; }
.cc-kpi .sub.bad { color: var(--bad); font-weight: 700; }
.spark { display: flex; align-items: flex-end; gap: 3px; height: 24px; margin-top: 8px; }
.spark i { flex: 1; border-radius: 3px 3px 1px 1px; background: var(--ink-4); opacity: .55; min-height: 2px; }
.spark i.on { background: var(--leaf); opacity: 1; }
.runway { height: 6px; border-radius: 100px; background: var(--sunken); margin-top: 10px; overflow: hidden; }
.runway i { display: block; height: 100%; border-radius: 100px; background: linear-gradient(90deg, var(--leaf), #7DAF3E); }
.runway i.warn { background: var(--ember); }
.runway i.bad { background: var(--bad); }
.cc-focus { padding: 16px 24px 4px; display: grid; gap: 12px; flex: 1; min-width: 0; }
.focus { display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
.focus .ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--sunken); color: var(--ink-2); flex: none; }
.focus .ic svg { width: 16px; height: 16px; }
.focus .tx { min-width: 0; flex: 1; }
.focus .tx b { display: block; font-weight: 700; font-size: 13.5px; }
.focus .tx small { display: block; color: var(--ink-3); font-size: 12.5px; }
.focus .tag { flex: none; }
.cc-foot { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 18px; padding: 14px 24px 18px; margin-top: 10px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 12.5px; }
.cc-foot b { color: var(--ink); font-weight: 700; }
.cc-foot .up { color: var(--ok); font-weight: 700; } .cc-foot .down { color: var(--bad); font-weight: 700; }
.cc-foot .go { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 700; }
.cc-foot .go svg { width: 14px; height: 14px; transition: transform .2s; }
.cc:hover .cc-foot .go svg { transform: translateX(3px); }
.pecas { display: flex; gap: 4px; margin-top: 6px; }
.pecas i { height: 4px; flex: 1; border-radius: 100px; background: var(--sunken); }
.pecas i.on { background: var(--leaf); }

/* ---------- painéis ---------- */
.panel { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); padding: 22px 24px; min-width: 0; }
.panel-h { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin-bottom: 16px; }
.panel-h .h2 { flex: 1; min-width: 140px; }
.panel-h small { color: var(--ink-3); }
.panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.panels.tres { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.panels .wide { grid-column: 1 / -1; }
.rows { display: grid; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top: 0; padding-top: 2px; }
.row .tx { flex: 1; min-width: 0; }
.row .tx b { display: block; font-weight: 600; }
.row .tx small { display: block; color: var(--ink-3); font-size: 12.5px; }
.row .n { width: 26px; height: 26px; border-radius: 8px; background: var(--sunken); display: grid; place-items: center; font: 700 12px var(--sans); color: var(--ink-2); flex: none; }
.row .acts { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; flex: none; opacity: .6; transition: opacity .15s; }
.row:hover .acts { opacity: 1; }
.empty { padding: 26px 8px; text-align: center; color: var(--ink-3); font-size: 13.5px; }
.empty b { display: block; color: var(--ink-2); font-weight: 700; margin-bottom: 4px; }
.big { font: 500 54px/1 var(--display); font-stretch: 112%; letter-spacing: -.03em; }
.meta-line { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-ink); font-size: 13.5px; margin-top: 16px; }
.alert.warn { background: var(--warn-soft); color: var(--warn); }
.alert.bad { background: var(--bad-soft); color: var(--bad); }
.alert svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
.ev { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
.ev:first-child { border-top: 0; }
.ev .day { text-align: center; padding: 7px 0; border-radius: 12px; background: var(--forest); color: #fff; }
.ev .day b { display: block; font: 600 22px/1 var(--display); font-stretch: 110%; }
.ev .day small { font: 700 9.5px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--volt); }
.ev .t { display: flex; align-items: flex-start; gap: 8px; }
.ev .t b { font-weight: 700; flex: 1; min-width: 0; }
.ev small.m { color: var(--ink-3); font-size: 12.5px; }
.pecas-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.peca { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 7px; min-height: 30px; padding: 4px 11px; border-radius: 9px; font-size: 12.5px; font-weight: 600; border: 1px dashed var(--line-2); background: none; color: var(--ink-3); cursor: pointer; }
.peca:hover { border-color: var(--leaf); color: var(--accent); }
.peca.tem { border-style: solid; color: var(--ink-2); background: var(--surface-2); }
.peca.feita { border-color: transparent; background: var(--ok-soft); color: var(--ok); }
.peca a { color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }
.peca svg { width: 13px; height: 13px; }

/* ---------- cabeçalho do cliente ---------- */
.ch { position: relative; display: flex; align-items: center; flex-wrap: wrap; gap: 18px 20px; margin-bottom: 22px; padding: 26px 28px; border-radius: 24px; background: var(--surface); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); overflow: hidden; }
.ch::before { content: ''; position: absolute; inset: 0; background: radial-gradient(60% 140% at 0% 0%, color-mix(in srgb, var(--c) 16%, transparent), transparent 70%); pointer-events: none; }
.ch > * { position: relative; }
.ch .tx { flex: 1; min-width: 240px; }
.ch .h1 { margin: 6px 0 4px; font-size: 40px; }
.ch .lede { font-size: 14px; }
.ch .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 13px; font-weight: 700; background: none; border: 0; cursor: pointer; padding: 0; margin-bottom: 16px; }
.back:hover { color: var(--ink); }
.back svg { width: 14px; height: 14px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 14px; background: var(--sunken); margin-bottom: 24px; width: fit-content; max-width: 100%; }
.tabs button { position: relative; min-height: 36px; border: 0; background: none; padding: 0 16px; border-radius: 10px; color: var(--ink-2); font-weight: 700; font-size: 13px; cursor: pointer; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); }

/* ---------- calendário ---------- */
.cal-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.cal-bar .mes { font: 400 28px/1 var(--display); font-stretch: 112%; letter-spacing: -.02em; min-width: 220px; }
.cal-filtros { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.fchip { display: inline-flex; align-items: center; gap: 7px; min-height: 30px; padding: 0 12px; border-radius: 100px; border: 1px solid var(--line-2); background: var(--surface); font-size: 12.5px; font-weight: 700; color: var(--ink-2); cursor: pointer; }
.fchip i { width: 8px; height: 8px; border-radius: 50%; }
.fchip[aria-pressed="false"] { opacity: .45; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); overflow: hidden; }
.cal .wd { padding: 12px 12px 10px; font: 700 10px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); border-bottom: 1px solid var(--line); background: var(--surface-2); }
.cal .d { min-height: 128px; padding: 8px 8px 10px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; cursor: pointer; min-width: 0; transition: background .15s; }
.cal .d:nth-child(7n+1) { border-left: 0; }
.cal .d:hover { background: var(--surface-2); }
.cal .d.fora { background: var(--surface-2); }
.cal .d.fora .dn { color: var(--ink-4); }
.cal .dn { font: 700 12.5px/1 var(--sans); color: var(--ink-2); padding: 4px 4px 6px; }
.cal .d.hoje .dn { display: inline-grid; place-items: center; width: 26px; height: 26px; padding: 0; border-radius: 50%; background: var(--volt); color: var(--forest); margin-bottom: 2px; }
.pc { display: flex; align-items: flex-start; gap: 6px; padding: 5px 7px; border-radius: 7px; background: var(--surface-2); box-shadow: inset 2px 0 0 var(--c); font-size: 11.5px; line-height: 1.3; min-width: 0; cursor: pointer; }
.pc:hover { background: var(--sunken); }
.pc b { font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.pc .st { width: 7px; height: 7px; border-radius: 50%; flex: none; margin-top: 3px; }
.pc.publicado { opacity: .62; }
.st-ideia { background: var(--ink-4); } .st-producao { background: var(--gold); } .st-aprovacao { background: var(--ember); } .st-agendado { background: var(--pulse); } .st-publicado { background: var(--ok); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--ink-3); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 7px; height: 7px; border-radius: 50%; }

/* ---------- resultados e dashboard ---------- */
.rk { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
.rk > div { position: relative; padding: 20px 20px 18px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); min-width: 0; }
.rk .lab { font: 700 10px/1.2 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }
.rk b { display: block; font: 500 32px/1 var(--display); font-stretch: 112%; letter-spacing: -.02em; margin: 12px 0 6px; }
.rk small { font-size: 12.5px; color: var(--ink-3); }
.rk .up { color: var(--ok); font-weight: 700; } .rk .down { color: var(--bad); font-weight: 700; }
.rk.cinco { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.rk > div.destaque { background: linear-gradient(140deg, #1A2412, #0E130A); color: #EEF2E8; box-shadow: var(--shadow-hover); }
.rk > div.destaque .lab, .rk > div.destaque small { color: rgba(238, 242, 232, .62); }
.rk > div.destaque b { color: var(--volt); }
.rk > div.destaque .up { color: var(--volt); }
.chart { width: 100%; height: auto; overflow: visible; }
.chart text { font: 600 11px var(--sans); fill: var(--ink-3); }
.chart .v { fill: var(--ink); font-weight: 700; }
.chart .gl { stroke: var(--line); }
.chart [data-tip] { cursor: default; }
.legend2 { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 10px; }
.legend2 i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.post-r { padding: 14px 0; border-top: 1px solid var(--line); }
.post-r:first-child { border-top: 0; padding-top: 0; }
.post-r b { font-weight: 700; display: block; margin-bottom: 6px; }
.post-r .nums { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-3); }
.post-r .nums strong { color: var(--ink); font-weight: 700; }
.why { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.why span { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 100px; }
.why .g { background: var(--ok-soft); color: var(--ok); }
.why .r { background: var(--warn-soft); color: var(--warn); }
.prose p { margin: 0 0 12px; color: var(--ink-2); line-height: 1.65; }
.prose ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; color: var(--ink-2); line-height: 1.55; }
.hbar { display: grid; grid-template-columns: minmax(96px, 150px) minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 8px 0; }
.hbar .nm { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; min-width: 0; }
.hbar .nm i { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.hbar .tr { position: relative; height: 12px; border-radius: 100px; background: var(--sunken); }
.hbar .tr i { position: absolute; top: 0; bottom: 0; border-radius: 100px; min-width: 4px; }
.hbar .tr .zero { position: absolute; top: -4px; bottom: -4px; width: 1px; background: var(--ink-4); }
.hbar .vl { font: 700 13px var(--sans); text-align: right; min-width: 64px; }
.tabela { width: 100%; border-collapse: collapse; font-size: 13px; }
.tabela th { text-align: left; font: 700 10px/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); padding: 0 12px 12px; border-bottom: 1px solid var(--line); }
.tabela td { padding: 13px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tabela tr:last-child td { border-bottom: 0; }
.tabela tbody tr { cursor: pointer; transition: background .15s; }
.tabela tbody tr:hover { background: var(--surface-2); }
.tabela .r { text-align: right; }
.tabela .cl { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.tab-wrap { overflow-x: auto; margin: 0 -8px; padding: 0 8px; }
.mini-org { display: flex; align-items: center; gap: 8px; }
.mini-org .b { width: 64px; height: 6px; border-radius: 100px; background: var(--pago); overflow: hidden; display: flex; gap: 1px; }
.mini-org .b i { background: var(--org); }
.top-post { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.top-post:first-child { border-top: 0; padding-top: 0; }
.top-post .pos { font: 600 22px/1 var(--display); font-stretch: 112%; color: var(--ink-4); text-align: center; }
.top-post:first-child .pos { color: var(--leaf); }
.top-post b { display: block; font-weight: 700; }
.top-post small { color: var(--ink-3); font-size: 12.5px; }
.top-post .tx2 { text-align: right; font: 700 13px var(--sans); }
.top-post .tx2 small { display: block; font-weight: 600; }
.mes-sel { display: flex; align-items: center; gap: 8px; }

/* ---------- marcos ---------- */
.linha-tempo { position: relative; display: grid; gap: 4px; }
.lt-ano { font: 300 30px/1 var(--display); font-stretch: 115%; letter-spacing: -.02em; color: var(--ink-3); margin: 18px 0 10px 64px; }
.lt-ano:first-child { margin-top: 0; }
.marco { position: relative; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; padding-bottom: 14px; }
.marco::before { content: ''; position: absolute; left: 25px; top: 46px; bottom: 0; width: 2px; background: linear-gradient(var(--line-2), var(--line)); }
.marco:last-child::before { display: none; }
.marco .mk { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: color-mix(in srgb, var(--k) 12%, var(--surface)); color: var(--k); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--k) 25%, transparent); }
.marco .mk svg { width: 21px; height: 21px; }
.marco .cx { min-width: 0; padding: 14px 18px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); transition: box-shadow .2s, transform .2s; }
.marco .cx.ed { cursor: pointer; }
.marco .cx.ed:hover { box-shadow: var(--shadow-hover), inset 0 0 0 1px var(--line); transform: translateX(2px); }
.marco .cx .t { display: flex; align-items: flex-start; flex-wrap: wrap; gap: 6px 10px; }
.marco .cx .t b { flex: 1; min-width: 180px; font: 600 16px/1.3 var(--sans); }
.marco .cx p { margin: 6px 0 0; color: var(--ink-2); font-size: 13.5px; }
.marco .cx .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 12px; color: var(--ink-3); font-weight: 600; }
.marco .cx .meta a { color: var(--accent); }
.marco.auto .mk { background: var(--forest); color: var(--volt); box-shadow: none; }
.marco.auto .cx { background: var(--surface-2); }
.marcos-tira { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.mt { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); cursor: pointer; border: 0; text-align: left; min-width: 0; transition: box-shadow .2s, transform .2s; }
.mt:hover { box-shadow: var(--shadow-hover), inset 0 0 0 1px var(--line); transform: translateY(-2px); }
.mt .tp { display: flex; align-items: center; gap: 8px; font: 700 10px/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--k); }
.mt .tp svg { width: 15px; height: 15px; }
.mt b { font: 600 15px/1.3 var(--sans); }
.mt small { color: var(--ink-3); font-size: 12px; display: flex; align-items: center; gap: 6px; margin-top: auto; }
.mt small i { width: 8px; height: 8px; border-radius: 3px; }

/* ---------- gaveta, toasts, dica, carregando ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(14, 19, 10, .32); backdrop-filter: blur(3px); animation: fade .18s ease-out; }
.drawer { position: fixed; z-index: 51; top: 12px; right: 12px; bottom: 12px; width: min(520px, calc(100vw - 24px)); display: flex; flex-direction: column; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow-pop); animation: slide .24s cubic-bezier(.2, .8, .2, 1); }
.drawer-h { display: flex; align-items: flex-start; gap: 12px; padding: 24px 24px 8px; }
.drawer-h .tx { flex: 1; min-width: 0; }
.drawer-h h3 { margin: 6px 0 0; font: 400 26px/1.15 var(--display); font-stretch: 110%; letter-spacing: -.02em; }
.drawer-b { flex: 1; overflow-y: auto; padding: 16px 24px 24px; display: grid; gap: 16px; align-content: start; }
.drawer-f { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px 24px; border-top: 1px solid var(--line); }
@keyframes fade { from { opacity: 0; } }
@keyframes slide { from { opacity: 0; transform: translateX(24px); } }
.toasts { position: fixed; z-index: 60; left: 50%; bottom: 24px; transform: translateX(-50%); display: grid; gap: 8px; justify-items: center; pointer-events: none; }
.toast { padding: 11px 16px; border-radius: 12px; background: var(--forest); color: #F2F5EC; font-weight: 600; box-shadow: var(--shadow-pop); animation: up .2s ease-out; max-width: 92vw; }
.toast.err { background: var(--bad); }
@keyframes up { from { opacity: 0; transform: translateY(8px); } }
.dica { position: fixed; z-index: 70; pointer-events: none; padding: 8px 11px; border-radius: 10px; background: var(--forest); color: #F2F5EC; font: 600 12px/1.4 var(--sans); box-shadow: var(--shadow-pop); max-width: 260px; opacity: 0; transition: opacity .12s; white-space: pre-line; }
.dica.on { opacity: 1; }
.loading, .gate { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 18px; text-align: center; padding: 24px; color: #EEF2E8;
  background: radial-gradient(80% 70% at 50% 0%, rgba(63, 91, 46, .6), transparent 70%), #0D1108; }
.loading canvas { width: min(440px, 86vw); height: min(300px, 46vh); display: block; }
.loading p { font: 700 11px/1 var(--sans); letter-spacing: .24em; text-transform: uppercase; opacity: .55; margin: 0; }
.gate .h1 { font-size: 38px; color: #fff; }
.gate .h1 i { color: var(--volt); }
.gate .lede { color: rgba(238, 242, 232, .7); }
.gate .logo-seok { width: 92px; height: 44px; background: var(--sage); }
.drop { border: 1.5px dashed var(--line-2); border-radius: 14px; padding: 26px; text-align: center; color: var(--ink-3); cursor: pointer; transition: border-color .15s, background .15s; }
.drop:hover, .drop.on { border-color: var(--leaf); background: var(--volt-soft); color: var(--accent-ink); }
.drop b { display: block; color: var(--ink); font-weight: 700; margin-bottom: 4px; }
.drop .ok { margin-top: 10px; color: var(--ok); font-size: 13px; }

/* ---------- página mais larga, perto das bordas ---------- */
.page { max-width: 1760px; padding: 24px 28px 80px; }

/* ---------- cartões de número interativos ---------- */
.stat { display: flex; flex-direction: column; min-height: 196px; text-align: left; border: 0; font: inherit; color: inherit; cursor: pointer; transition: transform .22s cubic-bezier(.2, .8, .2, 1), box-shadow .22s; }
.stat:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover), inset 0 0 0 1px color-mix(in srgb, var(--k) 40%, transparent); }
.stat:focus-visible { outline: 3px solid var(--volt); outline-offset: 3px; }
.stat .st-top { display: flex; align-items: center; gap: 10px; }
.stat .ico { position: static; flex: none; }
.stat .st-ir { margin-left: auto; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--k); background: color-mix(in srgb, var(--k) 12%, transparent); opacity: 0; transform: translateX(-6px); transition: opacity .2s, transform .2s; }
.stat .st-ir svg { width: 14px; height: 14px; }
.stat:hover .st-ir, .stat:focus-visible .st-ir { opacity: 1; transform: none; }
.stat > b { display: block; font: 500 44px/1 var(--display); font-stretch: 112%; letter-spacing: -.03em; margin: 16px 0 6px; }
.stat.warn > b { color: var(--warn); }
.st-viz { display: flex; gap: 6px; align-items: stretch; height: 58px; margin-top: auto; padding-top: 14px; }
.st-viz span { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
.st-viz i { position: relative; width: 100%; max-width: 26px; margin-top: auto; border-radius: 6px; background: color-mix(in srgb, var(--k) 20%, transparent); overflow: hidden; transition: transform .2s; transform-origin: bottom; }
.st-viz span:hover i { transform: scaleY(1.08); background: color-mix(in srgb, var(--k) 32%, transparent); }
.st-viz em { position: absolute; left: 0; right: 0; bottom: 0; background: var(--k); }
.st-viz b { font: 700 9.5px/1 var(--sans); color: var(--ink-4); }
.st-viz .hj b { color: var(--k); }
.st-viz .hj i { box-shadow: 0 0 0 2px color-mix(in srgb, var(--k) 45%, transparent); }
.st-seg { display: flex; gap: 3px; height: 10px; margin-top: auto; }
.st-seg i { border-radius: 100px; transition: transform .2s; }
.st-seg i:hover { transform: scaleY(1.6); }
.st-seg .vz { flex: 1; background: repeating-linear-gradient(-45deg, var(--sunken) 0 6px, transparent 6px 10px); box-shadow: inset 0 0 0 1px var(--line); }
.st-leg { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 9px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); }
.st-leg span { display: inline-flex; align-items: center; gap: 5px; }
.st-leg i { width: 7px; height: 7px; border-radius: 50%; }
.st-pontos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 12px; }
.st-pontos .p { position: relative; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 800 10px/1 var(--sans); color: var(--ink-2); background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--ok); transition: transform .2s; }
.st-pontos .p:hover { transform: scale(1.12); }
.st-pontos .p.warn { box-shadow: inset 0 0 0 2px var(--ember); }
.st-pontos .p.bad { box-shadow: inset 0 0 0 2px var(--bad); }
.st-pontos .p.bad::after { content: ''; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--bad); animation: alerta 2s ease-out infinite; }
@keyframes alerta { from { opacity: .7; transform: scale(.9); } to { opacity: 0; transform: scale(1.35); } }
.luz { position: relative; overflow: hidden; }
.luz::after { content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; opacity: 0; transition: opacity .25s;
  background: radial-gradient(240px circle at var(--mx, 50%) var(--my, 0%), color-mix(in srgb, var(--k, var(--volt)) 18%, transparent), transparent 65%); }
.luz:hover::after { opacity: 1; }
.hbar.fantasma .tr { background: repeating-linear-gradient(-45deg, var(--sunken) 0 6px, transparent 6px 10px); box-shadow: inset 0 0 0 1px var(--line); }
.hbar.fantasma .vl { color: var(--ink-4); }

/* ---------- seletor de tema ---------- */
.temas { display: inline-flex; padding: 3px; gap: 2px; border-radius: 100px; background: var(--sunken); }
.temas button { width: 32px; height: 30px; border: 0; border-radius: 100px; background: none; color: var(--ink-3); display: grid; place-items: center; cursor: pointer; transition: background .15s, color .15s; }
.temas button svg { width: 16px; height: 16px; }
.temas button:hover { color: var(--ink); }
.temas button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); }
.hero { --esf-a: #5E7A4A; --esf-b: #A9C98A; --esf-c: #D4F25A; --esf-anel: rgba(197, 219, 174, .22); --esf-anel2: rgba(212, 242, 90, .14); }

/* ---------- fundo dos temas (atrás de tudo) ---------- */
#fundo { position: fixed; inset: 0; z-index: 0; pointer-events: none; display: none; overflow: hidden; }
#fundo svg { width: 100%; height: 100%; }
.app { position: relative; z-index: 1; }
.flutua { animation: flutua 11s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
.flutua.d2 { animation-duration: 14s; animation-delay: -4s; }
.flutua.d3 { animation-duration: 17s; animation-delay: -8s; }
.respira { animation: respira 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.pulso-ecg { stroke-dasharray: 1600; animation: ecg 9s linear infinite; }
@keyframes flutua { from { transform: translateY(-10px) rotate(-2deg); } to { transform: translateY(12px) rotate(2deg); } }
@keyframes respira { 50% { transform: scale(1.07); opacity: .7; } }
@keyframes ecg { from { stroke-dashoffset: 3200; } to { stroke-dashoffset: 0; } }
.aurora { position: absolute; border-radius: 50%; width: 62vmax; height: 62vmax; animation: deriva 26s ease-in-out infinite alternate; }
.aurora.a1 { top: -26vmax; right: -14vmax; background: radial-gradient(circle, rgba(212, 242, 90, .20), transparent 62%); }
.aurora.a2 { top: 20vh; left: -26vmax; background: radial-gradient(circle, rgba(62, 196, 170, .17), transparent 62%); animation-duration: 32s; }
.aurora.a3 { bottom: -30vmax; right: 6vw; background: radial-gradient(circle, rgba(180, 140, 240, .16), transparent 62%); animation-duration: 38s; }
.aurora.a4 { top: 46vh; left: 38vw; width: 34vmax; height: 34vmax; background: radial-gradient(circle, rgba(255, 138, 76, .11), transparent 62%); animation-duration: 22s; }
@keyframes deriva { to { transform: translate(4vw, 5vh) scale(1.08); } }
.f-seok, .f-dark { display: none; }

/* =========================================================================================
   Tema Seok: papel creme, floresta e cobre, com elementos de wellness translúcidos atrás do conteúdo
   ========================================================================================= */
html[data-tema="seok"] {

  --pulse: #5AB0EC; --pulse-soft: rgba(90, 176, 236, .14); --plum: #B48CF0; --ember: #FF8A4C; --ember-soft: rgba(255, 138, 76, .14); --gold: #E0C24A;

  background: radial-gradient(60% 90% at 82% 30%, rgba(255, 255, 255, .45), transparent 60%), linear-gradient(118deg, #D4F25A 0%, #9BE59B 34%, #5ED0C2 64%, #6BA8F0 100%); box-shadow: 0 30px 80px -30px rgba(94, 208, 194, .55); }

/* A apresentação do mês continua clara em qualquer tema (é o que vai para o cliente). */
#apres { --bg: #F4F3EE; --surface: #FFFFFF; --surface-2: #FAFAF6; --sunken: #EEEDE6; --ink: #141A0F; --ink-2: #474E3F; --ink-3: #7E8477; --ink-4: #B7BAAF;
  --line: rgba(20, 26, 15, .08); --line-2: rgba(20, 26, 15, .14); --org: #3D7A3F; --pago: #2A84C2; --ok: #2F7A3F; --bad: #BE3A28; --warn: #C25A1F;
  --accent: #23432A; --leaf: #3F5B2E; --pine: #23432A; color: var(--ink); color-scheme: light; }

/* ---------- larguras ---------- */
@media (max-width: 1280px) { .marcos-tira { grid-template-columns: repeat(2, minmax(0, 1fr)); } .rk.cinco { grid-template-columns: repeat(3, minmax(0, 1fr)); } .panels.tres { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 1180px) { .clients, .panels { grid-template-columns: minmax(0, 1fr); } .hero { grid-template-columns: minmax(0, 1fr) 280px; } .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .rk { grid-template-columns: repeat(2, minmax(0, 1fr)); } .panels.tres { grid-template-columns: minmax(0, 1fr); } }

/* ---------- Apresentação do mês: slides 16:9 desenhados em 1280x720 e escalados para a tela; impressão = 1 slide por página ---------- */
#apres { position: fixed; inset: 0; z-index: 80; background: #E9E8E1; display: none; }
#apres.on { display: block; }
.ap-bar { position: absolute; left: 0; right: 0; top: 0; height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 20px; }
.ap-bar .t { font-weight: 700; } .ap-bar small { color: var(--ink-3); }
.ap-bar .sp { flex: 1; }
@media (max-width: 640px) { .ap-bar small, .ap-bar [data-ap-print] { display: none; } }
.ap-sel { height: 34px; margin-left: 8px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 9px; background: var(--surface); }
.ap-stage { position: absolute; left: 50%; top: calc(50% + 14px); width: 1280px; height: 720px; transform: translate(-50%, -50%) scale(var(--k, .8)); }
.slide { position: absolute; inset: 0; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow-pop); padding: 64px 72px; display: none; flex-direction: column; overflow: hidden; }
.slide.on { display: flex; }
.slide::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--c); }
.slide .k { font: 700 12px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 18px; }
.slide h2 { font: 300 56px/1.04 var(--display); font-stretch: 112%; margin: 0 0 28px; letter-spacing: -.03em; }
.slide h2 i { font-style: normal; font-weight: 650; color: var(--c); }
.slide .pe { margin-top: auto; display: flex; justify-content: space-between; color: var(--ink-3); font-size: 13px; padding-top: 20px; }
.slide .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; flex: 1; min-height: 0; }
.slide .big { font: 500 110px/1 var(--display); font-stretch: 112%; letter-spacing: -.03em; }
.slide .big small { font: 400 30px var(--display); color: var(--ink-3); }
.slide .txt { font-size: 20px; line-height: 1.5; color: var(--ink-2); }
.slide .lst { display: grid; gap: 0; }
.slide .lst > div { display: grid; grid-template-columns: 128px 1fr; gap: 16px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 16px; }
.slide .lst > div:first-child { border-top: 0; }
.slide .lst small { display: block; color: var(--ink-3); font-size: 14px; margin-top: 2px; }
.slide .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border: 1px solid var(--line); border-radius: 14px; margin-bottom: 28px; }
.slide .kpis > div { padding: 20px 24px; border-left: 1px solid var(--line); }
.slide .kpis > div:first-child { border-left: 0; }
.slide .kpis b { display: block; font: 500 42px/1.1 var(--display); font-stretch: 112%; margin: 8px 0 4px; }
.slide .kpis .lab, .slide .lab { font: 700 11px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.slide .chart text { font-size: 13px; }
.slide .pts { display: grid; gap: 14px; }
.slide .pts > div { display: grid; grid-template-columns: 36px 1fr; gap: 14px; font-size: 19px; line-height: 1.45; }
.slide .pts .n { width: 36px; height: 36px; border-radius: 50%; background: var(--sunken); display: grid; place-items: center; font: 700 14px var(--sans); }
.slide .pts .n svg { width: 16px; height: 16px; }
.slide .up { color: var(--ok); } .slide .down { color: var(--bad); }
.slide.capa { justify-content: flex-end; background: radial-gradient(70% 90% at 90% 20%, rgba(212, 242, 90, .18), transparent 60%), linear-gradient(135deg, #18210F, #0E130A); color: #fff; }
.slide.capa::before { display: block; height: 100%; width: 10px; right: auto; }
.slide.capa .k { color: var(--volt); }
.slide.capa h2 { font-size: 112px; margin-bottom: 12px; }
.slide.capa .txt { color: rgba(255, 255, 255, .8); font-size: 24px; }
.slide.capa .pe { color: rgba(255, 255, 255, .6); margin-top: 64px; }
.ap-dots { position: absolute; bottom: 14px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; }
.ap-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-4); }
.ap-dots i.on { background: var(--ink); width: 18px; border-radius: 3px; }
@media print {
  @page { size: 1280px 720px; margin: 0; }
  body > *:not(#apres) { display: none !important; }
  body::before { display: none; }
  #apres { position: static; background: none; display: block; }
  .ap-bar, .ap-dots { display: none !important; }
  .ap-stage { position: static; transform: none; width: auto; height: auto; }
  .slide { position: relative; display: flex !important; width: 1280px; height: 720px; border-radius: 0; box-shadow: none; break-after: page; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

// Partículas que formam o logo da SEOK enquanto carrega; o mouse empurra os pontos.
function particulas(canvas) {
  const ctx = canvas.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 2), mouse = { x: -1e4, y: -1e4 };
  let W = 0, H = 0, ps = [], logo = [], quadro = 0;
  function medir() { const r = canvas.getBoundingClientRect(); W = canvas.width = Math.max(1, Math.round(r.width * dpr)); H = canvas.height = Math.max(1, Math.round(r.height * dpr)); }
  function amostrar(img) {
    const larg = 240, alt = Math.round(larg * img.height / img.width), c = document.createElement('canvas'); c.width = larg; c.height = alt;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0, larg, alt);
    const px = g.getImageData(0, 0, larg, alt).data, pts = [];
    for (let y = 0; y < alt; y += 3) for (let x = 0; x < larg; x += 3) if (px[(y * larg + x) * 4 + 3] > 120) pts.push({ x: (x - larg / 2) / larg, y: (y - alt / 2) / larg });
    return pts;
  }
  function montar() {
    const n = Math.max(900, Math.min(1800, logo.length * 2)), ouro = Math.PI * (3 - Math.sqrt(5));
    ps = [];
    for (let i = 0; i < n; i++) {
      const y = 1 - (i / (n - 1)) * 2, raio = Math.sqrt(1 - y * y), t = ouro * i;
      ps.push({ e: { x: Math.cos(t) * raio, y: y, z: Math.sin(t) * raio }, x: W / 2 + (Math.random() - .5) * W * .1, y: H / 2 + (Math.random() - .5) * H * .1, vx: 0, vy: 0, l: logo.length ? logo[i % logo.length] : null, j: (Math.random() - .5) * .08 });
    }
  }
  function desenhar(t) {
    if (!canvas.isConnected) return;
    quadro = requestAnimationFrame(desenhar);
    const cx = W / 2, cy = H / 2, larg = Math.min(W * .78, H * 1.25) * .9, bal = Math.sin(t * .0006) * .18, rm = 80 * dpr;
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < ps.length; i++) {
      const p = ps[i], tx = p.l ? cx + p.l.x * larg * Math.cos(bal) : cx, ty = p.l ? cy + p.l.y * larg : cy, z = p.l ? p.l.x * Math.sin(bal) + p.j : 0;
      p.vx += (tx - p.x) * .075; p.vy += (ty - p.y) * .075;
      const dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy;
      if (d2 < rm * rm && d2 > .01) { const d = Math.sqrt(d2), f = 1 - d / rm; p.vx += dx / d * f * f * 9 * dpr; p.vy += dy / d * f * f * 9 * dpr; }
      p.vx *= .8; p.vy *= .8; p.x += p.vx; p.y += p.vy;
      const frente = 1 - (z + 1) / 2, tam = (1.3 + frente * 1.3) * dpr;
      ctx.globalAlpha = Math.min(1, .43 + frente * .66); ctx.fillStyle = '#F2F6EE';
      ctx.fillRect(p.x - tam / 2, p.y - tam / 2, tam, tam);
    }
    ctx.globalAlpha = 1;
  }
  canvas.addEventListener('mousemove', function (e) { const r = canvas.getBoundingClientRect(); mouse.x = (e.clientX - r.left) * dpr; mouse.y = (e.clientY - r.top) * dpr; });
  canvas.addEventListener('mouseleave', function () { mouse.x = mouse.y = -1e4; });
  medir();
  const img = new Image();
  img.onload = function () { try { logo = amostrar(img); } catch (e) { logo = []; } montar(); quadro = requestAnimationFrame(desenhar); };
  img.src = LOGO;
  return function () { cancelAnimationFrame(quadro); };
}

// Esfera de pontos em SVG: gira, respira devagar e abre um buraco por onde o mouse (ou o dedo) passa.
function esfera(svg) {
  const NS = 'http://www.w3.org/2000/svg', N = 560, W = 360, H = 300, cx = W / 2, cy = H / 2, R = 116, foco = 2.6, ouro = Math.PI * (3 - Math.sqrt(5));

    '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + (R + 54) + '" ry="' + (R * .5) + '" fill="none" style="stroke:var(--esf-anel2)" stroke-width="1" stroke-dasharray="2 6" transform="rotate(18 ' + cx + ' ' + cy + ')"/>';
  const g = document.createElementNS(NS, 'g'); svg.appendChild(g);
  const ps = [];
  for (let i = 0; i < N; i++) {
    const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), t = ouro * i, c = document.createElementNS(NS, 'circle');
    g.appendChild(c);
    ps.push({ e: { x: Math.cos(t) * r, y: y, z: Math.sin(t) * r }, x: cx, y: cy, vx: 0, vy: 0, c: c, k: -1 });
  }

    if (!svg.isConnected) return;
    if (!quieto) requestAnimationFrame(quadro);
    if (document.hidden) return;
    const ry = t * .00022, rx = .38 + Math.sin(t * .00018) * .12, resp = R * (1 + Math.sin(t * .0021) * .018);
    const a = Math.cos(ry), b = Math.sin(ry), c2 = Math.cos(rx), s2 = Math.sin(rx), rm = 46;
    for (let i = 0; i < N; i++) {
      const p = ps[i], e = p.e;
      let x = e.x * a - e.z * b, z = e.x * b + e.z * a; const y = e.y * c2 - z * s2; z = e.y * s2 + z * c2;
      const s = foco / (foco + z), tx = cx + x * resp * s, ty = cy + y * resp * s;
      p.vx += (tx - p.x) * .09; p.vy += (ty - p.y) * .09;
      const dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy;
      if (d2 < rm * rm && d2 > .01) { const d = Math.sqrt(d2), f = 1 - d / rm; p.vx += dx / d * f * f * 7; p.vy += dy / d * f * f * 7; }
      p.vx *= .78; p.vy *= .78; p.x += p.vx; p.y += p.vy;
      const frente = 1 - (z + 1) / 2, k = frente > .78 ? 2 : frente > .42 ? 1 : 0;
      p.c.setAttribute('cx', p.x.toFixed(1)); p.c.setAttribute('cy', p.y.toFixed(1)); p.c.setAttribute('r', (.55 + frente * 1.35).toFixed(2));
      p.c.setAttribute('fill-opacity', (.22 + frente * .78).toFixed(2));
      if (k !== p.k) { p.k = k; p.c.setAttribute('fill', cores[k]); }
    }
  }
  function mover(e) {
    const pt = e.touches ? e.touches[0] : e, r = svg.getBoundingClientRect(), k = Math.max(W / r.width, H / r.height);
    mouse.x = (pt.clientX - r.left - (r.width - W / k) / 2) * k; mouse.y = (pt.clientY - r.top - (r.height - H / k) / 2) * k;
  }
  function sair() { mouse.x = mouse.y = -1e4; }
  svg.addEventListener('mousemove', mover); svg.addEventListener('touchmove', mover, { passive: true });
  svg.addEventListener('mouseleave', sair); svg.addEventListener('touchend', sair);
  ps.forEach(function (p) { p.x = cx + (Math.random() - .5) * 30; p.y = cy + (Math.random() - .5) * 30; });
  if (quieto) for (let k = 0; k < 60; k++) quadro(0); else requestAnimationFrame(quadro);
}

function postsDe(id) { return S.d.posts.filter(function (p) { return p.clienteId === id; }); }

  };
  return '<div class="stats">' +
    card('semana', 'var(--leaf)', 'bolt', 'Nesta semana', semanaPosts.length, semanaPosts.filter(function (p) { return p.status === 'publicado'; }).length + ' publicados até agora', sem) +
    card('aprovacao', 'var(--pulse)', 'clock', 'Com o cliente', aprov, aprov ? 'aguardando aprovação de ' + porCli.length + ' cliente' + (porCli.length > 1 ? 's' : '') : 'nada esperando aprovação', seg(porCli.map(function (x) { return { n: x.n, cor: x.c.cor, t: x.c.nome }; }), 'Nenhum post em aprovação')) +
    card('pedidos', 'var(--plum)', 'inbox', 'Pedidos abertos', pedidos, 'de ' + d.clientes.length + ' clientes', seg([{ n: atr, cor: 'var(--bad)', t: 'Atrasados' }, { n: alta, cor: 'var(--ember)', t: 'Alta' }, { n: peds.length - atr - alta, cor: 'var(--plum)', t: 'No prazo' }], 'Nenhum pedido aberto')) +
    card('atencao', 'var(--ember)', 'alert', 'Pedem atenção', criticos.length, criticos.length ? 'de ' + ativos.length + ' clientes ativos' : 'todos em dia', pontos, criticos.length ? 'warn' : '') +
  '</div>';
}

function detalheStat(k) {
  const d = S.d, ini = addD(d.hoje, -dt(d.hoje).getDay()), fim = addD(ini, 6);
  const linhaPost = function (p) { const c = cli(p.clienteId); return '<div class="row" data-post-gaveta="' + esc(p.id) + '" style="cursor:pointer"><i class="st-' + p.status + '" style="width:8px;height:8px;border-radius:50%;flex:none"></i><div class="tx"><b>' + esc(p.titulo) + '</b><small>' + esc(c.nome + ' · ' + (p.data ? semana(p.data) : 'sem data') + ' · ' + p.formato) + '</small></div><span class="chip">' + NOME_ST[p.status] + '</span></div>'; };
  const vazio = function (t) { return '<div class="empty"><b>' + t + '</b></div>'; };
  const av = function (c) { return '<span class="avatar sm" style="background:' + esc(c.cor) + '">' + esc(iniciais(c.nome)) + '</span>'; };
  let titulo = '', corpo = '';
  if (k === 'semana') { const l = d.posts.filter(function (p) { return p.data >= ini && p.data <= fim; }).sort(function (a, b) { return a.data < b.data ? -1 : 1; }); titulo = 'Posts desta semana'; corpo = l.length ? '<div class="rows">' + l.map(linhaPost).join('') + '</div>' : vazio('Nenhum post programado nesta semana'); }
  if (k === 'aprovacao') { const l = d.posts.filter(function (p) { return p.status === 'aprovacao'; }); titulo = 'Com o cliente'; corpo = l.length ? '<div class="rows">' + l.map(linhaPost).join('') + '</div>' : vazio('Nada esperando aprovação'); }
  if (k === 'pedidos') {
    const l = d.pedidos.filter(function (p) { return p.status === 'aberto'; }).sort(function (a, b) { return (a.prazo || '9') < (b.prazo || '9') ? -1 : 1; }); titulo = 'Pedidos abertos';
    corpo = l.length ? '<div class="rows">' + l.map(function (p) { const c = cli(p.clienteId), atr = p.prazo && p.prazo < d.hoje; return '<div class="row" data-cli-gaveta="' + esc(p.clienteId) + '" style="cursor:pointer">' + av(c) + '<div class="tx"><b>' + esc(p.titulo) + '</b><small>' + esc(c.nome + ' · ' + (p.prazo ? 'prazo ' + curto(p.prazo) : 'sem prazo')) + '</small></div>' + (atr ? '<span class="chip bad">atrasado</span>' : p.prioridade === 'alta' ? '<span class="chip warn">alta</span>' : '') + '</div>'; }).join('') + '</div>' : vazio('Nenhum pedido aberto');
  }
  if (k === 'atencao') {
    titulo = 'Saúde dos clientes';
    corpo = '<div class="rows">' + d.clientes.filter(function (c) { return c.status !== 'pausa'; }).map(function (c) { const s = saude(c); return '<div class="row" data-cli-gaveta="' + esc(c.id) + '" style="cursor:pointer">' + av(c) + '<div class="tx"><b>' + esc(c.nome) + '</b><small>' + esc(c.nicho || c.obs || '') + '</small></div><span class="chip ' + s.k + '"><i class="d"></i>' + esc(s.t) + '</span></div>'; }).join('') + '</div>';
  }
  const g = gaveta({ eyebrow: 'Visão geral', titulo: titulo, corpo: corpo });
  g.el.addEventListener('click', function (e) {
    const p = e.target.closest('[data-post-gaveta]'), c = e.target.closest('[data-cli-gaveta]');
    if (p) { g.fechar(); formPost(S.d.posts.find(function (x) { return x.id === p.dataset.postGaveta; })); }
    if (c) { g.fechar(); abrirCliente(c.dataset.cliGaveta); }
  });
}

// Números que contam até o valor quando a tela aparece.
function contar(raiz) {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  $$('[data-conta]', raiz).forEach(function (el) {
    const alvo = Number(el.dataset.conta) || 0, t0 = performance.now();
    if (!alvo) return;
    const passo = function (t) { const k = Math.min(1, (t - t0) / 700), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(alvo * e); if (k < 1) requestAnimationFrame(passo); };
    requestAnimationFrame(passo);
  });
}

function cartaoCliente(c) {
  const f = freq(c), e = estoque(c), prox = proximo(c), s = saude(c), reps = reportsDe(c.id), r = reps[reps.length - 1], ra = reps[reps.length - 2];
  const maxS = Math.max.apply(null, f.sem.concat([f.meta, 1]));
  const pctRun = Math.min(100, Math.round(e.cobre * 100 / 28));
  const kFreq = '<div class="cc-kpi"><div class="lab">Frequência</div><div class="val num">' + n(f.real, 1) + (f.meta ? ' <small>/ ' + n(f.meta, 1) + ' por semana</small>' : ' <small>por semana</small>') + '</div>' +
    '<div class="spark" title="Posts publicados nas últimas 8 semanas">' + f.sem.map(function (v) { return '<i class="' + (f.meta && v >= f.meta ? 'on' : '') + '" style="height:' + Math.max(8, v * 100 / maxS) + '%"></i>'; }).join('') + '</div></div>';
  const kEst = '<div class="cc-kpi"><div class="lab">Estoque</div><div class="val num">' + e.prontos + ' <small>' + (e.prontos === 1 ? 'pronto' : 'prontos') + '</small></div>' +
    (e.ate ? '<div class="sub ' + (e.nivel === 'ok' ? '' : e.nivel) + '">cobre até ' + curto(e.ate) + '</div>' : '<div class="sub ' + (c.frequencia ? 'bad' : '') + '">' + (c.frequencia ? 'sem posts prontos' : 'sem meta definida') + '</div>') +
    '<div class="runway"><i class="' + (e.nivel === 'ok' ? '' : e.nivel) + '" style="width:' + pctRun + '%"></i></div></div>';
  const kProx = '<div class="cc-kpi"><div class="lab">Próximo post</div>' + (prox ? '<div class="val" style="font-size:17px">' + esc(semana(prox.data)) + '</div><div class="sub">' + esc(prox.formato + ' · ' + prox.titulo) + '</div>' :
    '<div class="val" style="font-size:17px;color:var(--ink-3)">—</div><div class="sub">nada programado</div>') + '</div>';
  const foco = focos(c).slice(0, 2);
  const res = r ? '<span>Seguidores <b class="num">' + nc(r.seguidores) + '</b>' + (ra && ra.seguidores ? ' <span class="' + (r.seguidores >= ra.seguidores ? 'up' : 'down') + '">' + (r.seguidores >= ra.seguidores ? '▲' : '▼') + ' ' + n(Math.abs((r.seguidores - ra.seguidores) * 100 / ra.seguidores), 1) + '%</span>' : '') + '</span>' +
      (r.alcanceOrganico || r.alcancePago ? '<span>Orgânico <b class="num">' + n(r.alcanceOrganico * 100 / Math.max(1, r.alcance || (r.alcanceOrganico + r.alcancePago)), 1) + '%</b></span>' : '') :
    '<span>Sem relatório da Reportei ainda</span>';
  return '<button type="button" class="cc" data-abrir="' + esc(c.id) + '" style="--c:' + esc(c.cor) + '">' +
    '<div class="cc-top">' + avatar(c) + '<div class="nm"><b>' + esc(c.nome) + '</b><small>' + esc(c.nicho || c.obs || 'Nicho a definir') + '</small></div>' +
      '<span class="chip ' + s.k + '"><i class="d"></i>' + s.t + '</span></div>' +
    '<div class="cc-kpis">' + kFreq + kEst + kProx + '</div>' +
    '<div class="cc-focus">' + (foco.length ? foco.join('') : '<div class="focus"><span class="ic">' + ic('idea') + '</span><span class="tx"><b>' + esc(c.obs || 'Tudo em ordem') + '</b><small>Nenhum ponto de foco agora.</small></span></div>') + '</div>' +
    '<div class="cc-foot">' + (r ? '<span>' + esc(mesNome(r.mes).split(' ')[0]) + '</span>' : '') + res + '<span class="go">Abrir ' + ic('arrow') + '</span></div></button>';
}

// O que cada cliente tem de mais importante agora, conforme os blocos dele.
function focos(c) {
  const out = [], b = c.blocos || [], hoje = S.d.hoje;
  if (b.indexOf('eventos') >= 0) {
    const ev = S.d.eventos.filter(function (e) { return e.clienteId === c.id && e.inicio.slice(0, 10) >= hoje; }).sort(function (a, x) { return a.inicio < x.inicio ? -1 : 1; })[0];
    const pecas = c.entregasEvento || [];
    if (ev) {
      const feitas = pecas.filter(function (t) { return (ev.entregas || {})[t]; }).length;
      out.push('<div class="focus"><span class="ic">' + ic('people') + '</span><span class="tx"><b>' + esc(ev.titulo) + '</b><small>' + esc(semana(ev.inicio)) + ' · ' + feitas + ' de ' + pecas.length + ' peças na pauta</small>' +
        '<div class="pecas">' + pecas.map(function (t) { return '<i class="' + ((ev.entregas || {})[t] ? 'on' : '') + '" title="' + esc(t) + '"></i>'; }).join('') + '</div></span><span class="chip accent tag">' + ev.pax + ' PAX</span></div>');
    } else out.push('<div class="focus"><span class="ic">' + ic('people') + '</span><span class="tx"><b>Nenhum treinamento futuro</b><small>Sincronize a agenda na página do cliente.</small></span></div>');
  }
  if (b.indexOf('cases') >= 0) {
    const fila = S.d.temas.filter(function (t) { return t.clienteId === c.id && t.tipo === 'case' && t.status === 'aberto'; }).sort(function (a, x) { return a.ordem - x.ordem; });
    out.push('<div class="focus"><span class="ic">' + ic('stack') + '</span><span class="tx"><b>' + (fila[0] ? 'Próximo case: ' + esc(fila[0].titulo) : 'Fila de cases vazia') + '</b><small>' + fila.length + ' na fila</small></span></div>');
  }
  if (b.indexOf('pedidos') >= 0) {
    const ps = S.d.pedidos.filter(function (p) { return p.clienteId === c.id && p.status === 'aberto'; }).sort(function (a, x) { return (a.prazo || '9') < (x.prazo || '9') ? -1 : 1; });
    if (ps.length) out.push('<div class="focus"><span class="ic">' + ic('inbox') + '</span><span class="tx"><b>' + esc(ps[0].titulo) + '</b><small>' + (ps.length === 1 ? '1 pedido aberto' : ps.length + ' pedidos abertos') + (ps[0].prazo ? ' · prazo ' + curto(ps[0].prazo) : '') + '</small></span>' +
      (ps[0].prazo && ps[0].prazo < hoje ? '<span class="chip bad tag">atrasado</span>' : ps[0].prioridade === 'alta' ? '<span class="chip warn tag">alta</span>' : '') + '</div>');
  }
  if (b.indexOf('temas') >= 0) {
    const t = S.d.temas.filter(function (x) { return x.clienteId === c.id && x.tipo === 'tema' && x.status === 'aberto'; });
    out.push('<div class="focus"><span class="ic">' + ic('idea') + '</span><span class="tx"><b>' + (t[0] ? esc(t[0].titulo) : 'Nenhum tema mapeado') + '</b><small>' + t.length + ' tema(s) que o cliente vê valor</small></span></div>');
  }
  if (b.indexOf('tendencias') >= 0) {
    const t = S.d.temas.filter(function (x) { return x.clienteId === c.id && x.tipo === 'tendencia' && x.status === 'aberto'; }).sort(function (a, x) { return x.criadoEm < a.criadoEm ? -1 : 1; });
    out.push('<div class="focus"><span class="ic">' + ic('trend') + '</span><span class="tx"><b>' + (t[0] ? esc(t[0].titulo) : 'Pesquise as tendências do nicho') + '</b><small>' + (t[0] ? esc(t[0].fonte || 'tendência') : esc(c.nicho || 'nicho a definir')) + '</small></span></div>');
  }
  return out;
}

// ======================================================================================
// Página do cliente
// ======================================================================================
function vCliente() {
  const c = cli(S.cli); if (!c) return '';
  const s = saude(c);
  return '<button class="back" data-ir-geral>' + ic('back') + 'Visão geral</button>' +
    '<div class="ch" style="--c:' + esc(c.cor) + '">' + avatar(c, 'lg') + '<div class="tx"><span class="eyebrow">' + esc(c.nicho || 'Nicho a definir') + '</span><h1 class="h1">' + esc(c.nome) + '</h1>' +
      '<p class="lede">' + esc(c.objetivo || c.obs || 'Defina o objetivo nos ajustes do cliente.') + '</p></div>' +
      '<div class="acts"><span class="chip ' + s.k + '"><i class="d"></i>' + s.t + '</span><button class="btn" data-apres="' + esc(c.id) + '">' + ic('play') + 'Apresentação do mês</button>' + (pode('editor') ? '<button class="btn primary" data-novo-post>' + ic('plus') + 'Novo post</button>' : '') + '</div></div>' +
    '<div class="tabs" role="tablist">' + [['visao', 'Visão'], ['calendario', 'Calendário'], ['resultados', 'Resultados'], ['marcos', 'Marcos'], ['ajustes', 'Ajustes do cliente']].map(function (t) {

function tVisao(c) {
  // Frequência abre a página ao lado do estoque (ou dos próximos posts, quando o cliente não controla estoque).
  const b = c.blocos || [], tem = function (k) { return b.indexOf(k) >= 0; }, P = [];
  if (tem('frequencia')) P.push(pFrequencia(c));
  if (tem('estoque')) P.push(pEstoque(c)); else P.push(pProximos(c));
  if (tem('eventos')) P.push(pEventos(c));
  if (tem('cases')) P.push(pTemas(c, 'case'));
  if (tem('temas')) P.push(pTemas(c, 'tema'));
  if (tem('tendencias')) P.push(pTendencias(c));
  if (tem('pedidos')) P.push(pPedidos(c));
  if (tem('estoque')) P.push(pProximos(c));
  return '<div class="panels">' + P.join('') + '</div>';
}

function pFrequencia(c) {
  const f = freq(c), max = Math.max.apply(null, f.sem.concat([f.meta, 1]));
  const W = 360, H = 120;
  const barras = f.sem.map(function (v, i) {
    const h = Math.max(2, v * (H - 30) / max), x = 6 + i * (W - 12) / 8, w = (W - 12) / 8 - 10;
    return '<g data-tip="' + v + ' post(s) na semana"><rect x="' + x + '" y="' + (H - 18 - h) + '" width="' + w + '" height="' + h + '" rx="3" fill="' + (f.meta && v >= f.meta ? 'var(--accent)' : 'var(--ink-4)') + '"/>' +
      '<text x="' + (x + w / 2) + '" y="' + (H - 4) + '" text-anchor="middle">' + (i === 7 ? 'agora' : '-' + (7 - i) + 's') + '</text></g>';
  }).join('');
  const yMeta = f.meta ? H - 18 - f.meta * (H - 30) / max : 0;
  return '<section class="panel"><div class="panel-h"><h2 class="h2">Frequência</h2><small>últimas 8 semanas</small></div>' +
    '<div style="display:flex;align-items:baseline;gap:10px"><span class="big num">' + n(f.real, 1) + '</span><span style="color:var(--ink-3)">posts por semana · média de 4 semanas</span></div>' +
    '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" style="margin-top:14px">' + barras + (f.meta ? '<line x1="0" x2="' + W + '" y1="' + yMeta + '" y2="' + yMeta + '" stroke="var(--warn)" stroke-dasharray="4 4"/><text x="' + W + '" y="' + (yMeta - 5) + '" text-anchor="end" class="v">meta ' + n(f.meta, 1) + '</text>' : '') + '</svg>' +
    (pode('editor') ? '<div class="meta-line"><span style="color:var(--ink-2);font-size:13px">Meta por semana</span><input class="input num" style="width:90px" type="number" min="0" max="30" step="0.5" id="meta-' + esc(c.id) + '" value="' + esc(c.frequencia || '') + '"><button class="btn sm" data-meta="' + esc(c.id) + '">Salvar</button></div>' : '') + '</section>';
}

function pEstoque(c) {
  const e = estoque(c);
  return '<section class="panel"><div class="panel-h"><h2 class="h2">Estoque de posts</h2><small>do que já está pronto</small></div>' +
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">' +
      '<div><span class="eyebrow">Prontos</span><div class="big num" style="font-size:44px;margin-top:8px">' + e.prontos + '</div><small style="color:var(--ink-3)">aprovação + agendados</small></div>' +
      '<div><span class="eyebrow">Agendados</span><div class="big num" style="font-size:44px;margin-top:8px">' + e.agendados + '</div><small style="color:var(--ink-3)">já na rede</small></div>' +
      '<div><span class="eyebrow">Em produção</span><div class="big num" style="font-size:44px;margin-top:8px">' + e.producao + '</div><small style="color:var(--ink-3)">ideia + produção</small></div></div>' +
    (e.ate ? '<div class="alert ' + (e.nivel === 'ok' ? '' : e.nivel) + '">' + ic(e.nivel === 'ok' ? 'check' : 'alert') + '<span>Posts prontos até <b>' + curto(e.ate) + '</b> (' + e.cobre + ' dias). ' +
      (e.nivel === 'ok' ? 'Comece o próximo lote até <b>' + curto(e.produzirAte) + '</b>.' : '<b>Produza o próximo lote agora</b> — a antecedência é de ' + (c.antecedencia || 7) + ' dias.') + '</span></div>'
      : '<div class="alert ' + (c.frequencia ? 'bad' : '') + '">' + ic('alert') + '<span>' + (c.frequencia ? 'Nenhum post pronto para os próximos dias. <b>Produza hoje.</b>' : 'Defina a meta de frequência para acompanhar o estoque.') + '</span></div>') + '</section>';
}

function peca(e, t) {
  const pid = (e.entregas || {})[t], p = pid && S.d.posts.find(function (x) { return x.id === pid; });
  if (!p) return pode('editor') ? '<button class="peca" data-peca="' + esc(e.id) + '" data-tipo="' + esc(t) + '">' + ic('plus') + esc(t) + '</button>' : '<span class="peca">' + esc(t) + '</span>';
  const links = (p.linkPost ? ' · <a href="' + esc(p.linkPost) + '" target="_blank" rel="noopener">' + (p.rede === 'LinkedIn' ? 'LinkedIn' : 'Instagram') + '</a>' : '') + (p.linkDrive ? ' · <a href="' + esc(p.linkDrive) + '" target="_blank" rel="noopener">Drive</a>' : '');
  return '<span class="peca tem ' + (p.status === 'publicado' ? 'feita' : '') + '" data-post="' + esc(p.id) + '">' + (p.status === 'publicado' ? ic('check') : '') + esc(t) + ' · ' + esc(NOME_ST[p.status]) + links + '</span>';
}

function evHtml(e, c) {
  const d = dt(e.inicio.slice(0, 10));
  return '<div class="ev"><div class="day"><b>' + d.getDate() + '</b><small>' + d.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '') + '</small></div><div>' +
    '<div class="t"><b>' + esc(e.titulo) + '</b><span class="chip accent">' + e.pax + ' PAX</span></div>' +
    '<small class="m">' + esc(d.toLocaleDateString('pt-BR', { weekday: 'long' })) + ' · ' + esc(new Date(e.inicio).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })) + (e.local ? ' · ' + esc(e.local) : '') + '</small>' +
    '<div class="pecas-row">' + (c.entregasEvento || []).map(function (t) { return peca(e, t); }).join('') + '</div></div></div>';
}

function pEventos(c) {
  const hoje = S.d.hoje, evs = S.d.eventos.filter(function (e) { return e.clienteId === c.id; }).sort(function (a, b) { return a.inicio < b.inicio ? -1 : 1; });
  const prox = evs.filter(function (e) { return e.inicio.slice(0, 10) >= hoje; }), pass = evs.filter(function (e) { return e.inicio.slice(0, 10) < hoje; }).reverse();
  const doMes = prox.filter(function (e) { return e.inicio.slice(0, 7) === hoje.slice(0, 7); }).length;
  const sinc = evs.reduce(function (m, e) { return e.sincronizadoEm > m ? e.sincronizadoEm : m; }, '');
  const fonte = c.agendaId || S.d.ajustes.agendaPadrao;
  return '<section class="panel wide"><div class="panel-h"><h2 class="h2">Treinamentos</h2><small>' + doMes + ' neste mês · ' + (fonte ? 'agenda de ' + esc(fonte) + ' · ' : '') + (sinc ? 'lida ' + br(sinc) : 'ainda não lida') + '</small>' +
      (pode('editor') ? '<button class="btn sm" data-agenda="' + esc(c.id) + '">' + ic('refresh') + 'Ler agenda</button>' : '') + '</div>' +
    '<div class="panels" style="gap:28px"><div><span class="eyebrow">Próximos</span>' + (prox.length ? prox.slice(0, 6).map(function (e) { return evHtml(e, c); }).join('') : '<div class="empty"><b>Nenhum treinamento futuro</b>Entram os eventos da agenda com o número de PAX.</div>') + '</div>' +
      '<div><span class="eyebrow">Já aconteceram</span>' + (pass.length ? pass.slice(0, 6).map(function (e) { return evHtml(e, c); }).join('') : '<div class="empty"><b>Nada nos últimos 60 dias</b></div>') + '</div></div></section>';
}

function pTemas(c, tipo) {
  const lista = S.d.temas.filter(function (t) { return t.clienteId === c.id && t.tipo === tipo && t.status === 'aberto'; }).sort(function (a, b) { return a.ordem - b.ordem; });
  const usados = S.d.temas.filter(function (t) { return t.clienteId === c.id && t.tipo === tipo && t.status === 'usado'; }).length;
  const fila = tipo === 'case';
  return '<section class="panel"><div class="panel-h"><h2 class="h2">' + (fila ? 'Fila de cases' : 'Temas mapeados') + '</h2><small>' + lista.length + ' na fila · ' + usados + ' já na pauta</small>' +

function vCalendario() {
  return '<div class="head"><div><span class="eyebrow">Todos os clientes</span><h1 class="h1">Calendário</h1><p class="lede">Clique num dia para criar um post, ou num post para editar.</p></div>' +
